<script>
/* Ranitas · Admin — Ricardo López Reyero (RLR) · _k=ROT13("RLR")="EYE" · _rev=18·12·18 */

const ROOT="ranitas", CLAVE_MAESTRA="123";   // usuario maestro (provisional)

  {t:"🫓 Gorditas (harina y maíz)",c:"g",items:["Chicharrón prensado","Chicharrón pella","Carne con chile","Picadillo","Guiso verde","Discada","Choriqueso","Rajas con crema","Rajas con crema y queso","Frijoles","Frijoles con queso","Huevo verde","Huevo rojo","Papas rojas","Asado","Deshebrada","Queso","Barbacoa","Combinada"]},

const SID=Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toArr=v=>Array.isArray(v)?v:(v&&typeof v==="object"?Object.values(v):[]);
const nombreDe=p=>(p.nombre||"").trim()||({papa:"Papá",mama:"Mamá",hijo:"Hijo",hija:"Hija"}[p.rol]||"Otro");

function fmtFecha(ts){ return ts?new Date(ts).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).replace(/\./g,""):""; }
function fmtRel(ts){ if(!ts) return ""; const d=(Date.now()-ts)/1000; if(d<60) return "ahora"; if(d<3600) return "hace "+Math.floor(d/60)+" min"; if(d<86400) return "hace "+Math.floor(d/3600)+" h"; return fmtFecha(ts); }
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),2000); }
function personLines(p){ const L=[]; toArr(p.gorditas).forEach(l=>L.push(l.cant+" "+l.guiso+(l.detalle?" ("+l.detalle+")":"")+" · "+(l.masa==="maiz"?"maíz":"harina")));
  if(p.chilaquiles){ const c=p.chilaquiles; const ex=toArr(c.extras).map(x=>x==="Guiso favorito"?(c.guiso?"guiso de "+c.guiso.toLowerCase():"guiso favorito"):x.toLowerCase());
    L.push((c.cant>1?c.cant+" ":"")+"Chilaquiles"+(c.salsa?" salsa "+c.salsa.toLowerCase():"")+(c.queso?" · queso "+c.queso.toLowerCase():"")+(ex.length?" + "+ex.join(" + "):"")); }
  toArr(p.bebidas).forEach(l=>L.push(l.cant+" "+l.nombre+(l.detalle?" ("+l.detalle+")":""))); toArr(p.postres).forEach(l=>L.push(l.cant+" "+l.nombre)); return L; }
function totales(c){ const t={g:0,h:0,m:0,ch:0,b:0,po:0,per:0}; toArr(c.personas).forEach(p=>{ if(personLines(p).length) t.per++; toArr(p.gorditas).forEach(l=>{ t.g+=+l.cant||0; if(l.masa==="maiz") t.m+=+l.cant||0; else t.h+=+l.cant||0; }); if(p.chilaquiles) t.ch+=+p.chilaquiles.cant||1; toArr(p.bebidas).forEach(l=>t.b+=+l.cant||0); toArr(p.postres).forEach(l=>t.po+=+l.cant||0); }); return t; }

function agrup(cards,fn){ const m={}; cards.forEach(c=>toArr(c.personas).forEach(p=>fn(p,(k,v)=>{ m[k]=(m[k]||0)+v; }))); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
const porGuiso=cards=>{ const m={}; cards.forEach(c=>toArr(c.personas).forEach(p=>toArr(p.gorditas).forEach(l=>{ m[l.guiso]=m[l.guiso]||{h:0,m:0}; m[l.guiso][l.masa==="maiz"?"m":"h"]+=+l.cant||0; }))); return Object.entries(m).sort((a,b)=>(b[1].h+b[1].m)-(a[1].h+a[1].m)); };

/* ---------- acceso: maestro + usuarios con vistas ---------- */
let usuarios={}, yo=null;

function entrar(clave){ if(clave===CLAVE_MAESTRA) return {id:"maestro",nombre:"Maestro",vistas:VISTAS.map(v=>v.id)}; const u=Object.entries(usuarios).find(([id,u])=>u&&u.clave===clave); return u?Object.assign({id:u[0]},u[1],{vistas:toArr(u[1].vistas)}):null; }

let tableros={}, anfitriones={}, catalogo={}, online=false, prev={}, first=true, flash={};
let vista=QS.get("v")||"panorama", fSuc=QS.get("suc")||"", fTab=QS.get("t")||"", pSuc=QS.get("suc")||"vinedos";
if(!VISTAS.some(v=>v.id===vista)) vista="panorama";
firebase.initializeApp(FIREBASE_CONFIG); const db=firebase.database();
db.ref(".info/connected").on("value",s=>{ online=!!s.val(); $("#dot").className="dot"+(online?" on":""); $("#conn").textContent=online?"en vivo":"sin conexión"; });
db.ref(ROOT+"/anfitriones").on("value",s=>{ anfitriones=s.val()||{}; render(); });
db.ref(ROOT+"/tableros").on("value",s=>{ tableros=s.val()||{}; render(); });
db.ref(ROOT+"/catalogo").on("value",s=>{ catalogo=s.val()||{}; render(); });
db.ref(ROOT+"/admin/usuarios").on("value",s=>{ usuarios=s.val()||{}; refrescarYo(); });
setInterval(render,30000);
function allCards(){ const out=[]; Object.keys(tableros).forEach(sl=>{ const t=tableros[sl]||{}; const cfg=t.config||{}; Object.keys(t.pedidos||{}).forEach(id=>{ const c=t.pedidos[id]; if(!c) return; out.push(Object.assign({},c,{id,slug:sl,personas:toArr(c.personas),sucursal:c.sucursal||cfg.sucursal||"",tablero:(anfitriones[sl]||{}).nombre||sl})); }); }); return out; }
function filtradas(){ return allCards().filter(c=>(!fSuc||c.sucursal===fSuc)&&(!fTab||c.slug===fTab)); }
function apagados(suc){ const c=catalogo[suc]||{}; return Object.keys(c).filter(k=>c[k]&&c[k].on===false); }
function nombreItem(k){ for(const g of CATALOGO) for(const i of g.items) if(catKey(g.c,i)===k) return i; return k; }
function syncUrl(){ const q=new URLSearchParams(); q.set("v",vista); if(vista==="pedidos"||vista==="panorama"){ if(fSuc) q.set("suc",fSuc); if(fTab) q.set("t",fTab); } if(vista==="productos"||vista==="precios") q.set("suc",pSuc); history.replaceState(null,"",location.pathname+"?"+q); }

/* ---------- menú ---------- */
function renderNav(){ const cards=allCards(); const vis=yo?yo.vistas:[];
  $("#nav").innerHTML=VISTAS.filter(v=>vis.includes(v.id)).map(v=>{ let n=""; if(v.id==="pedidos") n=cards.filter(c=>c.estado==="pedido").length||""; if(v.id==="productos"){ const a=SUCURSALES.reduce((s,x)=>s+apagados(x.id).length,0); n=a||""; } if(v.id==="usuarios") n=Object.keys(usuarios).length+1; return `<button class="${vista===v.id?"on":""}" data-v="${v.id}">${v.e} ${v.n}${n!==""?`<span class="n">${n}</span>`:""}</button>`; }).join("");
  $("#who").textContent=yo?yo.nombre:""; }
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-v]"); if(!b) return; vista=b.dataset.v; syncUrl(); render(); });
function render(){ if(!yo) return; if(!yo.vistas.includes(vista)) vista=yo.vistas[0]; if(!vista) return; renderNav(); ({panorama:renderPanorama,pedidos:renderPedidos,productos:renderProductos,precios:renderPrecios,usuarios:renderUsuarios})[vista](); }
function filtrosHTML(){ const sl=Object.keys(anfitriones).sort((a,b)=>(anfitriones[a].nombre||a).localeCompare(anfitriones[b].nombre||b));
  return `<select id="fSuc"><option value="">📍 Todas las sucursales</option>${SUCURSALES.map(s=>`<option value="${s.id}"${fSuc===s.id?" selected":""}>📍 ${s.n}</option>`).join("")}</select>
  <select id="fTab"><option value="">🏠 Todos los tableros</option>${sl.map(k=>`<option value="${k}"${fTab===k?" selected":""}>🏠 ${esc(anfitriones[k].nombre||k)} · /${k}</option>`).join("")}</select>`; }
document.addEventListener("change",e=>{ if(e.target.id==="fSuc"){ fSuc=e.target.value; syncUrl(); render(); } if(e.target.id==="fTab"){ fTab=e.target.value; syncUrl(); render(); } if(e.target.id==="pSuc"){ pSuc=e.target.value; syncUrl(); render(); } });

/* ---------- 1. PANORAMA: capa 1 = ahora mismo · capa 2 = acumulado para decidir ---------- */
function renderPanorama(){
  const cards=filtradas(); const hoy=new Date(); hoy.setHours(0,0,0,0); const t0=hoy.getTime();
  const por={}; ETAPAS.forEach(e=>por[e.id]=cards.filter(e.f));
  const cocina=por.proceso, viene=por.armando.concat(por.porpedir), calle=por.espera.concat(por.repartiendo);
  const entHoy=cards.filter(c=>(c.estado==="entregado"||c.estado==="archivado")&&(c.entregadoEn||0)>=t0);
  const pedHoy=cards.filter(c=>(c.pedidoEn||0)>=t0);
  const hist=cards.filter(c=>c.estado==="entregado"||c.estado==="archivado"||c.estado==="pedido");
  const TH=sumT(hist), Tc=sumT(cocina), Tv=sumT(viene), TeH=sumT(entHoy);
  const personasActivas=viene.concat(cocina,calle).reduce((s,c)=>s+totales(c).per,0);
  const tablerosActivos=new Set(viene.concat(cocina,calle).map(c=>c.slug)).size;
  const guisosCocina=porGuiso(cocina), guisosViene=porGuiso(viene), guisosHist=porGuiso(hist);
  const bebHist=agrup(hist,(p,add)=>toArr(p.bebidas).forEach(l=>add(l.nombre,+l.cant||0))), posHist=agrup(hist,(p,add)=>toArr(p.postres).forEach(l=>add(l.nombre,+l.cant||0)));
  const salsas=agrup(hist,(p,add)=>{ if(p.chilaquiles&&p.chilaquiles.salsa) add(p.chilaquiles.salsa,+p.chilaquiles.cant||1); });
  const horas={}; hist.forEach(c=>{ if(c.pedidoEn){ const h=new Date(c.pedidoEn).getHours(); horas[h]=(horas[h]||0)+1; } }); const horaPico=Object.entries(horas).sort((a,b)=>b[1]-a[1])[0];
  const dias={}; for(let i=13;i>=0;i--){ const d=new Date(t0-i*86400e3); dias[d.toDateString()]={d,g:0,n:0}; } hist.forEach(c=>{ const k=new Date(c.pedidoEn||c.actualizado).toDateString(); if(dias[k]){ dias[k].n++; dias[k].g+=totales(c).g; } }); const maxDia=Math.max(1,...Object.values(dias).map(x=>x.g));
  const tabla=(rows,cols)=>`<div class="card" style="overflow:auto;padding:8px 10px"><table><thead><tr>${cols.map((c,i)=>`<th${i?' class="n"':""}>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  const etapasRows=ETAPAS.map(e=>{ const T=sumT(por[e.id]); return `<tr><td>${e.n}</td><td class="n">${T.n}</td><td class="n">${T.per}</td><td class="n"><b>${T.g}</b> <small style="color:var(--mut)">${T.h}H·${T.m}M</small></td><td class="n">${T.ch}</td><td class="n">${T.b}</td><td class="n">${T.po}</td></tr>`; }).join("")+(()=>{ const T=sumT(cards); return `<tr class="tot"><td>Total</td><td class="n">${T.n}</td><td class="n">${T.per}</td><td class="n">${T.g} <small>${T.h}H·${T.m}M</small></td><td class="n">${T.ch}</td><td class="n">${T.b}</td><td class="n">${T.po}</td></tr>`; })();
  const guisoRows=(arr,max)=>arr.length?arr.slice(0,max).map(([k,v])=>{ const t=v.h+v.m, top=arr[0][1].h+arr[0][1].m; return `<tr><td>${esc(k)}<div class="bar"><i class="h" style="width:${pct(v.h,top)}%"></i><i class="m" style="width:${pct(v.m,top)}%"></i></div></td><td class="n"><b>${t}</b></td><td class="n">${v.h}</td><td class="n">${v.m}</td></tr>`; }).join(""):`<tr><td colspan="4" class="empty">Nada por ahora</td></tr>`;
  $("#main").innerHTML=`
  <div class="top"><h1>📊 Panorama</h1><span class="sp"></span>${filtrosHTML()}<div class="sub">Se mueve solo, en tiempo real. Capa 1: lo que está pasando ahora. Capa 2: lo acumulado para decidir compras, personal y menú.</div></div>

  <div class="sec"><span class="capa">Capa 1 · ahora mismo</span><h2>Operación</h2><span>${personasActivas} persona${personasActivas===1?"":"s"} pidiendo en ${tablerosActivos} tablero${tablerosActivos===1?"":"s"}</span></div>
  <div class="grid kpis">
    <div class="kpi"><div class="v">${por.armando.length}</div><div class="l">Armando</div><div class="d">${Tv.g} gorditas en camino de pedirse</div></div>
    <div class="kpi"><div class="v">${por.porpedir.length}</div><div class="l">Por pedir</div><div class="d">listas, el anfitrión aún no manda</div></div>
    <div class="kpi k2"><div class="v">${cocina.length}</div><div class="l">En cocina</div><div class="d">${Tc.g} gorditas · ${Tc.ch} chilaquiles</div></div>
    <div class="kpi k3"><div class="v">${por.espera.length}</div><div class="l">Esperan repartidor</div><div class="d">${sumT(por.espera).g} gorditas listas</div></div>
    <div class="kpi k4"><div class="v">${por.repartiendo.length}</div><div class="l">En camino</div><div class="d">${sumT(por.repartiendo).g} gorditas en la calle</div></div>
    <div class="kpi k5"><div class="v">${entHoy.length}</div><div class="l">Entregados hoy</div><div class="d">${TeH.g} gorditas · ${TeH.per} personas</div></div>
  </div>

  <div class="sec"><h2>Por etapa</h2><span>pedidos, personas y productos en cada paso</span></div>
  ${tabla(etapasRows,["Etapa","Pedidos","Personas","Gorditas","Chilaquiles","Bebidas","Postres"])}

  <div class="grid two" style="margin-top:12px">
    <div><div class="sec" style="margin-top:6px"><h2>🍳 Cocina ahora</h2><span>lo que hay que estar haciendo · ${Tc.g} gorditas (${Tc.h} harina · ${Tc.m} maíz)</span></div>
      ${tabla(guisoRows(guisosCocina,19),["Guiso","Total","Harina","Maíz"])}</div>
    <div><div class="sec" style="margin-top:6px"><h2>⏭️ Lo que viene</h2><span>armando + por pedir · ${Tv.g} gorditas · prepara masa y guisos</span></div>
      ${tabla(guisoRows(guisosViene,10),["Guiso","Total","Harina","Maíz"])}</div>
  </div>

  <div class="sec"><h2>📍 Sucursales</h2><span>carga y productos apagados</span></div>
  <div class="grid kpis">${SUCURSALES.map(s=>{ const cs=cards.filter(c=>c.sucursal===s.id); const act=cs.filter(c=>c.estado==="pedido"); const ap=apagados(s.id); return `<div class="kpi ${ap.length?"k2":"k5"}"><div class="v">${act.length}</div><div class="l">${esc(s.n)}</div><div class="d">${sumT(act).g} gorditas activas · ${cs.filter(c=>c.estado==="armando"||c.estado==="porpedir").length} por venir</div><div class="d">${ap.length?`<span class="b off">⛔ ${ap.length} apagado${ap.length>1?"s":""}</span> ${esc(ap.map(nombreItem).join(", "))}`:`<span class="b ok">todo prendido</span>`}</div></div>`; }).join("")}</div>

  <div class="sec"><span class="capa">Capa 2 · acumulado</span><h2>Para decidir</h2><span>${hist.length} pedidos con ${TH.per} personas · ${TH.g} gorditas en total</span></div>
  <div class="grid kpis">
    <div class="kpi"><div class="v">${TH.per?(TH.g/TH.per).toFixed(1):"–"}</div><div class="l">Gorditas por persona</div><div class="d">promedio histórico</div></div>
    <div class="kpi"><div class="v">${hist.length?(TH.g/hist.length).toFixed(1):"–"}</div><div class="l">Gorditas por pedido</div><div class="d">${hist.length?(TH.per/hist.length).toFixed(1):"–"} personas por pedido</div></div>
    <div class="kpi k3"><div class="v">${pct(TH.h,TH.g)}%</div><div class="l">Harina vs maíz</div><div class="d">${TH.h} harina · ${TH.m} maíz</div><div class="bar"><i class="h" style="width:${pct(TH.h,TH.g)}%"></i></div></div>
    <div class="kpi k4"><div class="v">${pct(TH.ch,TH.per)}%</div><div class="l">Piden chilaquiles</div><div class="d">${TH.ch} platos · salsa top: ${salsas[0]?esc(salsas[0][0]):"–"}</div></div>
    <div class="kpi k5"><div class="v">${pct(TH.b,TH.per)}%</div><div class="l">Piden bebida</div><div class="d">${bebHist[0]?esc(bebHist[0][0])+" "+bebHist[0][1]:"–"}</div></div>
    <div class="kpi k5"><div class="v">${pct(TH.po,TH.per)}%</div><div class="l">Piden postre</div><div class="d">${posHist[0]?esc(posHist[0][0])+" "+posHist[0][1]:"–"}</div></div>
    <div class="kpi k6"><div class="v">${horaPico?horaPico[0]+":00":"–"}</div><div class="l">Hora pico</div><div class="d">${horaPico?horaPico[1]+" pedidos a esa hora":"sin datos"} · hoy ${pedHoy.length} pedidos</div></div>
    <div class="kpi k6"><div class="v">${Object.keys(anfitriones).length}</div><div class="l">Anfitriones</div><div class="d">${new Set(hist.map(c=>c.slug)).size} han pedido</div></div>
  </div>
  <div class="grid two" style="margin-top:12px">
    <div><div class="sec" style="margin-top:6px"><h2>🏆 Guisos más pedidos</h2><span>histórico, con reparto harina / maíz</span></div>${tabla(guisoRows(guisosHist,12),["Guiso","Total","Harina","Maíz"])}</div>
    <div><div class="sec" style="margin-top:6px"><h2>📅 Últimos 14 días</h2><span>gorditas por día (base para predecir)</span></div>
      <div class="card list">${Object.values(dias).map(x=>`<div><div class="row"><span>${x.d.toLocaleDateString("es-MX",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"")}</span><span>${x.g} <small>${x.n} pedido${x.n===1?"":"s"}</small></span></div><div class="bar"><i style="width:${pct(x.g,maxDia)}%"></i></div></div>`).join("")}</div>
      <div class="sec" style="margin-top:14px"><h2>☕ Bebidas · 🍰 Postres · 🌶 Salsas</h2></div>
      <div class="card list">${bebHist.map(([k,v])=>`<div class="row"><span>☕ ${esc(k)}</span><span>${v}</span></div>`).join("")}${posHist.map(([k,v])=>`<div class="row"><span>🍰 ${esc(k)}</span><span>${v}</span></div>`).join("")}${salsas.map(([k,v])=>`<div class="row"><span>🌶 ${esc(k)}</span><span>${v}</span></div>`).join("")}${(bebHist.length+posHist.length+salsas.length)?"":`<div class="empty">Sin datos todavía</div>`}</div></div>
  </div>
  <p style="color:var(--mut);font-weight:700;font-size:12px;margin-top:16px">Próximo paso: guardar un corte diario por sucursal para análisis y predicción de compras.</p>`;
}

/* ---------- 2. PEDIDOS (kanban del negocio) ---------- */
function renderPedidos(){
  const cards=filtradas(); const snap={}; const now=Date.now(); Object.keys(flash).forEach(k=>{ if(now-flash[k]>1600) delete flash[k]; });
  cards.forEach(c=>{ snap[c.id]=JSON.stringify(c); if(!first&&c._w!==SID&&prev[c.id]!==snap[c.id]) flash[c.id]=now; }); prev=snap; first=false;
  const Tc=sumT(cards.filter(ETAPAS[2].f));
  $("#main").innerHTML=`<div class="top"><h1>📋 Pedidos</h1><span class="sp"></span>${filtrosHTML()}<div class="sub">🍳 En cocina ahora: ${esc(totStr(Tc))} · toca los botones para avanzar cada pedido; las familias lo ven al instante.</div></div>
  <div class="board">${ETAPAS.map(e=>{ const cs=cards.filter(e.f).sort((a,b)=>(b.actualizado||0)-(a.actualizado||0)); return `<section class="col k${e.k}"><div class="col-head"><span>${e.n}</span><span class="n">${cs.length}</span></div><div class="cards">${cs.length?cs.map(cardHTML).join(""):`<div class="empty">Nada por aquí</div>`}</div></section>`; }).join("")}</div>`;
}
function cardHTML(c){
  const suc=SUCURSALES.find(s=>s.id===c.sucursal); const cfg=(tableros[c.slug]||{}).config||{};
  const persons=c.personas.map(p=>{ const L=personLines(p); return L.length?`<div class="pl">${ROLES[p.rol]||"🙂"} <b>${esc(nombreDe(p))}</b>: ${esc(L.join(" · "))}</div>`:""; }).join("")||`<div class="pl"><i>sin productos</i></div>`;
  const A={
    armando:`<span class="b wip">✏️ armando…</span>`,
    porpedir:`<span class="b ok">✅ Lista · el anfitrión aún no manda el WhatsApp</span>`,
    pedido:(!c.etapa||c.etapa==="proceso")?`<button class="btn bl" data-a="etapa" data-v="espera" data-id="${c.id}" data-s="${c.slug}">⏳ Listo, espera repartidor</button>`:
           c.etapa==="espera"?`<button class="btn v" data-a="etapa" data-v="repartiendo" data-id="${c.id}" data-s="${c.slug}">🛵 Salió a repartir</button><button class="btn ghost" data-a="etapa" data-v="proceso" data-id="${c.id}" data-s="${c.slug}">↩︎</button>`:
           `<button class="btn p" data-a="entregar" data-id="${c.id}" data-s="${c.slug}">✅ Entregado</button><button class="btn ghost" data-a="etapa" data-v="espera" data-id="${c.id}" data-s="${c.slug}">↩︎</button>`,
    entregado:`<button class="btn" data-a="archivar" data-id="${c.id}" data-s="${c.slug}">📦 Archivar</button><button class="btn ghost" data-a="etapa" data-v="repartiendo" data-id="${c.id}" data-s="${c.slug}" data-back="1">↩︎</button>`,
    archivado:``
  }[c.estado]||"";
  return `<article class="pc${flash[c.id]?" flash":""}">
    <div class="pc-top"><h3>Familia ${esc(c.familia||"sin nombre")}</h3><span class="when">${fmtRel(c.actualizado)}</span></div>
    <div class="badges"><span class="b tab">🏠 ${esc(c.tablero)}</span>${suc?`<span class="b suc">📍 ${esc(suc.n)}</span>`:""}${c.estado==="pedido"?`<span class="b">📲 ${fmtFecha(c.pedidoEn)}</span>`:""}${c.estado==="entregado"?`<span class="b ok">🛵 ${fmtFecha(c.entregadoEn)}</span>`:""}${cfg.entrega?`<span class="b">⏰ ${esc(cfg.entrega)}</span>`:""}</div>
    <div>${persons}</div>${c.notas?`<div class="notas">📝 ${esc(c.notas)}</div>`:""}
    ${c.estado!=="armando"&&cfg.direccion?`<div class="notas">🏠 ${esc(cfg.direccion)}${cfg.telAnfitrion?" · 📞 "+esc(cfg.telAnfitrion):""}</div>`:""}
    <div class="tot">${esc(totStr(totales(c)))}</div><div class="acts">${A}</div></article>`;
}
function upd(slug,id,patch){ patch.actualizado=Date.now(); patch._w=SID; db.ref(ROOT+"/tableros/"+slug+"/pedidos/"+id).update(patch).catch(()=>toast("No se pudo guardar")); }

/* ---------- 3. PRODUCTOS (prender / apagar por sucursal) ---------- */
function sucSelect(){ return `<select id="pSuc">${SUCURSALES.map(x=>{ const a=apagados(x.id).length; return `<option value="${x.id}"${x.id===pSuc?" selected":""}>📍 ${x.n}${a?" · "+a+" apagado"+(a>1?"s":""):""}</option>`; }).join("")}</select>`; }
function renderProductos(){ const c=catalogo[pSuc]||{}; const ap=apagados(pSuc).length;
  $("#main").innerHTML=`<div class="top"><h1>🏪 Productos</h1>${sucSelect()}<div class="sub">Toca un producto para apagarlo o prenderlo. Se refleja al instante en todos los tableros que piden a esta sucursal: sale en rojo como agotado y no se puede mandar hasta ajustar. ${ap?`<b style="color:var(--r)">${ap} apagado${ap>1?"s":""}</b>`:"Todo prendido ✅"}</div></div>`+
  CATALOGO.map(g=>{ const offs=g.items.filter(i=>(c[catKey(g.c,i)]||{}).on===false).length; return `<div class="grp"><h3>${g.t}<span>${offs?offs+" apagado"+(offs>1?"s":""):"todo prendido"}</span></h3><div class="items">${g.items.map(i=>{ const k=catKey(g.c,i); const v=c[k]||{}; const off=v.on===false; return `<div class="item${off?" off":""}" data-k="${k}" data-n="${esc(i)}"><span class="sw"></span><span>${esc(i)}</span></div>`; }).join("")}</div></div>`; }).join(""); }
document.addEventListener("click",e=>{ const it=e.target.closest(".item"); if(!it||vista!=="productos") return; const k=it.dataset.k; const cur=((catalogo[pSuc]||{})[k]||{}); const on=cur.on===false;
  db.ref(ROOT+"/catalogo/"+pSuc+"/"+k).update({on,precio:cur.precio||null,ts:Date.now()}).then(()=>toast((on?"✅ Prendido: ":"⛔ Apagado: ")+it.dataset.n)).catch(()=>toast("No se pudo guardar")); });

/* ---------- 4. PRECIOS (por sucursal; aún no se muestran a las familias) ---------- */
function renderPrecios(){ const c=catalogo[pSuc]||{}; const conPrecio=Object.values(c).filter(v=>v&&v.precio).length;
  $("#main").innerHTML=`<div class="top"><h1>💲 Precios</h1>${sucSelect()}<button class="btn ghost" id="copiarPrecios" title="Copiar los precios de otra sucursal">📋 Copiar de…</button><div class="sub">Cada sucursal puede tener su precio. Se guardan solos al salir del campo. Por ahora <b>no se muestran a las familias</b>; cuando quieras, se activan en tableros y mensaje. ${conPrecio?conPrecio+" con precio":"Sin precios capturados"}.</div></div>`+
  CATALOGO.filter(g=>["g","ch","b","po"].includes(g.c)).map(g=>`<div class="grp"><h3>${g.t}</h3><div class="items">${g.items.map(i=>{ const k=catKey(g.c,i); const v=c[k]||{}; return `<div class="price${v.on===false?" off":""}"><span>${esc(i)}</span><input type="number" inputmode="decimal" min="0" step="1" placeholder="$" value="${v.precio!=null?esc(v.precio):""}" data-k="${k}" data-n="${esc(i)}"></div>`; }).join("")}</div></div>`).join(""); }
document.addEventListener("change",e=>{ const inp=e.target.closest(".price input"); if(!inp||vista!=="precios") return; const k=inp.dataset.k; const val=inp.value===""?null:+inp.value; const cur=((catalogo[pSuc]||{})[k]||{});
  db.ref(ROOT+"/catalogo/"+pSuc+"/"+k).update({on:cur.on!==false,precio:val,ts:Date.now()}).then(()=>toast(val==null?"Precio borrado: "+inp.dataset.n:inp.dataset.n+" · $"+val)).catch(()=>toast("No se pudo guardar")); });
document.addEventListener("click",e=>{ if(e.target.id!=="copiarPrecios") return; const otras=SUCURSALES.filter(s=>s.id!==pSuc); const pick=prompt("¿De qué sucursal copio los precios a "+SUCURSALES.find(s=>s.id===pSuc).n+"?\n"+otras.map((s,i)=>(i+1)+") "+s.n).join("\n")); const src=otras[+pick-1]; if(!src) return;
  const from=catalogo[src.id]||{}; const patch={}; Object.keys(from).forEach(k=>{ if(from[k]&&from[k].precio!=null){ const cur=((catalogo[pSuc]||{})[k]||{}); patch[k]=Object.assign({},cur,{on:cur.on!==false,precio:from[k].precio,ts:Date.now()}); } });
  if(!Object.keys(patch).length) return toast(src.n+" no tiene precios"); db.ref(ROOT+"/catalogo/"+pSuc).update(patch).then(()=>toast("Precios copiados de "+src.n)); });

/* ---------- 5. USUARIOS (vistas, no permisos) ---------- */
function renderUsuarios(){ const us=Object.entries(usuarios);
  $("#main").innerHTML=`<div class="top"><h1>👥 Usuarios</h1><div class="sub">Cada usuario entra con su clave y ve solo las vistas que le prendas. El usuario <b>Maestro</b> (clave actual) siempre ve todo. Aquí no hay permisos finos: es qué pestañas ve cada quien.</div></div>
  <div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:8px">➕ Nuevo usuario</h3><div class="form"><label>Nombre<input id="uNombre" placeholder="Sucursal Viñedos · Cocina · Pepe"></label><label>Clave para entrar<input id="uClave" placeholder="ej. 4521" autocomplete="off"></label><button class="btn p" id="uCrear">Crear</button></div></div>
  <div class="users">
    <div class="user"><div><div class="nm">👑 Maestro</div><div class="cl">Ve todas las vistas · no se puede borrar</div></div><span class="b ok">siempre</span><div class="chk">${VISTAS.map(v=>`<label class="on">${v.e} ${v.n}</label>`).join("")}</div></div>
    ${us.map(([id,u])=>{ const vs=toArr(u.vistas); return `<div class="user" data-id="${id}"><div><div class="nm">${esc(u.nombre)}</div><div class="cl">clave: <b>${esc(u.clave)}</b> · creado ${fmtFecha(u.creado)}</div></div><button class="btn r" data-del="${id}">🗑 Borrar</button><div class="chk">${VISTAS.map(v=>`<label class="${vs.includes(v.id)?"on":""}"><input type="checkbox" hidden data-uid="${id}" data-vista="${v.id}" ${vs.includes(v.id)?"checked":""}>${v.e} ${v.n}</label>`).join("")}</div></div>`; }).join("")||`<div class="empty">Todavía no hay usuarios además del maestro.</div>`}
  </div>`; }
document.addEventListener("click",e=>{
  if(e.target.id==="uCrear"){ const nombre=$("#uNombre").value.trim(), clave=$("#uClave").value.trim(); if(nombre.length<2||clave.length<3) return toast("Pon nombre y una clave de al menos 3 caracteres"); if(clave===CLAVE_MAESTRA||Object.values(usuarios).some(u=>u&&u.clave===clave)) return toast("Esa clave ya está en uso");
    const id=slugify(nombre)+"-"+Date.now().toString(36).slice(-4); db.ref(ROOT+"/admin/usuarios/"+id).set({nombre,clave,vistas:["pedidos"],creado:Date.now()}).then(()=>toast("Usuario creado: "+nombre)); }
  const del=e.target.closest("[data-del]"); if(del&&confirm("¿Borrar este usuario?")) db.ref(ROOT+"/admin/usuarios/"+del.dataset.del).remove().then(()=>toast("Usuario borrado"));
});
document.addEventListener("change",e=>{ const cb=e.target; if(!cb.dataset||!cb.dataset.uid) return; const u=usuarios[cb.dataset.uid]; const vs=new Set(toArr(u.vistas)); if(cb.checked) vs.add(cb.dataset.vista); else vs.delete(cb.dataset.vista); db.ref(ROOT+"/admin/usuarios/"+cb.dataset.uid+"/vistas").set([...vs]); });

/* ---------- acciones del kanban ---------- */
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if(!el) return; const {a,v,id,s}=el.dataset;
  if(a==="etapa"){ const patch={etapa:v}; if(el.dataset.back){ patch.estado="pedido"; patch.entregadoEn=null; } upd(s,id,patch); toast({proceso:"De vuelta a cocina 🍳",espera:"Esperando repartidor ⏳",repartiendo:"En camino 🛵"}[v]); }
  if(a==="entregar"){ upd(s,id,{estado:"entregado",etapa:"entregado",entregadoEn:Date.now()}); toast("Entregado ✅"); }
  if(a==="archivar"){ upd(s,id,{estado:"archivado",archivadoEn:Date.now()}); toast("Archivado 📚"); }
});
</script>
