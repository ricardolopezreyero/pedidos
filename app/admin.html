<style>
/* RLR */
:root{--y:#FFD60A;--y2:#FFF1B8;--y3:#FFFBEA;--r:#E4322B;--r2:#FDE7E5;--g:#2E9E3E;--g2:#E3F5E6;--b:#2b4a9e;--b2:#eef3ff;--v:#7c3aed;--ink:#231F1A;--mut:#7A736B;--line:#EEE3BF;--sh:0 6px 18px rgba(90,70,0,.10);--side:236px}
*{box-sizing:border-box}
html,body{margin:0;background:#F3EFE2;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:14px;line-height:1.35;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{user-select:none;-webkit-user-select:none}
@media(pointer:coarse){.btn,.chip,.coc,.item,.mini,.kstep{min-height:42px}.qty button{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
/* ---------- layout: menú izquierdo + contenido ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100dvh}
aside{background:var(--ink);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:var(--y);padding:4px 8px 14px}
.logo small{color:#fff;opacity:.6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;color:#ddd;text-align:left;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--y);color:var(--ink)}
.nav button .n{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:0 8px;font-size:11.5px}
.nav button.on .n{background:rgba(0,0,0,.12)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;font-size:12.5px;color:#bbb}
.side-foot b{color:#fff;display:block}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:#777;display:inline-block;margin-right:5px}
.side-foot .dot.on{background:#4ade80}
.side-foot button{margin-top:8px;width:100%;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px;font-weight:800}
main{padding:18px 20px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:22px;font-weight:900}
.top .sub{color:var(--mut);font-weight:700;font-size:13px;width:100%}
.top select{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.top .sp{margin-left:auto}
@media(min-width:821px) and (max-width:1100px){
  .app{grid-template-columns:72px 1fr}
  aside{padding:12px 8px}.logo{justify-content:center;padding:4px 0 12px;font-size:22px}.logo span,.logo small{display:none}
  .nav button{justify-content:center;padding:12px 0;font-size:20px}.nav button .t{display:none}.nav button .n{position:absolute;margin:-26px 0 0 26px;font-size:10px}
  .side-foot{text-align:center;font-size:11px}.side-foot .who,.side-foot #conn{display:none}.side-foot button{padding:8px 4px;font-size:16px}.side-foot button .t{display:none}
}
@media(min-width:1700px){ main{padding:24px 32px 60px} .kpi .v{font-size:34px} .board{grid-auto-columns:minmax(300px,1fr)} }
@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{position:sticky;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto}
  .logo{padding:0 6px 0 0;font-size:16px}.logo small{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 10px;font-size:13px;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;border:0;padding:0}.side-foot b,.side-foot #conn,.side-foot .dot{display:none}.side-foot button{margin:0;padding:7px 10px;width:auto}
  main{padding:12px 12px 40px}
}
/* ---------- piezas ---------- */
.card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;border-top:4px solid var(--y)}
.kpi .v{font-size:28px;font-weight:900;line-height:1.05}
.kpi .l{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.kpi .d{font-size:12px;font-weight:700;color:#5a4a00;margin-top:4px}
.kpi.k2{border-color:var(--r)}.kpi.k3{border-color:var(--b)}.kpi.k4{border-color:var(--v)}.kpi.k5{border-color:var(--g)}.kpi.k6{border-color:#999}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:16px;font-weight:900}
.sec span{font-size:12.5px;color:var(--mut);font-weight:700}
.capa{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff!important;background:var(--ink);border-radius:999px;padding:3px 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #f3ecd6;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:900;background:var(--y3)}
.bar{height:8px;background:#f0e9d2;border-radius:999px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%;background:var(--g)}
.bar i.h{background:#c98a00}.bar i.m{background:#e8c11c}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:800;padding:6px 0;border-bottom:1px solid #f3ecd6}
.row small{color:var(--mut);font-weight:700}
.b{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#f2ecd6;color:#6b5a00;display:inline-block}
.b.suc{background:var(--b2);color:var(--b)}.b.ok{background:var(--g2);color:var(--g)}.b.wip{background:var(--r2);color:var(--r)}.b.tab{background:var(--y2)}.b.off{background:var(--r);color:#fff}
.empty{color:var(--mut);font-weight:700;text-align:center;padding:18px 8px;font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12.5px;background:#f2ecd6}
.btn.p{background:var(--g);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.bl{background:var(--b);color:#fff}.btn.v{background:var(--v);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}.btn.y{background:var(--y)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;align-items:start;padding-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{scroll-snap-align:start}
@media(max-width:700px){.board{grid-auto-columns:86vw}}
.col{background:rgba(255,255,255,.55);border-radius:16px;padding:8px;min-height:40vh}
.col-head{font-weight:900;font-size:14px;padding:6px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.col-head .n{background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mut)}
.col.k1 .col-head{color:#8a5a00}.col.k2 .col-head{color:var(--r)}.col.k3 .col-head{color:var(--b)}.col.k4 .col-head{color:var(--v)}.col.k5 .col-head{color:var(--g)}.col.k6 .col-head{color:var(--mut)}.col.k6{background:rgba(70,55,10,.14)}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 12px;border-left:5px solid var(--y)}
.pc.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:#FFF3B0}100%{background:#fff}}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc-top h3{font-size:15px;font-weight:900}
.when{font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.pl{font-size:13px;margin:2px 0}.pl b{font-weight:900}.pl i{color:var(--mut)}
.notas{margin-top:5px;font-size:12.5px;background:var(--y2);border-radius:8px;padding:4px 8px;color:#5a4a00}
.tot{margin-top:6px;font-size:12px;font-weight:800;color:var(--mut)}
.acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
/* productos / precios */
.grp{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.grp h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grp h3 span{font-size:12px;color:var(--mut);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;cursor:pointer;user-select:none}
.item.off{background:var(--r2);border-color:#f3b8b4;color:#b3261e;text-decoration:line-through}
.sw{width:40px;height:22px;border-radius:999px;background:#ccc;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.item:not(.off) .sw{background:var(--g)}.item:not(.off) .sw::after{left:21px}
.price{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:6px 8px 6px 12px;font-weight:800}
.price input{width:86px;margin-left:auto;border:1.5px solid var(--line);border-radius:9px;padding:6px 8px;text-align:right;font-weight:900}
.price input:focus{outline:none;border-color:var(--g)}
.price.off{opacity:.5}
/* usuarios */
.users{display:grid;gap:10px}
.user{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.user .nm{font-weight:900;font-size:15px}
.user .cl{font-size:12px;color:var(--mut);font-weight:700}
.chk{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chk label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12.5px;cursor:pointer}
.chk label.on{background:var(--g2);border-color:var(--g);color:var(--g)}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.form label{font-size:12px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.form input{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:800}
@media(max-width:600px){.form{grid-template-columns:1fr}}
/* buscador */
.buscar{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;min-width:260px;flex:1;max-width:420px}
.buscar:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(46,158,62,.15)}
/* productos: masas y picor */
.items.wide{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.item .nm{flex:1;min-width:0}
.masas{display:inline-flex;gap:3px}
.mb{width:28px;height:26px;border-radius:8px;border:1.5px solid var(--g);background:var(--g2);color:var(--g);font-weight:900;font-size:12px;padding:0}
.mb.off{border-color:#f3b8b4;background:var(--r2);color:#b3261e;text-decoration:line-through}
.pics{display:inline-flex;gap:2px;margin-left:4px}
.pb{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:2px 5px;font-size:10px;line-height:1.4;letter-spacing:-2px;min-width:26px}
.pb.on{border-color:var(--r);background:var(--r2)}
.item.off .mb,.item.off .pb{opacity:.5}
/* mostrador */
.abiertos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip-ped{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;text-align:left;display:flex;flex-direction:column;gap:1px}
.chip-ped b{font-size:13.5px}.chip-ped span{font-size:11.5px;color:var(--mut);font-weight:700}
.chip-ped.on{border-color:var(--ink);background:var(--y)}
.chip-ped.nuevo{background:var(--g);color:#fff;border-color:var(--g);font-weight:900;justify-content:center}
.chip-ped.nuevo small{opacity:.8}
.pos{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}.pos-right{order:-1}.pos input.big{position:sticky;top:0}}
.pos input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;width:100%}
.pos input.big{font-size:17px;padding:11px 12px}
.pos input:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(46,158,62,.15)}
.personas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.per{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;text-align:left;display:flex;flex-direction:column}
.per b{font-size:13.5px}.per span{font-size:11px;color:var(--mut);font-weight:700}
.per.on{border-color:var(--ink);background:var(--y)}
.per.add{background:var(--g2);border-color:var(--g);color:var(--g);font-weight:900;justify-content:center}
.seg{display:inline-flex;background:#ECE4C8;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:900;font-size:13px;color:#6b5a00}
.seg button.on{background:var(--ink);color:var(--y)}
.seg small{opacity:.6;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.chip.has{border-color:var(--g);background:var(--g2)}
.chip.first{border-color:var(--ink);box-shadow:0 0 0 2px var(--y)}
.chip.off{border-color:#f3b8b4;background:#fff5f4;color:#b3261e;text-decoration:line-through;opacity:.8}
.chip .cnt{background:var(--g);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px}
.chip .cnt.no{background:var(--r);text-decoration:none}
.chip .pic{font-size:10px;letter-spacing:-2px}
.lines .line{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.lines .line:first-child{border-top:0}
.line.off{background:var(--r2);border-radius:10px;padding-left:6px}
.qty{display:inline-flex;align-items:center;gap:3px}
.qty button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:900;line-height:1;padding:0}
.qty b{min-width:26px;text-align:center;background:var(--y);border-radius:8px;padding:4px 0}
.ln{flex:1;font-weight:800;min-width:120px}
.ln em{font-style:normal;color:var(--mut);font-size:11px;text-transform:uppercase;margin-left:4px}
.det{width:140px!important;padding:5px 8px!important;font-size:12.5px!important;margin-left:6px}
.chrow{width:100%;display:flex;gap:4px;flex-wrap:wrap;padding-left:4px}
.mini{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800}
.mini.on{background:var(--ink);color:var(--y);border-color:var(--ink)}
.pos-tot{margin-top:10px;font-weight:800;color:var(--mut);font-size:13px}
.pos-tot .money{font-size:20px;color:var(--ink);font-weight:900;margin-top:4px}
/* cocina */
.cocs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:800;color:var(--mut)}
.coc{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.coc span{font-size:11px;color:var(--mut);font-weight:700}
.coc.on{background:var(--ink);color:var(--y);border-color:var(--ink)}.coc.on span{color:#ddd}
.coc.add{background:var(--g2);border-color:var(--g);color:var(--g)}
.kgrid{display:grid;grid-template-columns:minmax(300px,1fr) 1.6fr;gap:12px;align-items:start}
@media(max-width:900px){.kgrid{grid-template-columns:1fr}}
@media(min-width:1500px){ .kgrid{grid-template-columns:minmax(340px,1fr) 2fr;gap:18px} .kitem{font-size:24px;min-height:78px;padding:14px 18px} .kq{min-width:60px;height:60px;font-size:28px} .kc-top{font-size:20px} .kl{font-size:15px} .kbtn{font-size:19px;padding:18px} .kstep{font-size:18px;padding:14px} .kdem{font-size:15px} .coc{font-size:16px;padding:10px 18px} }
body.fs aside{display:none} body.fs .app{grid-template-columns:1fr} body.fs main{padding:14px 18px}
.kcol h2,.kmain h2{font-size:16px;margin-bottom:8px}
.kcol .n{background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut)}
.kdem{background:var(--y2);border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;margin-bottom:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.kcards{display:flex;flex-direction:column;gap:8px}
.kc{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;border-left:6px solid var(--r)}
.kc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:17px}
.kc-sub{font-size:12px;color:var(--mut);font-weight:700;margin:2px 0 6px}
.kc-lines{display:flex;flex-wrap:wrap;gap:4px}
.kl{background:#f2ecd6;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:800}
.kl.g{background:var(--y2)}.kl.ch{background:#ffe7c2}.kl.b{background:#e3eeff}.kl.po{background:#f3e3ff}
.kl em{font-style:normal;font-size:11px;color:var(--mut);font-weight:900}
.kc-nota{margin-top:6px;background:var(--r2);color:#b3261e;border-radius:8px;padding:4px 8px;font-weight:800;font-size:13px}
.kc-nota.big{font-size:15px;padding:8px 12px;margin:8px 0}
.wait{font-size:12px;font-weight:900;border-radius:999px;padding:2px 8px;background:var(--g2);color:var(--g)}
.wait.warn{background:#fff1c2;color:#8a5a00}.wait.late{background:var(--r);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.55}}
.kbtn{border:0;border-radius:14px;padding:14px 16px;font-weight:900;font-size:16px;width:100%;margin-top:10px}
.kbtn.take{background:var(--r);color:#fff}.kbtn.take:disabled{background:#e9d9d7;color:#a77;cursor:not-allowed}
.kbtn.ghost{background:transparent;border:1.5px solid var(--line);width:auto;padding:8px 12px;font-size:13px;margin:0}
.kbtn.next{background:var(--b);color:#fff}.kbtn.go{background:var(--g);color:#fff;font-size:20px;padding:18px}
.karm{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px}
.karm-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px;flex-wrap:wrap}
.ksteps{display:flex;gap:6px;margin:12px 0}
.kstep{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:900;font-size:15px}
.kstep span{background:#f2ecd6;border-radius:999px;padding:1px 8px;font-size:12px;margin-left:6px}
.kstep.on{border-color:var(--ink);background:var(--y)}.kstep.ready:not(.on){border-color:var(--g);background:var(--g2)}
.klist{display:flex;flex-direction:column;gap:6px}
.kitem{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;text-align:left;font-size:19px;font-weight:900;min-height:64px}
.kitem.done{background:var(--g2);border-color:var(--g);color:#2a6b34}
.kitem.done .kn{text-decoration:line-through;opacity:.7}
.kq{min-width:48px;height:48px;border-radius:12px;background:var(--y);display:grid;place-items:center;font-size:22px;flex:none}
.kitem.done .kq{background:var(--g);color:#fff}
.kn{flex:1;display:flex;flex-direction:column}
.kn em{font-style:normal;font-size:12px;letter-spacing:.08em;font-weight:900;color:#8a5a00}.kn em.maiz{color:#2b4a9e}
.kn small{font-size:12.5px;color:var(--mut);font-weight:700}
.kchk{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:20px;flex:none}
.kitem.done .kchk{background:var(--g);color:#fff;border-color:var(--g)}
.kitem.ch{border-left:6px solid #e0a040}.kitem.b{border-left:6px solid #6b8fd6}.kitem.po{border-left:6px solid #a76bd6}
.kmine,.kotros{margin-top:10px;font-size:13px;font-weight:700;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.empty.big{font-size:17px;padding:60px 20px;background:#fff;border-radius:18px}
/* acceso */
.gate{position:fixed;inset:0;background:var(--ink);display:grid;place-items:center;z-index:99;padding:20px}
.gate form{background:#fff;border-radius:20px;padding:24px;width:100%;max-width:360px;text-align:center}
.gate h1{margin:0 0 6px;font-size:22px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:18px;text-align:center;margin:10px 0;letter-spacing:.2em}
.gate button{width:100%;border:0;border-radius:12px;padding:12px;background:var(--g);color:#fff;font-weight:900;font-size:15px}
.gate .err{color:var(--r);font-weight:800;min-height:18px;font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-weight:800;opacity:0;transition:.2s;pointer-events:none;z-index:98}
.toast.on{opacity:1}
</style>

function fmtFecha(ts){ return ts?new Date(ts).toLocaleString("es-MX",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}).replace(/\./g,""):""; }
function fmtRel(ts){ if(!ts) return ""; const d=(Date.now()-ts)/1000; if(d<60) return "ahora"; if(d<3600) return "hace "+Math.floor(d/60)+" min"; if(d<86400) return "hace "+Math.floor(d/3600)+" h"; return fmtFecha(ts); }
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),2000); }
function personLines(p){ const L=[]; toArr(p.gorditas).forEach(l=>L.push(l.cant+" "+l.guiso+(l.detalle?" ("+l.detalle+")":"")+" · "+(l.masa==="maiz"?"maíz":"harina")));
  if(p.chilaquiles){ const c=p.chilaquiles; const ex=toArr(c.extras).map(x=>x==="Guiso favorito"?(c.guiso?"guiso de "+c.guiso.toLowerCase():"guiso favorito"):x.toLowerCase());
    L.push((c.cant>1?c.cant+" ":"")+"Chilaquiles"+(c.salsa?" salsa "+c.salsa.toLowerCase():"")+(c.queso?" · queso "+c.queso.toLowerCase():"")+(ex.length?" + "+ex.join(" + "):"")); }
  toArr(p.bebidas).forEach(l=>L.push(l.cant+" "+l.nombre+(l.detalle?" ("+l.detalle+")":""))); toArr(p.postres).forEach(l=>L.push(l.cant+" "+l.nombre)); return L; }
function totales(c){ const t={g:0,h:0,m:0,ch:0,b:0,po:0,per:0}; toArr(c.personas).forEach(p=>{ if(personLines(p).length) t.per++; toArr(p.gorditas).forEach(l=>{ t.g+=+l.cant||0; if(l.masa==="maiz") t.m+=+l.cant||0; else t.h+=+l.cant||0; }); if(p.chilaquiles) t.ch+=+p.chilaquiles.cant||1; toArr(p.bebidas).forEach(l=>t.b+=+l.cant||0); toArr(p.postres).forEach(l=>t.po+=+l.cant||0); }); return t; }
function sumT(cards){ const T={g:0,h:0,m:0,ch:0,b:0,po:0,per:0,n:cards.length}; cards.forEach(c=>{ const t=totales(c); Object.keys(t).forEach(k=>T[k]+=t[k]); }); return T; }
function totStr(t){ const s=[]; if(t.g) s.push("🫓 "+t.g+" ("+t.h+"H·"+t.m+"M)"); if(t.ch) s.push("🍳 "+t.ch); if(t.b) s.push("☕ "+t.b); if(t.po) s.push("🍰 "+t.po); return s.join(" · ")||"vacío"; }
function agrup(cards,fn){ const m={}; cards.forEach(c=>toArr(c.personas).forEach(p=>fn(p,(k,v)=>{ m[k]=(m[k]||0)+v; }))); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
const porGuiso=cards=>{ const m={}; cards.forEach(c=>toArr(c.personas).forEach(p=>toArr(p.gorditas).forEach(l=>{ m[l.guiso]=m[l.guiso]||{h:0,m:0}; m[l.guiso][l.masa==="maiz"?"m":"h"]+=+l.cant||0; }))); return Object.entries(m).sort((a,b)=>(b[1].h+b[1].m)-(a[1].h+a[1].m)); };

/* ---------- acceso: maestro + usuarios con vistas ---------- */
let usuarios={}, yo=null;
function sesion(){ try{ return JSON.parse(localStorage.getItem("ranitas-admin-sesion")||"null"); }catch(e){ return null; } }

/* ---------- datos en vivo ---------- */
const QS=new URLSearchParams(location.search);
let tableros={}, anfitriones={}, catalogo={}, menu={}, online=false, prev={}, first=true, flash={}, q="";

firebase.initializeApp(FIREBASE_CONFIG); const db=firebase.database();
db.ref(".info/connected").on("value",s=>{ online=!!s.val(); $("#dot").className="dot"+(online?" on":""); $("#conn").textContent=online?"en vivo":"sin conexión"; });
db.ref(ROOT+"/anfitriones").on("value",s=>{ anfitriones=s.val()||{}; render(); });
db.ref(ROOT+"/tableros").on("value",s=>{ tableros=s.val()||{}; if(QS.get("ped")&&!pos._auto){ const [sl,id]=QS.get("ped").split("/"); if(tableros[sl]&&tableros[sl].pedidos&&tableros[sl].pedidos[id]){ pos._auto=1; abrirEnMostrador(sl,id); return; } } render(); });
db.ref(ROOT+"/catalogo").on("value",s=>{ catalogo=s.val()||{}; render(); });
db.ref(ROOT+"/menu").on("value",s=>{ menu=s.val()||{}; render(); });

setInterval(render,30000);
function allCards(){ const out=[]; Object.keys(tableros).forEach(sl=>{ const t=tableros[sl]||{}; const cfg=t.config||{}; Object.keys(t.pedidos||{}).forEach(id=>{ const c=t.pedidos[id]; if(!c) return; out.push(Object.assign({},c,{id,slug:sl,personas:toArr(c.personas),sucursal:c.sucursal||cfg.sucursal||"",tablero:(anfitriones[sl]||{}).nombre||sl})); }); }); return out; }
function filtradas(){ return allCards().filter(c=>(!fSuc||c.sucursal===fSuc)&&(!fTab||c.slug===fTab)); }
function apagados(suc){ const c=catalogo[suc]||{}; return Object.keys(c).filter(k=>c[k]&&c[k].on===false); }

/* ---------- menú ---------- */
function renderNav(){ const cards=allCards(); const vis=yo?yo.vistas:[];
  $("#nav").innerHTML=VISTAS.filter(v=>vis.includes(v.id)).map(v=>{ let n=""; if(v.id==="pedidos") n=cards.filter(c=>c.estado==="pedido").length||""; if(v.id==="productos"){ const a=SUCURSALES.reduce((s,x)=>s+apagados(x.id).length,0); n=a||""; } if(v.id==="usuarios") n=Object.keys(usuarios).length+1; return `<button class="${vista===v.id?"on":""}" data-v="${v.id}" title="${v.n}">${v.e} <span class="t">${v.n}</span>${n!==""?`<span class="n">${n}</span>`:""}</button>`; }).join("");

function precioDe(suc,cat,name,masa){ const v=(catalogo[suc]||{})[catKey(cat,name)]||{}; if(cat==="g"&&masa==="maiz"&&v.precioM!=null&&v.precioM!=="") return +v.precioM; return v.precio!=null&&v.precio!==""?+v.precio:null; }

/* ---------- 1. PANORAMA: capa 1 = ahora mismo · capa 2 = acumulado para decidir ---------- */
function renderPanorama(){
  const cards=filtradas(); const hoy=new Date(); hoy.setHours(0,0,0,0); const t0=hoy.getTime();
  const por={}; ETAPAS.forEach(e=>por[e.id]=cards.filter(e.f));
  const cocina=por.proceso.concat(por.armado), viene=por.armando.concat(por.porpedir), calle=por.espera.concat(por.repartiendo);
  const entHoy=cards.filter(c=>(c.estado==="entregado"||c.estado==="archivado")&&(c.entregadoEn||0)>=t0);
  const pedHoy=cards.filter(c=>(c.pedidoEn||0)>=t0);
  const hist=cards.filter(c=>c.estado==="entregado"||c.estado==="archivado"||c.estado==="pedido");
  const TH=sumT(hist), Tc=sumT(cocina), Tv=sumT(viene), TeH=sumT(entHoy);
  const personasActivas=viene.concat(cocina,calle).reduce((s,c)=>s+totales(c).per,0);
  const tablerosActivos=new Set(viene.concat(cocina,calle).map(c=>c.slug)).size;
  const guisosCocina=porGuiso(cocina), guisosViene=porGuiso(viene), guisosHist=porGuiso(hist);

/* ---------- 2. PEDIDOS (kanban del negocio) ---------- */
function coincide(c,q){ if(!q) return true; const t=(c.familia+" "+c.tablero+" "+c.id+" "+toArr(c.personas).map(p=>nombreDe(p)+" "+personLines(p).join(" ")).join(" ")+" "+(c.notas||"")).toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)); }
function renderPedidos(){
  const cards=filtradas().filter(c=>coincide(c,q)); const snap={}; const now=Date.now(); Object.keys(flash).forEach(k=>{ if(now-flash[k]>1600) delete flash[k]; });
  cards.forEach(c=>{ snap[c.id]=JSON.stringify(c); if(!first&&c._w!==SID&&prev[c.id]!==snap[c.id]) flash[c.id]=now; }); prev=snap; first=false;
  const Tc=sumT(cards.filter(ETAPAS[2].f));
  $("#main").innerHTML=`<div class="top"><h1>📋 Pedidos</h1><input class="buscar" id="q" value="${esc(q)}" placeholder="🔎 Buscar familia, persona, guiso, tablero…"><span class="sp"></span>${filtrosHTML()}<div class="sub">🍳 En cocina ahora: ${esc(totStr(Tc))} · toca los botones para avanzar cada pedido; las familias lo ven al instante.${q?` · <b>${cards.length}</b> resultado${cards.length===1?"":"s"} para "${esc(q)}"`:""}</div></div>
  <div class="board">${ETAPAS.map(e=>{ const cs=cards.filter(e.f).sort((a,b)=>(b.actualizado||0)-(a.actualizado||0)); return `<section class="col k${e.k}"><div class="col-head"><span>${e.n}</span><span class="n">${cs.length}</span></div><div class="cards">${cs.length?cs.map(cardHTML).join(""):`<div class="empty">Nada por aquí</div>`}</div></section>`; }).join("")}</div>`;
}
function cardHTML(c){

  const persons=c.personas.map(p=>{ const L=personLines(p); return L.length?`<div class="pl">${ROLES[p.rol]||"🙂"} <b>${esc(nombreDe(p))}</b>: ${esc(L.join(" · "))}</div>`:""; }).join("")||`<div class="pl"><i>sin productos</i></div>`;

const pos={card:null,slug:null,per:0,masa:"harina",qtxt:"",abiertos:{}};

const nuevaPersona=(i)=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),rol:"otro",nombre:"Persona "+i,masa:"harina",gorditas:[],bebidas:[],postres:[],chilaquiles:null});

async function guardarPos(silencio){ const c=pos.card; if(!c) return null; const slug=pos.slug||await asegurarMostrador(pSuc); pos.slug=slug; c.actualizado=Date.now(); c._w=SID; if(!c.familia) c.familia=c.mostrador?"Mostrador "+new Date().toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"}):""; await db.ref(ROOT+"/tableros/"+slug+"/pedidos/"+c.id).set(JSON.parse(JSON.stringify(c))); if(!silencio) toast("Guardado"); return slug; }

  const sl=mostSlug(pSuc); const abiertos=Object.entries(((tableros[sl]||{}).pedidos)||{}).map(([id,c])=>Object.assign({id},c)).filter(c=>c.estado==="armando"||c.estado==="porpedir").sort((a,b)=>(b.actualizado||0)-(a.actualizado||0));
  const chips=`<div class="abiertos">${abiertos.map(c=>`<button class="chip-ped${pos.card&&pos.card.id===c.id?" on":""}" data-abrir="${c.id}"><b>${esc(c.familia||"sin nombre")}</b><span>${esc(totStr(totales(c)))}</span></button>`).join("")}<button class="chip-ped nuevo" id="posNuevo">➕ Nuevo pedido <small>(N)</small></button></div>`;
  if(!pos.card){ $("#main").innerHTML=`<div class="top"><h1>🧾 Mostrador</h1>${sucSelect()}<div class="sub">Toma pedidos en la sucursal tecleando. Cada pedido tiene nombre; lo minimizas para atender otro y lo retomas cuando quieras. Atajos: <b>N</b> nuevo · escribe y <b>Enter</b> agrega · <b>H</b>/<b>M</b> masa · <b>+</b> persona.</div></div>${chips}<div class="empty" style="margin-top:30px">Elige un pedido abierto o crea uno nuevo.</div>`; return; }
  const c=pos.card; const p=c.personas[pos.per]||c.personas[0]; if(!c.personas[pos.per]) pos.per=0;
  const suc=c.sucursal||pSuc; const cat=catalogo[suc]||{}; const dispo=(k,masa)=>{ const v=cat[k]||{}; if(v.on===false) return false; if(masa==="harina"&&v.offH) return false; if(masa==="maiz"&&v.offM) return false; return true; };
  const items=[]; CATALOGO[0].items.forEach(i=>items.push({c:"g",n:i,k:catKey("g",i)})); items.push({c:"ch",n:"Chilaquiles",k:catKey("ch","Chilaquiles")}); CATALOGO[5].items.forEach(i=>items.push({c:"b",n:i,k:catKey("b",i)})); CATALOGO[6].items.forEach(i=>items.push({c:"po",n:i,k:catKey("po",i)}));
  const norm=x=>x.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); const m=/^(\d+)\s*(.*)$/.exec(pos.qtxt.trim()); const qn=m?m[2]:pos.qtxt.trim(); const ws=norm(qn).split(/\s+/).filter(Boolean); const filt=ws.length?items.filter(it=>{ const t=norm(it.n); return ws.every(w=>t.split(/\s+/).some(x=>x.startsWith(w))||t.includes(w)); }).sort((a,b)=>{ const sa=norm(a.n).startsWith(ws[0])?0:1, sb=norm(b.n).startsWith(ws[0])?0:1; return sa-sb; }):items;

function agregarPos(it){ if(!it||!pos.card) return; const p=pos.card.personas[pos.per]; const m=/^(\d+)\s*(.*)$/.exec(pos.qtxt.trim()); const n=m?Math.max(1,+m[1]):1; const suc=pos.card.sucursal||pSuc; const v=(catalogo[suc]||{})[it.k]||{};

function lineasDe(c){ const L=[]; toArr(c.personas).forEach((p,pi)=>{ const pid=p.id||("p"+pi); toArr(p.gorditas).forEach((l,i)=>L.push({k:pid+":g:"+i,pid,per:nombreDe(p),cat:"g",n:l.guiso+(l.detalle?" ("+l.detalle+")":""),masa:l.masa==="maiz"?"maiz":"harina",cant:+l.cant||0}));

      ${mios.length>1?`<div class="kmine">Mis pedidos: ${mios.map(c=>`<button class="coc${c.id===kit.abierto?" on":""}" data-abrirk="${c.id}">${esc(c.familia||"sin nombre")} <span>${mins(c.armadoEn)} min</span></button>`).join("")}</div>`:""}
      ${otros.length?`<div class="kotros"><b>Otros cocineros:</b> ${otros.map(c=>`<span class="kl">${esc((c.cocinero||{}).nombre||"?")} → ${esc(c.familia||"sin nombre")} (${mins(c.armadoEn)} min)</span>`).join(" ")}</div>`:""}
      ${hechosHoy.length?`<div class="kotros">Hoy: ${hechosHoy.length} pedidos salidos de cocina · ${Object.entries(porCoc).map(([id,v])=>{ const nm=(cocs.find(x=>x.id===id)||{}).nombre||"?"; return esc(nm)+" "+v.n+" ("+Math.round(v.t/v.n)+" min prom.)"; }).join(" · ")}</div>`:""}
    </section>
  </div>`;
}
document.addEventListener("fullscreenchange",()=>{ document.body.classList.toggle("fs",!!document.fullscreenElement); render(); });
document.addEventListener("click",e=>{ if(vista!=="cocina") return; const t=e.target; const suc=pSuc;
  if(t.id==="fsBtn"){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast("Tu navegador no permite pantalla completa aquí")); return; }
  const coc=t.closest("[data-coc]"); if(coc){ kit.miId=coc.dataset.coc; localStorage.setItem("ranitas-cocinero-id",kit.miId); kit.abierto=null; renderCocina(); return; }
  if(t.id==="cocAdd"){ const nom=(prompt("Nombre del cocinero:")||"").trim(); if(!nom) return; const id=slugify(nom)+"-"+Date.now().toString(36).slice(-3); kit.miId=id; localStorage.setItem("ranitas-cocinero-id",id); db.ref(ROOT+"/cocina/"+suc+"/cocineros/"+id).set({nombre:nom,creado:Date.now()}); return; }
  const kv=t.closest("[data-kv]"); if(kv){ kit.vista=kv.dataset.kv; renderCocina(); return; }
  const ab=t.closest("[data-abrirk]"); if(ab){ kit.abierto=ab.dataset.abrirk; kit.vista="comal"; renderCocina(); return; }
  const tomar=t.closest("[data-tomar]"); if(tomar){ const yo=((cocineros[suc]||{}).cocineros||{})[kit.miId]; if(!yo) return toast("Elige tu nombre primero"); const ref=db.ref(ROOT+"/tableros/"+tomar.dataset.s+"/pedidos/"+tomar.dataset.tomar);
    ref.transaction(c=>{ if(!c) return c; if(c.etapa==="armado"&&c.cocinero&&c.cocinero.id!==kit.miId) return; c.etapa="armado"; c.cocinero={id:kit.miId,nombre:yo.nombre}; c.armadoEn=Date.now(); c.actualizado=Date.now(); c._w=SID; return c; },(err,ok)=>{ if(!ok) toast("Ese pedido ya lo tomó alguien más"); else { kit.abierto=tomar.dataset.tomar; kit.vista="comal"; toast("🔥 Es tuyo"); } }); return; }
  const soltar=t.closest("[data-soltar]"); if(soltar){ upd(soltar.dataset.s,soltar.dataset.soltar,{etapa:"proceso",cocinero:null,armadoEn:null}); kit.abierto=null; toast("De vuelta a la cola"); return; }
  const chk=t.closest("[data-check]"); if(chk){ const done=chk.dataset.done==="1"; const patch={}; chk.dataset.check.split(",").forEach(k=>patch["avance/"+k]=done?null:true); patch.actualizado=Date.now(); patch._w=SID; db.ref(ROOT+"/tableros/"+chk.dataset.s+"/pedidos/"+chk.dataset.id).update(patch); return; }
  const emp=t.closest("[data-emp]"); if(emp){ const done=emp.dataset.done==="1"; db.ref(ROOT+"/tableros/"+emp.dataset.s+"/pedidos/"+emp.dataset.id).update({["empaque/"+emp.dataset.emp]:done?null:true,actualizado:Date.now(),_w:SID}); return; }
  const listo=t.closest("[data-listo]"); if(listo){ upd(listo.dataset.s,listo.dataset.listo,{etapa:"espera",listoCocinaEn:Date.now()}); kit.abierto=null; kit.vista="comal"; toast("✅ Listo · esperando repartidor"); return; }
});

/* ---------- 3. PRODUCTOS (prender / apagar por sucursal) ---------- */
function sucSelect(){ return `<select id="pSuc">${SUCURSALES.map(x=>{ const a=apagados(x.id).length; return `<option value="${x.id}"${x.id===pSuc?" selected":""}>📍 ${x.n}${a?" · "+a+" apagado"+(a>1?"s":""):""}</option>`; }).join("")}</select>`; }
function renderProductos(){ const c=catalogo[pSuc]||{}; const ap=apagados(pSuc).length;
  $("#main").innerHTML=`<div class="top"><h1>🏪 Productos</h1>${sucSelect()}<div class="sub">Toca un producto para apagarlo o prenderlo. Se refleja al instante en todos los tableros que piden a esta sucursal: sale en rojo como agotado y no se puede mandar hasta ajustar. ${ap?`<b style="color:var(--r)">${ap} apagado${ap>1?"s":""}</b>`:"Todo prendido ✅"}</div></div>`+
  CATALOGO.map(g=>{ const offs=g.items.filter(i=>(c[catKey(g.c,i)]||{}).on===false).length; return `<div class="grp"><h3>${g.t}<span>${g.c==="g"?"interruptor general · H = harina · M = maíz · 🌶 picor":offs?offs+" apagado"+(offs>1?"s":""):"todo prendido"}</span></h3><div class="items${g.c==="g"?" wide":""}">${g.items.map(i=>{ const k=catKey(g.c,i); const v=c[k]||{}; const off=v.on===false; const masas=g.c==="g"?`<span class="masas"><button class="mb${v.offH?" off":""}" data-masa="H" data-k="${k}" data-n="${esc(i)}" title="Harina">H</button><button class="mb${v.offM?" off":""}" data-masa="M" data-k="${k}" data-n="${esc(i)}" title="Maíz">M</button></span><span class="pics" data-k="${k}" data-n="${esc(i)}" title="Picor">${[0,1,2,3].map(x=>`<button class="pb${picDe(i)===x?" on":""}" data-pic="${x}">${x?"🌶".repeat(x):"–"}</button>`).join("")}</span>`:""; return `<div class="item${off?" off":""}" data-k="${k}" data-n="${esc(i)}"><span class="sw"></span><span class="nm">${esc(i)}</span>${masas}</div>`; }).join("")}</div></div>`; }).join(""); }
document.addEventListener("click",e=>{ if(vista!=="productos") return;
  const mb=e.target.closest(".mb"); if(mb){ e.stopPropagation(); const k=mb.dataset.k, cur=((catalogo[pSuc]||{})[k]||{}); const f=mb.dataset.masa==="H"?"offH":"offM"; const val=!cur[f]; db.ref(ROOT+"/catalogo/"+pSuc+"/"+k).update({[f]:val,ts:Date.now()}).then(()=>toast((val?"⛔ Apagado ":"✅ Prendido ")+mb.dataset.n+" de "+(mb.dataset.masa==="H"?"harina":"maíz"))); return; }
  const pb=e.target.closest(".pb"); if(pb){ e.stopPropagation(); const box=pb.closest(".pics"); db.ref(ROOT+"/menu/"+box.dataset.k).update({pic:+pb.dataset.pic}).then(()=>toast(box.dataset.n+": picor "+("🌶".repeat(+pb.dataset.pic)||"sin picante"))); return; }
  const it=e.target.closest(".item"); if(!it) return; const k=it.dataset.k; const cur=((catalogo[pSuc]||{})[k]||{}); const on=cur.on===false;
  db.ref(ROOT+"/catalogo/"+pSuc+"/"+k).update({on,ts:Date.now()}).then(()=>toast((on?"✅ Prendido: ":"⛔ Apagado: ")+it.dataset.n)).catch(()=>toast("No se pudo guardar")); });

/* ---------- 4. PRECIOS (por sucursal; aún no se muestran a las familias) ---------- */
function renderPrecios(){ const c=catalogo[pSuc]||{}; const conPrecio=Object.values(c).filter(v=>v&&v.precio).length;
  $("#main").innerHTML=`<div class="top"><h1>💲 Precios</h1>${sucSelect()}<button class="btn ghost" id="copiarPrecios" title="Copiar los precios de otra sucursal">📋 Copiar de…</button><div class="sub">Cada sucursal puede tener su precio. Se guardan solos al salir del campo. Por ahora <b>no se muestran a las familias</b>; cuando quieras, se activan en tableros y mensaje. ${conPrecio?conPrecio+" con precio":"Sin precios capturados"}.</div></div>`+
  CATALOGO.filter(g=>["g","ch","b","po"].includes(g.c)).map(g=>`<div class="grp"><h3>${g.t}${g.c==="g"?"<span>harina · maíz (si maíz va vacío, usa el de harina)</span>":""}</h3><div class="items">${g.items.map(i=>{ const k=catKey(g.c,i); const v=c[k]||{}; return `<div class="price${v.on===false?" off":""}"><span>${esc(i)}</span><input type="number" inputmode="decimal" min="0" step="1" placeholder="${g.c==="g"?"$ H":"$"}" value="${v.precio!=null?esc(v.precio):""}" data-k="${k}" data-f="precio" data-n="${esc(i)}">${g.c==="g"?`<input type="number" inputmode="decimal" min="0" step="1" placeholder="$ M" value="${v.precioM!=null?esc(v.precioM):""}" data-k="${k}" data-f="precioM" data-n="${esc(i)} maíz" style="margin-left:4px">`:""}</div>`; }).join("")}</div></div>`).join(""); }
document.addEventListener("change",e=>{ const inp=e.target.closest(".price input"); if(!inp||vista!=="precios") return; const k=inp.dataset.k; const val=inp.value===""?null:+inp.value;
  db.ref(ROOT+"/catalogo/"+pSuc+"/"+k).update({[inp.dataset.f]:val,ts:Date.now()}).then(()=>toast(val==null?"Precio borrado: "+inp.dataset.n:inp.dataset.n+" · $"+val)).catch(()=>toast("No se pudo guardar")); });
document.addEventListener("click",e=>{ if(e.target.id!=="copiarPrecios") return; const otras=SUCURSALES.filter(s=>s.id!==pSuc); const pick=prompt("¿De qué sucursal copio los precios a "+SUCURSALES.find(s=>s.id===pSuc).n+"?\n"+otras.map((s,i)=>(i+1)+") "+s.n).join("\n")); const src=otras[+pick-1]; if(!src) return;
  const from=catalogo[src.id]||{}; const patch={}; Object.keys(from).forEach(k=>{ if(from[k]&&(from[k].precio!=null||from[k].precioM!=null)){ const cur=((catalogo[pSuc]||{})[k]||{}); patch[k]=Object.assign({},cur,{precio:from[k].precio==null?null:from[k].precio,precioM:from[k].precioM==null?null:from[k].precioM,ts:Date.now()}); } });
  if(!Object.keys(patch).length) return toast(src.n+" no tiene precios"); db.ref(ROOT+"/catalogo/"+pSuc).update(patch).then(()=>toast("Precios copiados de "+src.n)); });

/* ---------- 5. USUARIOS (vistas, no permisos) ---------- */
function renderUsuarios(){ const us=Object.entries(usuarios);
  $("#main").innerHTML=`<div class="top"><h1>👥 Usuarios</h1><div class="sub">Cada usuario entra con su clave y ve solo las vistas que le prendas. El usuario <b>Maestro</b> (clave actual) siempre ve todo. Aquí no hay permisos finos: es qué pestañas ve cada quien.</div></div>
  <div class="card" style="margin-bottom:14px"><h3 style="margin-bottom:8px">➕ Nuevo usuario</h3><div class="form"><label>Nombre<input id="uNombre" placeholder="Sucursal Viñedos · Cocina · Pepe"></label><label>Clave para entrar<input id="uClave" placeholder="ej. 4521" autocomplete="off"></label><button class="btn p" id="uCrear">Crear</button></div></div>
  <div class="users">
    <div class="user"><div><div class="nm">👑 Maestro</div><div class="cl">Ve todas las vistas · no se puede borrar</div></div><span class="b ok">siempre</span><div class="chk">${VISTAS.filter(v=>v.id!=="manual").map(v=>`<label class="on">${v.e} ${v.n}</label>`).join("")}</div></div>
    ${us.map(([id,u])=>{ const vs=toArr(u.vistas); return `<div class="user" data-id="${id}"><div><div class="nm">${esc(u.nombre)}</div><div class="cl">clave: <b>${esc(u.clave)}</b> · creado ${fmtFecha(u.creado)}</div></div><button class="btn r" data-del="${id}">🗑 Borrar</button><div class="chk">${VISTAS.filter(v=>v.id!=="manual").map(v=>`<label class="${vs.includes(v.id)?"on":""}"><input type="checkbox" hidden data-uid="${id}" data-vista="${v.id}" ${vs.includes(v.id)?"checked":""}>${v.e} ${v.n}</label>`).join("")}</div></div>`; }).join("")||`<div class="empty">Todavía no hay usuarios además del maestro.</div>`}
  </div>`; }
document.addEventListener("click",e=>{
  if(e.target.id==="uCrear"){ const nombre=$("#uNombre").value.trim(), clave=$("#uClave").value.trim(); if(nombre.length<2||clave.length<3) return toast("Pon nombre y una clave de al menos 3 caracteres"); if(clave===CLAVE_MAESTRA||Object.values(usuarios).some(u=>u&&u.clave===clave)) return toast("Esa clave ya está en uso");
    const id=slugify(nombre)+"-"+Date.now().toString(36).slice(-4); db.ref(ROOT+"/admin/usuarios/"+id).set({nombre,clave,vistas:["pedidos"],creado:Date.now()}).then(()=>toast("Usuario creado: "+nombre)); }
  const del=e.target.closest("[data-del]"); if(del&&confirm("¿Borrar este usuario?")) db.ref(ROOT+"/admin/usuarios/"+del.dataset.del).remove().then(()=>toast("Usuario borrado"));
});
document.addEventListener("change",e=>{ const cb=e.target; if(!cb.dataset||!cb.dataset.uid) return; const u=usuarios[cb.dataset.uid]; const vs=new Set(toArr(u.vistas)); if(cb.checked) vs.add(cb.dataset.vista); else vs.delete(cb.dataset.vista); db.ref(ROOT+"/admin/usuarios/"+cb.dataset.uid+"/vistas").set([...vs]); });

/* ---------- acciones del kanban ---------- */
document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if(!el) return; const {a,v,id,s}=el.dataset;
  if(a==="etapa"){ const patch={etapa:v}; if(el.dataset.back){ patch.estado="pedido"; patch.entregadoEn=null; } if(v==="espera") patch.listoCocinaEn=Date.now(); upd(s,id,patch); toast({proceso:"De vuelta a cocina 🍳",espera:"Esperando repartidor ⏳",repartiendo:"En camino 🛵"}[v]); }
  if(a==="entregar"){ upd(s,id,{estado:"entregado",etapa:"entregado",entregadoEn:Date.now()}); toast("Entregado ✅"); }
  if(a==="archivar"){ upd(s,id,{estado:"archivado",archivadoEn:Date.now()}); toast("Archivado 📚"); }
  if(a==="editar"){ abrirEnMostrador(s,id); }
});
</script>
