<style>
/* RLR */
:root{--y:#FFD60A;--y2:#FFF1B8;--y3:#FFFBEA;--r:#E4322B;--r2:#FDE7E5;--g:#2E9E3E;--g2:#E3F5E6;--b:#2b4a9e;--b2:#eef3ff;--v:#7c3aed;--ink:#231F1A;--mut:#7A736B;--line:#EEE3BF;--sh:0 6px 18px rgba(90,70,0,.10);--side:236px}
*{box-sizing:border-box}
html,body{margin:0;background:#F3EFE2;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:14px;line-height:1.35;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{user-select:none;-webkit-user-select:none}
@media(pointer:coarse){.btn,.chip,.coc,.item,.mini,.kstep{min-height:42px}.qty button{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
/* ---------- layout: menú izquierdo + contenido ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100dvh}
aside{background:var(--ink);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:var(--y);padding:4px 8px 14px}
.logo small{color:#fff;opacity:.6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;color:#ddd;text-align:left;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--y);color:var(--ink)}
.nav button .n{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:0 8px;font-size:11.5px}
.nav button.on .n{background:rgba(0,0,0,.12)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;font-size:12.5px;color:#bbb}
.side-foot b{color:#fff;display:block}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:#777;display:inline-block;margin-right:5px}
.side-foot .dot.on{background:#4ade80}
.side-foot button{margin-top:8px;width:100%;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px;font-weight:800}
main{padding:18px 20px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:22px;font-weight:900}
.top .sub{color:var(--mut);font-weight:700;font-size:13px;width:100%}
.top select{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.top .sp{margin-left:auto}
@media(min-width:821px) and (max-width:1100px){
  .app{grid-template-columns:72px 1fr}
  aside{padding:12px 8px}.logo{justify-content:center;padding:4px 0 12px;font-size:22px}.logo span,.logo small{display:none}
  .nav button{justify-content:center;padding:12px 0;font-size:20px}.nav button .t{display:none}.nav button .n{position:absolute;margin:-26px 0 0 26px;font-size:10px}
  .side-foot{text-align:center;font-size:11px}.side-foot .who,.side-foot #conn{display:none}.side-foot button{padding:8px 4px;font-size:16px}.side-foot button .t{display:none}
}
@media(min-width:1700px){ main{padding:24px 32px 60px} .kpi .v{font-size:34px} .board{grid-auto-columns:minmax(300px,1fr)} }
@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{position:sticky;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto}
  .logo{padding:0 6px 0 0;font-size:16px}.logo small{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 10px;font-size:13px;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;border:0;padding:0}.side-foot b,.side-foot #conn,.side-foot .dot{display:none}.side-foot button{margin:0;padding:7px 10px;width:auto}
  main{padding:12px 12px 40px}
}
/* ---------- piezas ---------- */
.card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;border-top:4px solid var(--y)}
.kpi .v{font-size:28px;font-weight:900;line-height:1.05}
.kpi .l{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.kpi .d{font-size:12px;font-weight:700;color:#5a4a00;margin-top:4px}
.kpi.k2{border-color:var(--r)}.kpi.k3{border-color:var(--b)}.kpi.k4{border-color:var(--v)}.kpi.k5{border-color:var(--g)}.kpi.k6{border-color:#999}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:16px;font-weight:900}
.sec span{font-size:12.5px;color:var(--mut);font-weight:700}
.capa{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff!important;background:var(--ink);border-radius:999px;padding:3px 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #f3ecd6;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:900;background:var(--y3)}
.bar{height:8px;background:#f0e9d2;border-radius:999px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%;background:var(--g)}
.bar i.h{background:#c98a00}.bar i.m{background:#e8c11c}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:800;padding:6px 0;border-bottom:1px solid #f3ecd6}
.row small{color:var(--mut);font-weight:700}
.b{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#f2ecd6;color:#6b5a00;display:inline-block}
.b.suc{background:var(--b2);color:var(--b)}.b.ok{background:var(--g2);color:var(--g)}.b.wip{background:var(--r2);color:var(--r)}.b.tab{background:var(--y2)}.b.off{background:var(--r);color:#fff}
.empty{color:var(--mut);font-weight:700;text-align:center;padding:18px 8px;font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12.5px;background:#f2ecd6}
.btn.p{background:var(--g);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.bl{background:var(--b);color:#fff}.btn.v{background:var(--v);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}.btn.y{background:var(--y)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;align-items:start;padding-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{scroll-snap-align:start}
@media(max-width:700px){.board{grid-auto-columns:86vw}}
.col{background:rgba(255,255,255,.55);border-radius:16px;padding:8px;min-height:40vh}
.col-head{font-weight:900;font-size:14px;padding:6px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.col-head .n{background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mut)}
.col.k1 .col-head{color:#8a5a00}.col.k2 .col-head{color:var(--r)}.col.k3 .col-head{color:var(--b)}.col.k4 .col-head{color:var(--v)}.col.k5 .col-head{color:var(--g)}.col.k6 .col-head{color:var(--mut)}.col.k6{background:rgba(70,55,10,.14)}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 12px;border-left:5px solid var(--y)}
.pc.flash{animation:fl 1.6s ease-out}
.pc.moved{animation:pmoved .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pmoved{0%{transform:translateY(18px) scale(.97);opacity:0;box-shadow:0 0 0 4px var(--y)}70%{box-shadow:0 0 0 4px var(--y)}100%{transform:none;opacity:1}}
.pc.flip{transition:transform .55s cubic-bezier(.2,.8,.2,1)}
@keyframes fl{0%{background:#FFF3B0}100%{background:#fff}}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc-top h3{font-size:15px;font-weight:900}
.when{font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.pl{font-size:13px;margin:2px 0}.pl b{font-weight:900}.pl i{color:var(--mut)}
.notas{margin-top:5px;font-size:12.5px;background:var(--y2);border-radius:8px;padding:4px 8px;color:#5a4a00}
.tot{margin-top:6px;font-size:12px;font-weight:800;color:var(--mut)}
.acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
/* productos / precios */
.grp{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.grp h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grp h3 span{font-size:12px;color:var(--mut);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;cursor:pointer;user-select:none}
.item.off{background:var(--r2);border-color:#f3b8b4;color:#b3261e;text-decoration:line-through}
.sw{width:40px;height:22px;border-radius:999px;background:#ccc;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.item:not(.off) .sw{background:var(--g)}.item:not(.off) .sw::after{left:21px}
.ptable-wrap{overflow-x:auto}
.ptable{width:100%;max-width:640px;border-collapse:separate;border-spacing:0}
.ptable th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 10px;border-bottom:1.5px solid var(--line)}
.ptable th.mh,.ptable th.mm,.ptable td.mh,.ptable td.mm{width:150px;text-align:center}
.ptable th.mh{color:#7a4f00}.ptable th.mm{color:#1d4ed8}
.ptable td{padding:5px 10px;border-bottom:1px solid #f3ecd6;vertical-align:middle}
.ptable td.pn{font-weight:800;white-space:nowrap}
.ptable td.pn small{display:block;color:var(--r);font-weight:800;font-size:11px}
.ptable tr.off td{opacity:.5}
.ptable td.mh .pin{background:#FFF6DC}.ptable td.mm .pin{background:#EEF4FF}
.pin{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.pin span{padding:0 4px 0 10px;color:var(--mut);font-weight:800}
.pin input{width:88px;border:0;padding:8px 10px 8px 2px;font-weight:900;font-size:15px;text-align:right;background:transparent}
.pin input:focus{outline:none}
.pin:focus-within{border-color:var(--g);box-shadow:0 0 0 3px rgba(46,158,62,.15)}
.pin input::-webkit-outer-spin-button,.pin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pin input[type=number]{-moz-appearance:textfield}
@media(max-width:600px){.ptable th.mh,.ptable th.mm,.ptable td.mh,.ptable td.mm{width:auto}.pin input{width:58px;font-size:14px;padding:7px 6px 7px 2px}.ptable td{padding:4px 5px}.ptable td.pn{white-space:normal;font-size:13px}.grp h3 span{display:block}}
/* usuarios */
.users{display:grid;gap:10px}
.user{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.user .nm{font-weight:900;font-size:15px}
.user .cl{font-size:12px;color:var(--mut);font-weight:700}
.chk{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.chk label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12.5px;cursor:pointer}
.chk label.on{background:var(--g2);border-color:var(--g);color:var(--g)}
.form{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.form label{font-size:12px;font-weight:800;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.form input{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:800}
@media(max-width:600px){.form{grid-template-columns:1fr}}
/* buscador */
.buscar{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:800;min-width:260px;flex:1;max-width:420px}
.buscar:focus{outline:none;border-color:var(--g);box-shadow:0 0 0 3px rgba(46,158,62,.15)}
/* productos: masas y picor */
.items.wide{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.item .nm{flex:1;min-width:0}
.masas{display:inline-flex;gap:3px}
.mb{width:30px;height:26px;border-radius:8px;border:1.5px solid var(--g);background:var(--g2);color:var(--g);font-weight:900;font-size:13px;padding:0}
.mb.mbh:not(.off){background:#FFE3A0;border-color:#c98a00}.mb.mbm:not(.off){background:#DBEAFE;border-color:#1d4ed8}
.mb.off{border-color:#f3b8b4;background:var(--r2);color:#b3261e;text-decoration:line-through}
.pics{display:inline-flex;gap:2px;margin-left:4px}
.pb{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:2px 5px;font-size:10px;line-height:1.4;letter-spacing:-2px;min-width:26px}
.pb.on{border-color:var(--r);background:var(--r2)}
.item.off .mb,.item.off .pb{opacity:.5}
/* mostrador */
.abiertos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip-ped{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;text-align:left;display:flex;flex-direction:column;gap:1px}
.chip-ped b{font-size:13.5px}.chip-ped span{font-size:11.5px;color:var(--mut);font-weight:700}
.chip-ped.on{border-color:var(--ink);background:var(--y)}
.chip-ped.nuevo{background:var(--g);color:#fff;border-color:var(--g);font-weight:900;justify-content:center}
.chip-ped.nuevo small{opacity:.8}
.chip-ped.mesa{border-color:#c7b26a;background:#FFFBEA}.chip-ped.mesa.on{background:var(--y);border-color:var(--ink)}
.posmesas{margin:-4px 0 12px;border:1.5px dashed var(--line);border-radius:12px;background:#fff8}
.pm-h{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:8px 12px;font-weight:900;font-size:13px;cursor:pointer;color:var(--ink)}
.pm-h .n{background:var(--ink);color:var(--y);border-radius:999px;padding:0 7px;font-size:11px;margin-left:4px}.pm-h .mut{color:var(--mut);font-weight:800;font-size:12px}
.pm-grid{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.pm-q{flex:1 1 100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;font-size:14px;background:#fff}
.posmesas.anf{border-color:#9cc7a3;background:#f3faf3}
.posmesas.tab{border-style:solid;border-color:#e6c84a;background:#fffbe6}
.posmesas.tab .chip-ped.nuevo{padding:8px 14px}
.chip-ped.anf{border-color:#9cc7a3;background:#fff}.chip-ped.anf.otra{opacity:.75}.chip-ped.anf.on{background:var(--y);border-color:var(--ink)}
.posrep{margin:-4px 0 12px;border:1.5px dashed #b9a7e6;border-radius:12px;background:#f6f2ff}
/* recetas y compras */
.rgrid{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:12px;align-items:start}
@media(max-width:900px){.rgrid{grid-template-columns:1fr}}
.rcats{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.ritem{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:6px;cursor:pointer}
.ritem b{display:block;font-size:14px}.ritem span{font-size:11.5px;color:var(--mut);font-weight:700}.ritem.on{border-color:var(--ink);background:var(--y)}
.rcard h2{font-size:22px;margin:0}.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.racts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rcalc{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--y2);border-radius:12px;padding:10px 12px;margin:12px 0;font-weight:800}
.rcalc input{width:110px;font-size:20px;font-weight:900;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;font-family:inherit}
.rtab{max-width:none}.rtab td b{font-size:15px}.rtab tfoot td{border-top:2px solid var(--ink);font-weight:900}
.rpasos{display:flex;flex-direction:column;gap:6px}.rpaso{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:700}.rpaso span{flex:none;width:26px;height:26px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-weight:900;font-size:13px}
.rform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px}
.rform label,.pvf label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:800;color:var(--mut)}
.rform input,.rform select,.rform textarea,.pvf input,.rtab input,.rtab select,#cmpAddSel,#cmpAddCant{font:inherit;font-weight:700;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff}
.rform textarea{grid-column:1/-1;width:100%}.rform .rin{display:flex;gap:6px}.rform .rin input:first-child{width:90px}
.rcard h3{font-size:15px;margin:14px 0 6px}.chk{display:flex;gap:8px;align-items:center;font-weight:800;margin-top:10px}
.ctabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.items.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.rcert{font-style:normal;margin-left:4px}.rprog{font-style:normal;font-size:11px;background:var(--y2);border-radius:999px;padding:0 6px;margin-left:4px;color:#7a5f00}
.rchips{display:flex;gap:5px;flex-wrap:wrap}.rpaso.ok span{background:var(--g);color:#fff}.rpaso small{display:block;color:var(--mut);font-weight:800;font-size:12px;margin-top:3px}

// ---- precios: costo total de un pedido con el catálogo de su sucursal (harina y maíz por separado). Solo se muestra el total. — RLR
const PRECIOS_BASE={g:27,"g_barbacoa":36,"g_combinada":28,ch:110,"ex_huevo-estrellado":15,"ex_huevo-revuelto":15,"ex_guiso-favorito":25,"b_cafe-de-olla":42,"b_cafe-de-grano":42,"b_jugo-de-naranja":56,"b_refresco":35,"po_gordita-nutella":30,"po_gordita-cajeta":30,"po_brownie":32,"po_pay":32,envio:60};   // menú impreso sep-2026 — RLR
const envioDe=suc=>{ const v=((catalogo[suc]||{}).envio)||{}; return v.precio!=null&&v.precio!==""?+v.precio:PRECIOS_BASE.envio; };
const cfgCard=c=>(tableros[c.slug]||{}).config||{};
const esDomicilio=c=>{ const a=anfitriones[c.slug]||{}; return !c.mesa&&!c.mostrador&&!a.mesa&&!a.mostrador&&cfgCard(c).entregaModo==="domicilio"; };   // solo lo que pidió envío va a Reparto; lo demás lo recogen — RLR
const envioCard=c=>esDomicilio(c)?envioDe(c.sucursal||cfgCard(c).sucursal):0;
const precioBase=(c,name)=>{ const k=catKey(c,name); return PRECIOS_BASE[k]!=null?PRECIOS_BASE[k]:(PRECIOS_BASE[c]!=null?PRECIOS_BASE[c]:null); };
function precioDe(suc,cat,name,masa){ const v=(catalogo[suc]||{})[catKey(cat,name)]||{}; if(cat==="g"&&masa==="maiz"&&v.precioM!=null&&v.precioM!=="") return +v.precioM; if(v.precio!=null&&v.precio!=="") return +v.precio; return precioBase(cat,name); }
function hayPrecios(suc){ return true; }   // siempre: catálogo de la sucursal o menú base — RLR
function costo(c){ const suc=c.sucursal||((tableros[c.slug]||{}).config||{}).sucursal; if(!suc||!hayPrecios(suc)) return null; let t=0;
  toArr(c.personas).forEach(p=>{ toArr(p.gorditas).forEach(l=>{ t+=(precioDe(suc,"g",l.guiso,l.masa)||0)*(+l.cant||0); }); if(p.chilaquiles){ const n=+p.chilaquiles.cant||1; t+=(precioDe(suc,"ch","Chilaquiles")||0)*n; toArr(p.chilaquiles.extras).forEach(x=>{ t+=(precioDe(suc,"ex",x)||0)*n; }); } toArr(p.bebidas).forEach(l=>{ t+=(precioDe(suc,"b",l.nombre)||0)*(+l.cant||0); }); toArr(p.postres).forEach(l=>{ t+=(precioDe(suc,"po",l.nombre)||0)*(+l.cant||0); }); }); return t; }
const money=x=>"$"+Math.round(x).toLocaleString("es-MX");
function filtrosHTML(){ const sl=Object.keys(anfitriones).sort((a,b)=>(anfitriones[a].nombre||a).localeCompare(anfitriones[b].nombre||b));

/* ---------- 2. PEDIDOS (kanban del negocio) ---------- */
function coincide(c,q){ if(!q) return true; const t=(c.familia+" "+c.tablero+" "+c.id+" "+toArr(c.personas).map(p=>nombreDe(p)+" "+personLines(p).join(" ")).join(" ")+" "+(c.notas||"")).toLowerCase(); return q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>t.includes(w)); }
function renderPedidos(){
  const cardsAll=filtradas().filter(c=>coincide(c,q)); const cards=cardsAll.filter(pasaPago); const snap={}; const now=Date.now(); Object.keys(flash).forEach(k=>{ if(now-flash[k]>1600) delete flash[k]; });
  const colPrev=prevCol; prevCol={}; cards.forEach(c=>{ snap[c.id]=JSON.stringify(c); const col=colDeAdmin(c); prevCol[c.id]=col; if(!first&&c._w!==SID&&prev[c.id]!==snap[c.id]) flash[c.id]=now; if(!first&&colPrev[c.id]&&colPrev[c.id]!==col) moved[c.id]=now; }); prev=snap; first=false; Object.keys(moved).forEach(k=>{ if(now-moved[k]>900) delete moved[k]; });
  const antes=flipAntes($("#main"));
  const Tc=sumT(cards.filter(c=>c.estado==="pedido"&&(!c.etapa||c.etapa==="proceso"||c.etapa==="armado")));
  $("#main").innerHTML=`<div class="top"><h1>📋 Pedidos</h1><input class="buscar" id="q" value="${esc(q)}" placeholder="🔎 Buscar familia, persona, guiso, tablero…"><span class="sp"></span>${filtrosHTML()}${anfBarHTML()}<div class="sub">🍳 En cocina ahora: ${esc(totStr(Tc))} · toca los botones para avanzar cada pedido; las familias lo ven al instante.${q?` · <b>${cards.length}</b> resultado${cards.length===1?"":"s"} para "${esc(q)}"`:""}</div></div>
  ${filtroPagoHTML(cardsAll)}
  <div class="board">${ETAPAS.map(e=>{ const cs=cards.filter(e.f).sort(e.k>=5?(a,b)=>(b.entregadoEn||b.archivadoEn||b.actualizado||0)-(a.entregadoEn||a.archivadoEn||a.actualizado||0):(a,b)=>(turno(a)-turno(b))); /* por turnos: el más antiguo arriba, el nuevo entra abajo; Historial al revés — RLR */ return `<section class="col k${e.k}"><div class="col-head"><span>${e.n}</span><span class="n">${cs.length}</span></div>${e.id==="armando"&&fTab&&!(anfitriones[fTab]||{}).mostrador?`<button class="btn p otrafam" data-otrafam="${esc(fTab)}">➕ Otra familia en este tablero</button>`:""}<div class="cards">${cs.length?cs.map(cardHTML).join(""):`<div class="empty">Nada por aquí</div>`}</div></section>`; }).join("")}</div>`;
  flipDespues($("#main"),antes);
}
const turno=c=>({armando:c.creado,porpedir:c.listoEn||c.actualizado,pedido:c.pedidoEn,entregado:c.entregadoEn,archivado:c.archivadoEn}[c.estado])||c.creado||c.actualizado||0;
function colDeAdmin(c){ const e=ETAPAS.find(e=>e.f(c)); return e?e.id:""; }
let prevCol={}, moved={};
let flipKey=""; function flipAntes(root){ const m={}; if(!root) return m; if(flipKey!==vista+"|"+pSuc){ flipKey=vista+"|"+pSuc; return m; } /* solo dentro de la misma vista — RLR */ root.querySelectorAll("article[data-id],.rstop[data-id]").forEach(el=>{ const r=el.getBoundingClientRect(); m[el.dataset.id]=[r.left,r.top]; }); return m; }
function flipDespues(root,antes){ if(!root||matchMedia("(prefers-reduced-motion:reduce)").matches) return; const mov=[]; root.querySelectorAll("article[data-id],.rstop[data-id]").forEach(el=>{ const a=antes[el.dataset.id]; if(!a||el.classList.contains("moved")) return; const r=el.getBoundingClientRect(); const dx=a[0]-r.left, dy=a[1]-r.top; if(Math.abs(dx)<1&&Math.abs(dy)<1||Math.abs(dy)>260) return; el.style.transition="none"; el.style.transform=`translate(${dx}px,${dy}px)`; mov.push(el); });

function guardarReceta(){ const e=rec.edit; if(!e) return; const r=JSON.parse(JSON.stringify(e.r)); r.nombre=(r.nombre||"").trim(); if(!r.nombre) return toast("Ponle nombre"); r.rinde=+r.rinde||1; r.unidad=(r.unidad||"gorditas").trim(); r.porcion=+r.porcion||null; r.dificultad=Math.min(3,Math.max(1,+r.dificultad||1)); r.ingredientes=toArr(r.ingredientes).filter(i=>i.insumo&&i.insumo!=="__nuevo"&&+i.cant>0).map(i=>({insumo:i.insumo,cant:+i.cant,unidad:i.unidad,prep:i.prep||""})); r.pasos=pasosDe(r).map(p=>({t:(p.t||"").trim(),min:p.min!==""&&p.min!=null?+p.min:null,temp:p.temp||""})).filter(p=>p.t); ["equipo","alergenos"].forEach(k=>{ if(typeof r[k]==="string") r[k]=r[k].split(",").map(x=>x.trim()).filter(Boolean); }); ["puntos","tips"].forEach(k=>{ if(typeof r[k]==="string") r[k]=r[k].split("\n").map(x=>x.trim()).filter(Boolean); }); if(r.validada){ r.supuesta=false; r.ref=false; } const id=e.id||slugify(r.nombre)||("r"+Date.now().toString(36)); r.actualizado=Date.now(); if(!e.id) r.creado=Date.now(); r.version=2;
  db.ref(ROOT+"/recetas/"+id).set(r).then(()=>{ toast("Receta guardada 📖"); bit("receta",e.id?"edito":"creo",(e.id?"Editó":"Creó")+" la receta "+r.nombre+" (rinde "+r.rinde+" "+r.unidad+", "+r.ingredientes.length+" ingredientes, "+r.pasos.length+" pasos)"); rec.edit=null; rec.sel=id; render(); }); }
function agregarACompras(items,origen){ const lista=Object.assign({},compras.lista||{}); items.forEach(i=>{ const [n,u]=enBase(i.cant,i.unidad); const k=i.insumo+"|"+u; const prev=lista[k]||{insumo:i.insumo,cant:0,unidad:u,origen:[]}; prev.cant=Math.round((+prev.cant+n)*1000)/1000; prev.origen=[...new Set(toArr(prev.origen).concat(origen?[origen]:[]))]; lista[k]=prev; }); compras.lista=lista; db.ref(ROOT+"/compras/lista").set(lista); }
function imprimirReceta(r,obj){ const ing=escalar(r,obj); const w=window.open("","_blank","width=520,height=760"); if(!w) return toast("Permite ventanas emergentes"); w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${esc(r.nombre)}</title><style>body{font:700 14px/1.45 'Nunito',system-ui,sans-serif;padding:18px;color:#111;max-width:680px;margin:auto}h1{font-size:24px;margin:0}h2{font-size:15px;margin:16px 0 6px;border-bottom:2px solid #FFD60A}table{border-collapse:collapse;width:100%}td{padding:4px 8px 4px 0;border-bottom:1px dashed #ccc;vertical-align:top}ol{padding-left:22px}li{margin:6px 0}small{color:#666}.m{color:#555;font-size:12px}</style></head><body onload="print()"><h1>🐸 ${r.emoji||""} ${esc(r.nombre)}</h1><div class="m">Para ${esc(fmtCant(obj,r.unidad))}${r.porcion?" · "+r.porcion+" g por porción":""}${r.tiempo?" · ⏱ "+esc(r.tiempo):""}</div><h2>Ingredientes</h2><table>${ing.map(i=>`<tr><td><b>${esc(fmtCant(i.cant,i.unidad))}</b></td><td>${esc(insNombre(i.insumo))}${i.prep?` <small>· ${esc(i.prep)}</small>`:""}</td></tr>`).join("")}</table>${toArr(r.equipo).length?`<h2>Equipo</h2><div>${esc(toArr(r.equipo).join(" · "))}</div>`:""}<h2>Paso a paso</h2><ol>${pasosDe(r).map(p=>`<li>${esc(p.t)}${p.min||p.temp?` <small>(${p.min?p.min+" min":""}${p.min&&p.temp?" · ":""}${p.temp?esc(p.temp):""})</small>`:""}</li>`).join("")}</ol>${toArr(r.puntos).length?`<h2>Puntos de control</h2><ul>${toArr(r.puntos).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${toArr(r.tips).length?`<h2>Secretos de la casa</h2><ul>${toArr(r.tips).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}${r.conservacion?`<h2>Conservación</h2><div>${esc(r.conservacion)}</div>`:""}</body></html>`); w.document.close(); }

  ${rec.tab==="ins"?`<div class="racts" style="margin-bottom:10px"><button class="btn p" id="insNuevo">➕ Insumo</button><span class="mut">Precio por unidad base (kg, L, pza). Con eso se estima el costo de cada receta.</span></div><div class="ptable-wrap"><table class="ptable rtab"><thead><tr><th>Insumo</th><th>Unidad</th><th>Precio</th><th>Proveedor</th><th>Presentación</th></tr></thead><tbody>${Object.entries(insumos).sort((a,b)=>a[1].nombre.localeCompare(b[1].nombre)).map(([k,v])=>`<tr><td class="pn"><input data-in="${k}" data-ik="nombre" value="${esc(v.nombre)}"></td><td><select data-in="${k}" data-ik="unidad">${UNIDADES.map(u=>`<option${v.unidad===u?" selected":""}>${u}</option>`).join("")}</select></td><td><div class="pin"><span>$</span><input type="number" step="any" min="0" data-in="${k}" data-ik="precio" value="${v.precio!=null?esc(v.precio):""}" style="width:80px"></div></td><td><select data-in="${k}" data-ik="proveedor"><option value="">—</option>${Object.entries(proveedores).map(([pk,p])=>`<option value="${pk}"${v.proveedor===pk?" selected":""}>${esc(p.nombre)}</option>`).join("")}</select></td><td><input data-in="${k}" data-ik="presentacion" value="${esc(v.presentacion||"")}" placeholder="bulto 44 kg"></td></tr>`).join("")}</tbody></table></div>`:""}

function ordenTexto(p,items){ const L=["🐸 *GORDITAS RANITAS · ORDEN DE COMPRA*","Para: "+provNombre(p)+" · "+fmtFecha(Date.now()),""]; items.forEach(x=>L.push("• "+insNombre(x.insumo)+": *"+fmtCant(x.cant,x.unidad)+"*"+((insumos[x.insumo]||{}).presentacion?" ("+(insumos[x.insumo]||{}).presentacion+")":""))); L.push("","Favor de confirmar precio y hora de entrega. ¡Gracias!"); return L.join("\n"); }

  $("#main").innerHTML=`<div class="top"><h1>🪑 Mesas</h1>${sucSelect()}<span class="sp"></span>${mesas.length?`<button class="btn p" id="mesaAdd">➕ Agregar mesa ${sig}</button>`:`<button class="btn p" id="mesaSeis">➕ Crear 6 mesas</button>`}<div class="sub">Cada mesa tiene su QR. El comensal lo escanea, arma su pedido y lo ordena solo, sin pasar por caja. Sus pedidos llegan a cocina con prioridad y la etiqueta 🪑. Imprime la hoja tamaño carta y ponla en la mesa.</div></div>

  $("#main").dataset.mesasSig=firma; document.querySelectorAll(".qr[data-qr]").forEach(el=>{ try{ new QRCode(el,{text:el.dataset.qr,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent="QR"; } });

const digitsA=x=>String(x||"").replace(/\D/g,"").slice(-10);
async function crearSucursal(nombre,tels,direccion){ const base=slugify(nombre).replace(/-/g,"")||("suc"+Date.now().toString(36)); let id=base, i=2; while(SUC_TODAS[id]) id=base+i++;
  const paso=async(t,fn)=>{ sucLog.push({t,ok:false}); renderSucursales(); await fn(); sucLog[sucLog.length-1].ok=true; renderSucursales(); };
  sucCreando=true; sucLog=[]; renderSucursales();
  const orden=Math.max(0,...Object.values(SUC_TODAS).map(x=>x.orden||0))+1;
  await paso("Registro de la sucursal "+nombre,()=>db.ref(ROOT+"/sucursales/"+id).set({n:nombre,tels,direccion:direccion||"",activa:true,orden,creado:Date.now()}));

  await paso("6 mesas con su QR",async()=>{ for(let m=1;m<=6;m++) await crearMesa(id,m); });
  await paso("Mostrador para caja",()=>asegurarMostrador(id));
  await paso("Cocina lista (los cocineros se agregan desde la vista Cocina)",()=>db.ref(ROOT+"/cocina/"+id+"/creado").set(Date.now()));
  await paso("Bitácora",async()=>{ bit("tablero","sucursal","Creó la sucursal "+nombre+" ("+id+") con catálogo, 6 mesas y mostrador",{sucursal:id}); });
  sucCreando=false; sucLog.push({t:"Listo: "+nombre+" ya puede recibir pedidos",ok:true}); renderSucursales(); toast("🏬 "+nombre+" creada y lista"); setTimeout(()=>{ sucLog=[]; if(vista==="sucursales") renderSucursales(); },8000); return id; }
document.addEventListener("click",async e=>{ if(vista!=="sucursales"||!yo||yo.id!=="maestro") return; const t=e.target;
  if(t.id==="sCrear"){ const nombre=$("#sNombre").value.trim(); const t1=digitsA($("#sTel").value), t2=digitsA($("#sTel2").value); if(nombre.length<3) return toast("Pon el nombre de la sucursal"); if(t1.length<10) return toast("Pon el WhatsApp de 10 dígitos"); const tels=[t1].concat(t2.length===10?[t2]:[]); if(Object.values(SUC_TODAS).some(x=>x&&(x.n||"").trim().toLowerCase()===nombre.toLowerCase())) return toast("Ya existe una sucursal con ese nombre"); try{ await crearSucursal(nombre,tels,$("#sDir").value.trim()); }catch(err){ sucCreando=false; toast("Algo falló: "+err.message); renderSucursales(); } return; }
