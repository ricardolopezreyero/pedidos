<style>
/* RLR */
:root{--y:#FFD60A;--y2:#FFF1B8;--y3:#FFFBEA;--r:#E4322B;--r2:#FDE7E5;--g:#2E9E3E;--g2:#E3F5E6;--b:#2b4a9e;--b2:#eef3ff;--v:#7c3aed;--ink:#231F1A;--mut:#7A736B;--line:#EEE3BF;--sh:0 6px 18px rgba(90,70,0,.10);--side:236px}
*{box-sizing:border-box}
html,body{margin:0;background:#F3EFE2;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:14px;line-height:1.35;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{user-select:none;-webkit-user-select:none}
@media(pointer:coarse){.btn,.chip,.coc,.item,.mini,.kstep{min-height:42px}.qty button{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0}
/* ---------- layout: menú izquierdo + contenido ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100dvh}
aside{background:var(--ink);color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:var(--y);padding:4px 8px 14px}
.logo small{color:#fff;opacity:.6;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{border:0;background:transparent;color:#ddd;text-align:left;padding:10px 12px;border-radius:12px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button.on{background:var(--y);color:var(--ink)}
.nav button .n{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:0 8px;font-size:11.5px}
.nav button.on .n{background:rgba(0,0,0,.12)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding-top:10px;font-size:12.5px;color:#bbb}
.side-foot b{color:#fff;display:block}
.side-foot .dot{width:8px;height:8px;border-radius:50%;background:#777;display:inline-block;margin-right:5px}
.side-foot .dot.on{background:#4ade80}
.side-foot button{margin-top:8px;width:100%;border:1.5px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:10px;padding:8px;font-weight:800}
main{padding:18px 20px 60px;min-width:0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:22px;font-weight:900}
.top .sub{color:var(--mut);font-weight:700;font-size:13px;width:100%}
.top select{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.top .sp{margin-left:auto}
@media(min-width:821px) and (max-width:1100px){
  .app{grid-template-columns:72px 1fr}
  aside{padding:12px 8px}.logo{justify-content:center;padding:4px 0 12px;font-size:22px}.logo span,.logo small{display:none}
  .nav button{justify-content:center;padding:12px 0;font-size:20px}.nav button .t{display:none}.nav button .n{position:absolute;margin:-26px 0 0 26px;font-size:10px}
  .side-foot{text-align:center;font-size:11px}.side-foot .who,.side-foot #conn{display:none}.side-foot button{padding:8px 4px;font-size:16px}.side-foot button .t{display:none}
}
@media(min-width:1700px){ main{padding:24px 32px 60px} .kpi .v{font-size:34px} .board{grid-auto-columns:minmax(300px,1fr)} }
@media(max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{position:sticky;height:auto;flex-direction:row;align-items:center;gap:8px;padding:8px 10px;overflow-x:auto}
  .logo{padding:0 6px 0 0;font-size:16px}.logo small{display:none}
  .nav{flex-direction:row}.nav button{padding:8px 10px;font-size:13px;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;border:0;padding:0}.side-foot b,.side-foot #conn,.side-foot .dot{display:none}.side-foot button{margin:0;padding:7px 10px;width:auto}
  main{padding:12px 12px 40px}
}
/* ---------- piezas ---------- */
.card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;border-top:4px solid var(--y)}
.kpi .v{font-size:28px;font-weight:900;line-height:1.05}
.kpi .l{font-size:12px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.kpi .d{font-size:12px;font-weight:700;color:#5a4a00;margin-top:4px}
.kpi.k2{border-color:var(--r)}.kpi.k3{border-color:var(--b)}.kpi.k4{border-color:var(--v)}.kpi.k5{border-color:var(--g)}.kpi.k6{border-color:#999}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:16px;font-weight:900}
.sec span{font-size:12.5px;color:var(--mut);font-weight:700}
.capa{font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff!important;background:var(--ink);border-radius:999px;padding:3px 10px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid #f3ecd6;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:900;background:var(--y3)}
.bar{height:8px;background:#f0e9d2;border-radius:999px;overflow:hidden;margin-top:4px;display:flex}
.bar i{display:block;height:100%;background:var(--g)}
.bar i.h{background:#c98a00}.bar i.m{background:#e8c11c}
.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:10px;font-weight:800;padding:6px 0;border-bottom:1px solid #f3ecd6}
.row small{color:var(--mut);font-weight:700}
.b{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#f2ecd6;color:#6b5a00;display:inline-block}
.b.suc{background:var(--b2);color:var(--b)}.b.ok{background:var(--g2);color:var(--g)}.b.wip{background:var(--r2);color:var(--r)}.b.tab{background:var(--y2)}.b.off{background:var(--r);color:#fff}
.empty{color:var(--mut);font-weight:700;text-align:center;padding:18px 8px;font-size:13px}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:800;font-size:12.5px;background:#f2ecd6}
.btn.p{background:var(--g);color:#fff}.btn.r{background:var(--r);color:#fff}.btn.bl{background:var(--b);color:#fff}.btn.v{background:var(--v);color:#fff}.btn.ghost{background:transparent;border:1.5px solid var(--line)}.btn.y{background:var(--y)}
/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;overflow-x:auto;align-items:start;padding-bottom:10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{scroll-snap-align:start}
@media(max-width:700px){.board{grid-auto-columns:86vw}}
.col{background:rgba(255,255,255,.55);border-radius:16px;padding:8px;min-height:40vh}
.col-head{font-weight:900;font-size:14px;padding:6px 6px 10px;display:flex;justify-content:space-between;align-items:center}
.col-head .n{background:#fff;border-radius:999px;padding:1px 8px;font-size:12px;color:var(--mut)}
.col.k1 .col-head{color:#8a5a00}.col.k2 .col-head{color:var(--r)}.col.k3 .col-head{color:var(--b)}.col.k4 .col-head{color:var(--v)}.col.k5 .col-head{color:var(--g)}.col.k6 .col-head{color:var(--mut)}.col.k6{background:rgba(70,55,10,.14)}
.cards{display:flex;flex-direction:column;gap:8px}
.pc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 12px;border-left:5px solid var(--y)}
.pc.flash{animation:fl 1.6s ease-out}
.pc.moved{animation:pmoved 1.2s ease-out}
@keyframes pmoved{0%,60%{box-shadow:0 0 0 4px var(--y),var(--sh)}100%{box-shadow:var(--sh)}}
.pc.flip{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.acts2{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.acts2 .btn:not(.ghost){flex:1;font-size:14px;padding:11px 12px;border-radius:12px}
.acts2 .btn.ghost{padding:8px 10px}
.acts2 .b.wip{align-self:center}

/* arrastre de tarjetas — RLR */
body.dragging{cursor:grabbing!important;-webkit-user-select:none;user-select:none}
body.dragging *{cursor:grabbing!important}
body.dragging .board{scroll-snap-type:none}
.drag-src{opacity:.35!important;box-shadow:none!important;transform:scale(.98);outline:2px dashed rgba(0,0,0,.25);outline-offset:-2px}
.drag-ghost{position:fixed;z-index:999;margin:0;pointer-events:none;box-shadow:0 22px 44px rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.14)!important;will-change:transform;transform-origin:50% 50%;opacity:.98;animation:none!important}
.drag-ghost.landing{box-shadow:0 2px 8px rgba(0,0,0,.12)!important}
.col.drop-can{outline:2px dashed rgba(0,0,0,.2);outline-offset:-2px;transition:background .15s,opacity .15s}
.col.drop-dim{opacity:.5;transition:opacity .15s}
.col.drop-ok{outline:3px solid #2D9D4A;outline-offset:-3px;background:rgba(45,157,74,.14)!important}
.col.drop-no{outline:3px solid #E4322B;outline-offset:-3px;background:rgba(228,50,43,.08)!important}
.drop-slot{border:2px dashed #2D9D4A;border-radius:14px;background:rgba(45,157,74,.1);height:0;opacity:0;transition:opacity .18s,height .18s ease-out;box-sizing:border-box}
.drop-slot.in{opacity:1}
.empty.drop-hid{display:none}
#dragLbl,#swipeLbl{position:fixed;z-index:1000;pointer-events:none;color:#fff;font-weight:900;font-size:13px;padding:7px 12px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);white-space:nowrap;max-width:82vw;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .12s,background .12s;background:#231F1A}
#dragLbl.ok,#swipeLbl.ok{background:#2D9D4A;opacity:1}
#dragLbl.no,#swipeLbl.no{background:#E4322B;opacity:1}
#swipeLbl{transform:translateY(-50%);font-size:14px}
#swipeLbl.listo{transform:translateY(-50%) scale(1.1)}
body.swiping{-webkit-user-select:none;user-select:none}
.swiping{will-change:transform;position:relative;z-index:5}
@media(pointer:coarse){ .board article{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none} }
@media(prefers-reduced-motion:reduce){ .drop-slot{transition:none} }

.pc{cursor:grab}
.col[data-col="archivado"] .pc{cursor:default}

/* Data Room — RLR */
.dr-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.dr-nav{position:sticky;top:12px;display:flex;flex-direction:column;gap:3px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:8px}
.dr-nav button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:none;border-radius:12px;padding:7px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.dr-nav button .e{font-size:18px;width:24px;text-align:center;flex:none}
.dr-nav button b{font-size:13.5px;display:block}.dr-nav button small{font-size:11px;color:var(--mut);font-weight:700;line-height:1.25;display:block}
.dr-nav button.on{background:var(--y)}.dr-nav button:hover{background:#FFF6C2}
.dr-badge{display:inline-block;background:var(--r);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;font-style:normal;vertical-align:middle}
.dr-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}.dr-head .e{font-size:34px}.dr-head h2{margin:0;font-size:22px;line-height:1.15}.dr-head small{color:var(--mut);font-weight:800}
.dr-hist{background:#fff;border-left:5px solid var(--y);border-radius:14px;box-shadow:var(--sh);padding:14px 18px;font-size:15px;line-height:1.5;margin-bottom:12px}
.dr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px}
.dr-card{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:14px 16px;min-width:0}.dr-card.wide{grid-column:1/-1}
.dr-card h3{margin:0 0 4px;font-size:15px}.dr-ans{margin:0 0 10px;color:#5a4a00;font-size:13px;font-weight:700;line-height:1.4}.dr-nota{margin:8px 0 0;font-size:12px;color:var(--mut)}
.drsvg{width:100%;height:auto;display:block;font-family:inherit}
.drsvg .grid{stroke:rgba(0,0,0,.08)}.drsvg .ax{font-size:11px;font-weight:700;fill:#777}.drsvg .val{font-size:11px;font-weight:900;fill:#333}.drsvg .lbl{font-size:12px;font-weight:800;fill:#333}.drsvg .hv{font-size:10px;font-weight:800}
.dr-leg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:800;color:#555;margin-top:6px}.dr-leg i,.dr-dleg i,.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:middle}
.dr-donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.dr-donut svg{width:180px;height:180px;flex:none}.dr-donut .big{font-size:20px;font-weight:900;fill:#231F1A}.dr-donut .ax{font-size:11px;font-weight:700;fill:#777}.dr-dleg{display:flex;flex-direction:column;gap:5px;font-size:13px}.dr-dleg b{margin-right:6px}.dr-dleg span{color:var(--mut);font-weight:700}
.dr-tblw{overflow-x:auto}.dr-tbl{width:100%;border-collapse:collapse;font-size:13px}.dr-tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:6px 8px;border-bottom:2px solid var(--line)}.dr-tbl td{padding:7px 8px;border-bottom:1px solid #f0ead6;white-space:nowrap}.dr-tbl td.f{font-weight:800;white-space:normal}
.dr-delta{font-weight:900;border-radius:6px;padding:1px 5px;background:#eee}.dr-delta.up{background:#dcf5e3;color:#166534}.dr-delta.down{background:#fde3e1;color:#b3261e}
.dr-empty{color:var(--mut);font-weight:700;text-align:center;padding:18px}
.dr-per{display:flex;gap:4px}
.dr-capas{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#drMapa{height:460px;border-radius:14px;overflow:hidden;background:#eee}.dr-star{font-size:22px;text-align:center;line-height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}.dr-tip{font-weight:900;font-family:inherit}
.dr-dec{display:flex;flex-direction:column;gap:8px;margin-top:12px}.dr-d{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;border-left:5px solid #ccc}.dr-d.alta{border-color:var(--r)}.dr-d.media{border-color:#f59e0b}.dr-d.baja{border-color:var(--y)}.dr-d.ok{border-color:var(--g)}.dr-d p{margin:3px 0 0;font-size:13px;color:#444}.dr-ds{font-size:22px;text-align:center}.dr-ds small{display:block;font-size:10px;color:var(--mut);font-weight:800}
.hist-mas{width:100%;margin-top:4px}

/* QR de pantalla completa — RLR */
#qrFull{position:fixed;inset:0;background:#fff;z-index:10000;display:none;align-items:center;justify-content:center;padding:20px;cursor:pointer}#qrFull.on{display:flex}
#qrFull .qrbox{text-align:center;display:grid;gap:10px;justify-items:center}#qrFull .qrcode img,#qrFull .qrcode canvas{display:block;image-rendering:pixelated}#qrFull .qrt{font-size:22px;font-weight:900}#qrFull .qru{font-weight:800;color:#6b5a00;word-break:break-all;max-width:90vw}

.uform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 10px;align-items:end}.uform label{display:grid;gap:3px;font-size:12px;font-weight:800;color:var(--mut)}.uform input,.uform select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;background:#fff}.uform .w2{grid-column:span 2}
.utallas{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}.utallas h3{margin:0 0 6px}.utalla{font-size:16px}.uh{font-size:17px;margin:18px 0 8px}.usol{margin-bottom:8px}.btn.big{font-size:15px;padding:12px 16px}
@media(max-width:700px){.uform .w2{grid-column:span 1}}
.tciu{margin-bottom:12px}.tciu-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.tciu-h input{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;min-width:240px}.tciu-esp{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;padding-top:8px;border-top:1px dashed var(--line)}
@media(max-width:900px){.dr-wrap{grid-template-columns:1fr}.dr-nav{position:static;flex-direction:row;overflow-x:auto}.dr-nav button{flex:none;width:170px}}
@media print{aside,.dr-per,#drSuc,.dr-nav,#instPill,.toast,.demo-banner{display:none!important}.app{display:block}main{padding:0}.dr-card{break-inside:avoid;box-shadow:none;border:1px solid #ddd}}
@keyframes fl{0%{background:#FFF3B0}100%{background:#fff}}
.pc-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc-top h3{font-size:15px;font-weight:900}
.when{font-size:11.5px;color:var(--mut);font-weight:700;white-space:nowrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 6px}
.pl{font-size:13px;margin:2px 0}.pl b{font-weight:900}.pl i{color:var(--mut)}
.notas{margin-top:5px;font-size:12.5px;background:var(--y2);border-radius:8px;padding:4px 8px;color:#5a4a00}
.tot{margin-top:6px;font-size:12px;font-weight:800;color:var(--mut)}
.acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
/* productos / precios */
.grp{background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
.grp h3{font-size:15px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.grp h3 span{font-size:12px;color:var(--mut);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:800;cursor:pointer;user-select:none}
.item.off{background:var(--r2);border-color:#f3b8b4;color:#b3261e;text-decoration:line-through}
.sw{width:40px;height:22px;border-radius:999px;background:#ccc;position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.item:not(.off) .sw{background:var(--g)}.item:not(.off) .sw::after{left:21px}
.ptable-wrap{overflow-x:auto}
.ptable{width:100%;max-width:640px;border-collapse:separate;border-spacing:0}
.ptable th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 10px;border-bottom:1.5px solid var(--line)}
.ptable th.mh,.ptable th.mm,.ptable td.mh,.ptable td.mm{width:150px;text-align:center}

function demoRef(path){ const segs=String(path).replace(/^\/+|\/+$/g,"").split("/").slice(1);
  const get=()=>segs.reduce((o,k)=>(o==null?undefined:o[k]),DEMO);
  const setAt=(val)=>{ let o=DEMO; for(let i=0;i<segs.length-1;i++){ if(o[segs[i]]==null||typeof o[segs[i]]!=="object") o[segs[i]]={}; o=o[segs[i]]; } const last=segs[segs.length-1]; if(val==null) delete o[last]; else o[last]=val; };
  const api={ set:v=>{ setAt(dfix(v)); demoSync(); return Promise.resolve(); }, update:p=>{ Object.entries(p||{}).forEach(([k,v])=>demoRef(path+"/"+k)._raw(v)); demoSync(); return Promise.resolve(); }, remove:()=>{ setAt(null); demoSync(); return Promise.resolve(); },
    push:v=>{ const k="-D"+Date.now().toString(36)+Math.random().toString(36).slice(2,5); demoRef(path+"/"+k)._raw(v); demoSync(); return Promise.resolve({key:k}); },
    transaction:(fn,cb)=>{ const cur=get(); const nv=fn(cur==null?cur:JSON.parse(JSON.stringify(cur))); if(nv===undefined){ if(cb) cb(null,false); } else { setAt(dfix(nv)); demoSync(); if(cb) cb(null,true,{val:()=>nv}); } return Promise.resolve(); },

      <div class="pos-borrar"><button class="btn ghost" id="posBorrar">🗑 Borrar este pedido</button></div>

  </div>`;
  pos._items=filt;
  if(keep){ const el=document.getElementById(keep.id); if(el){ if(el.value!==keep.v) el.value=keep.v; el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s,keep.e); }catch(e){} } }

  const cp=t.closest("[data-copy]"); if(cp){ navigator.clipboard.writeText(cp.dataset.copy).then(()=>toast("Liga copiada")); return; }
  if(!pos.card) return; const c=pos.card; const p=c.personas[pos.per];

  if(t.id==="posMin"){ pararVoz(); minimizarPos(); return; } if(t.id==="posCocina"){ mandarCocina(); return; } if(t.id==="posGuardar"){ const live=((tableros[pos.slug]||{}).pedidos||{})[c.id]; if(live&&live.estado==="pedido"&&live.etapa&&live.etapa!=="proceso"&&diffPedido(pos.orig,c)&&!confirm("La cocina ya tomó este pedido ("+(live.cocinero||{}).nombre+"). ¿Guardar el cambio de todos modos? Avísale a cocina.")) return; const df=diffPedido(pos.orig,c); bit("edicion","edito",df?"Cambió: "+df:"Guardó sin cambios",{pedido:c.id,familia:c.familia,tablero:pos.slug}); guardarPos().then(()=>{ pos.card=null; pos.slug=null; vista="pedidos"; syncUrl(); render(); }); return; }
  if(t.id==="posBorrar"){ if(confirm("¿Borrar este pedido?")){ bit("pedido","borro","Borró el pedido desde Mostrador ("+totStr(totales(c))+")",{pedido:c.id,familia:c.familia,tablero:pos.slug}); if(pos.slug) db.ref(ROOT+"/tableros/"+pos.slug+"/pedidos/"+c.id).remove(); pos.card=null; pos.slug=null; render(); } return; }
  if(t.id==="posAddPer"||t.closest("#posAddPer")){ c.personas.push(nuevaPersona(c.personas.length+1)); pos.per=c.personas.length-1; pos.qtxt=""; renderMostrador(); $("#posQ").focus(); return; }

  const per=t.closest("[data-per]"); if(per){ pos.per=+per.dataset.per; pos.masa=c.personas[pos.per].masa||"harina"; pos.qtxt=""; renderMostrador(); $("#posQ").focus(); return; }
  const ms=t.closest("[data-masa]"); if(ms){ pos.masa=ms.dataset.masa; p.masa=pos.masa; renderMostrador(); $("#posQ").focus(); return; }

});
document.addEventListener("input",e=>{ if(e.target.id!=="posAnfQ") return; const q=e.target.value.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); document.querySelectorAll(".posmesas.anf [data-busca]").forEach(b=>{ b.hidden=!!q&&!b.dataset.busca.normalize("NFD").replace(/[̀-ͯ]/g,"").includes(q); }); });
/* Dictado: "dos chicharrón prensado de maíz, un café de olla, chilaquiles, otra persona" → se van agregando solos — RLR */
const voz={on:false,rec:null,txt:""};
const NUMS={un:1,una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
const normV=x=>(x||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function itemsVoz(){ const items=[]; CATC("g").forEach(i=>items.push({c:"g",n:i,k:catKey("g",i)})); items.push({c:"ch",n:"Chilaquiles",k:catKey("ch","Chilaquiles"),alias:["chila","chilaquil"]}); CATC("po").forEach(i=>items.push({c:"po",n:i,k:catKey("po",i)})); CATC("b").forEach(i=>items.push({c:"b",n:i,k:catKey("b",i)})); return items; }
const ALIAS={"Café de olla":["cafe","cafe de olla"],"Café de grano":["cafe de grano","grano","americano"],"Jugo de naranja":["jugo","naranja","jugo de naranja"],"Refresco":["refresco","coca","soda","cocacola"],"Chicharrón prensado":["chicharron","chicharron prensado","prensado"],"Chicharrón pella":["pella","chicharron pella"],"Rajas con crema":["rajas","rajas con crema"],"Rajas con crema y queso":["rajas con queso","rajas con crema y queso","rajas queso"],"Frijoles con queso":["frijoles con queso","frijol con queso"],"Frijoles":["frijoles","frijol"],"Huevo verde":["huevo verde","huevos verdes"],"Huevo rojo":["huevo rojo","huevos rojos","huevo en salsa"],"Papas rojas":["papas","papas rojas","papa"],"Gordita Nutella":["nutella"],"Gordita Cajeta":["cajeta"],"Carne con chile":["carne con chile","carne"],"Guiso verde":["guiso verde","verde"],"Picadillo":["picadillo"],"Discada":["discada"],"Choriqueso":["choriqueso","chori queso"],"Asado":["asado"],"Deshebrada":["deshebrada"],"Queso":["queso","de queso"],"Barbacoa":["barbacoa"],"Combinada":["combinada"],"Chilaquiles":["chilaquiles","chilaquil","chila"],"Brownie":["brownie"],"Pay":["pay"]};
function vocab(){ const V=[]; itemsVoz().forEach(it=>{ const frases=[normV(it.n)].concat((ALIAS[it.n]||[]).map(normV)); frases.forEach(f=>V.push({it,w:f.split(" ")})); }); return V.sort((a,b)=>b.w.length-a.w.length); }
const wEq=(tok,w)=>tok===w||(w.length>=4&&tok.startsWith(w.slice(0,4)))||(tok.length>=4&&w.startsWith(tok.slice(0,4)))||(tok.length>=5&&w.startsWith(tok));
function procesarVoz(texto){ if(!pos.card) return; const toks=normV(String(texto).replace(/,/g," , ")).split(" ").filter(Boolean); const V=vocab(); const hechos=[]; const items=[]; let n=null, masaGlobal=null, i=0;
  const cmd=(a,b)=>toks[i]===a&&toks[i+1]===b;
  while(i<toks.length){ const t=toks[i];
    if(t===","||["y","con","mas","tambien","por","favor","me","das","dame","quiero","unas","unos","una","otra","otro","mas","el","la","los","las","para","llevar","aqui"].includes(t)&&!(t==="otra"&&toks[i+1]==="persona")&&!(t==="una"&&NUMS[t])){ if(t==="una"||t==="unos"||t==="unas"){ n=1; } i++; continue; }
    if(cmd("otra","persona")||cmd("nueva","persona")||cmd("persona","nueva")||cmd("siguiente","persona")||cmd("otra","gente")){ items.push({cmd:"persona"}); i+=2; continue; }
    if(t==="listo"||t==="mandar"||cmd("a","cocina")){ items.push({cmd:"mandar"}); i+= (t==="a"?2:1); continue; }
    if(/^\d+$/.test(t)){ n=+t; i++; continue; } if(NUMS[t]!=null){ n=NUMS[t]; i++; continue; }
    if(t==="maiz"||t==="harina"){ const last=items.length?items[items.length-1]:null; if(last&&last.it&&last.it.c==="g"&&!last.masa) last.masa=t; else masaGlobal=t; i++; continue; }
    if(t==="de"&&(toks[i+1]==="maiz"||toks[i+1]==="harina")){ i++; continue; }
    let best=null; for(const v of V){ let ok=true; for(let k=0;k<v.w.length;k++){ if(!toks[i+k]||!wEq(toks[i+k],v.w[k])){ ok=false; break; } } if(ok){ best=v; break; } }
    if(best){ items.push({it:best.it,n:n||1,masa:null}); n=null; i+=best.w.length; continue; }
    i++; }
  let mandar=false; items.forEach(x=>{ if(x.cmd==="persona"){ pos.card.personas.push(nuevaPersona(pos.card.personas.length+1)); pos.per=pos.card.personas.length-1; hechos.push("👤 "+nombreDe(pos.card.personas[pos.per])); return; } if(x.cmd==="mandar"){ mandar=true; return; }
    const masa=x.masa||masaGlobal||pos.masa; const prev=pos.masa; pos.masa=masa; pos.qtxt=String(x.n); agregarPos(x.it,true); pos.masa=prev; hechos.push(x.n+" "+x.it.n+(x.it.c==="g"?" "+(masa==="maiz"?"maíz":"harina"):"")); });
  if(hechos.length) toast("🎤 "+hechos.join(" · ")); renderMostrador(); if(mandar){ pararVoz(); mandarCocina(); } }
function iniciarVoz(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast("Este navegador no tiene dictado. Usa Chrome o Safari."); return; } if(!pos.card) nuevoPedidoPos(); const r=new SR(); r.lang="es-MX"; r.continuous=true; r.interimResults=true; voz.rec=r; voz.on=true; voz.txt="";

function vecinoRec(rid,d){ const orden={masa:0,guiso:1,salsa:2,chila:3,bebida:4,postre:5,base:6}; const ids=Object.entries(recetas).sort((a,b)=>((orden[a[1].cat]||9)-(orden[b[1].cat]||9))||a[1].nombre.localeCompare(b[1].nombre)).map(x=>x[0]); const i=ids.indexOf(rid); return ids[i+d]||null; }
function renderRecetaEdit(e){ const r=e.r; const pasos=pasosDe(r); return `<div class="card rcard"><div class="rhead"><h2>${e.id?"✏️ Editar receta":"➕ Nueva receta"}</h2><div class="racts"><button class="btn ghost" id="recCancel">Cancelar</button><button class="btn p" id="recGuardar">💾 Guardar</button>${e.id?`<button class="btn r" id="recBorrar">🗑</button>`:""}</div></div>

function guardarReceta(){ const e=rec.edit; if(!e) return; const r=JSON.parse(JSON.stringify(e.r)); r.nombre=(r.nombre||"").trim(); if(!r.nombre) return toast("Ponle nombre"); r.rinde=+r.rinde||1; r.unidad=(r.unidad||"gorditas").trim(); r.porcion=+r.porcion||null; r.dificultad=Math.min(3,Math.max(1,+r.dificultad||1)); r.ingredientes=toArr(r.ingredientes).filter(i=>i.insumo&&i.insumo!=="__nuevo"&&+i.cant>0).map(i=>({insumo:i.insumo,cant:+i.cant,unidad:i.unidad,prep:i.prep||""})); r.pasos=pasosDe(r).map(p=>({t:(p.t||"").trim(),min:p.min!==""&&p.min!=null?+p.min:null,temp:p.temp||""})).filter(p=>p.t); ["equipo","alergenos"].forEach(k=>{ if(typeof r[k]==="string") r[k]=r[k].split(",").map(x=>x.trim()).filter(Boolean); }); ["puntos","tips"].forEach(k=>{ if(typeof r[k]==="string") r[k]=r[k].split("\n").map(x=>x.trim()).filter(Boolean); }); if(r.validada){ r.supuesta=false; r.ref=false; } const id=e.id||slugify(r.nombre)||("r"+Date.now().toString(36)); r.actualizado=Date.now(); if(!e.id) r.creado=Date.now(); r.version=2;
  db.ref(ROOT+"/recetas/"+id).set(r).then(()=>{ toast("Receta guardada 📖"); bit("receta",e.id?"edito":"creo",(e.id?"Editó":"Creó")+" la receta "+r.nombre+" (rinde "+r.rinde+" "+r.unidad+", "+r.ingredientes.length+" ingredientes, "+r.pasos.length+" pasos)"); rec.edit=null; rec.sel=id; render(); }); }
function agregarACompras(items,origen){ const lista=Object.assign({},compras.lista||{}); items.forEach(i=>{ const [n,u]=enBase(i.cant,i.unidad); const k=i.insumo+"|"+u; const prev=lista[k]||{insumo:i.insumo,cant:0,unidad:u,origen:[]}; prev.cant=Math.round((+prev.cant+n)*1000)/1000; prev.origen=[...new Set(toArr(prev.origen).concat(origen?[origen]:[]))]; lista[k]=prev; }); compras.lista=lista; db.ref(ROOT+"/compras/lista").set(lista); }

function mesasDe(suc){ return Object.entries(anfitriones).filter(([k,v])=>v&&v.mesa&&v.sucursal===suc&&v.activa!==false).map(([k,v])=>Object.assign({slug:k},v)).sort((a,b)=>(a.numero||0)-(b.numero||0)); }
async function crearMesa(suc,num){ const sl=mesaSlug(suc,num); const sn=(SUCURSALES.find(x=>x.id===suc)||{}).n||suc; const nombre="Mesa "+num+" · "+sn;
  await db.ref(ROOT+"/anfitriones/"+sl).set({nombre,tel:"",slug:sl,mesa:true,sucursal:suc,numero:num,activa:true,creado:Date.now()});
  await db.ref(ROOT+"/tableros/"+sl+"/config").set({sucursal:suc,telIdx:0,anfitrion:"Mesa "+num,telAnfitrion:"",direccion:"En mesa "+num+" · "+sn,entrega:"",pago:"efectivo",pagoCon:"",sms:false,mesa:true});
  bit("tablero","mesa","Creó la "+nombre+" (/"+sl+")",{tablero:sl,sucursal:suc}); }
function renderMesas(){ const suc=pSuc; const sn=(SUCURSALES.find(x=>x.id===suc)||{}).n||suc; const mesas=mesasDe(suc);

  const activas=allCards().filter(c=>c.mesa&&c.estado!=="archivado");
  const hoy0=new Date(); hoy0.setHours(0,0,0,0); const entregadas=allCards().filter(c=>c.mesa&&c.entregadoEn&&(c.estado==="entregado"||c.estado==="archivado")); const entDe=sl=>{ const e=entregadas.filter(c=>c.slug===sl); return {hoy:e.filter(c=>c.entregadoEn>=hoy0.getTime()).length,total:e.length,g:e.reduce((a,c)=>a+totales(c).g,0)}; };
  $("#main").innerHTML=`<div class="top"><h1>🪑 Mesas</h1>${sucSelect()}${manualLink("caja")}<span class="sp"></span>${mesas.length?`<button class="btn p" id="mesaAdd">➕ Agregar mesa ${sig}</button>`:`<button class="btn p" id="mesaSeis">➕ Crear 6 mesas</button>`}<div class="sub">Cada mesa tiene su QR. El comensal lo escanea, arma su pedido y lo ordena solo, sin pasar por caja. Sus pedidos llegan a cocina con prioridad y la etiqueta 🪑. Imprime la hoja tamaño carta y ponla en la mesa.</div></div>
  <div class="mesas">${mesas.map(m=>{ const act=activas.filter(c=>c.slug===m.slug); const url=APP_URL+m.slug; return `<div class="mesa"><div class="mesa-h"><b>🪑 Mesa ${m.numero}</b>${act.length?`<span class="b wip">${act.length} pedido${act.length>1?"s":""} ahora</span>`:`<span class="b ok">libre</span>`}</div><div class="qr" data-qr="${esc(url)}"></div><div class="mesa-url">${esc(url.replace("https://",""))}</div>${(e=>`<div class="mesa-st"><span title="Pedidos entregados hoy en esta mesa">✅ <b>${e.hoy}</b> hoy</span><span title="Pedidos entregados desde que existe la mesa">📚 <b>${e.total}</b> en total</span>${e.total?`<span title="Gorditas servidas en esta mesa">🫓 <b>${e.g}</b></span>`:""}</div>`)(entDe(m.slug))}<div class="mesa-acts"><a class="btn y" href="/mesa?s=${esc(m.slug)}" target="_blank">🖨 Hoja para imprimir</a>${ligaBtns(url,"Copiar",(anfitriones[m.slug]||{}).nombre||m.slug)}<a class="btn ghost" href="/${esc(m.slug)}" target="_blank">Abrir</a><button class="btn ghost" data-quitar="${esc(m.slug)}" title="Ocultar esta mesa">✕</button></div></div>`; }).join("")||`<div class="empty big">${sn} todavía no tiene mesas. Crea las primeras 6 y agrega las que necesites.</div>`}</div>`;
  $("#main").dataset.mesasSig=firma; document.querySelectorAll(".qr[data-qr]").forEach(el=>{ try{ new QRCode(el,{text:el.dataset.qr,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }catch(e){ el.textContent="QR"; } });

  const todas=Object.entries(SUC_TODAS).map(([k,x])=>Object.assign({id:k},x)).sort((a,b)=>(a.orden||0)-(b.orden||0)||(a.creado||0)-(b.creado||0));

const digitsA=x=>String(x||"").replace(/\D/g,"").slice(-10);
async function crearSucursal(nombre,tels,direccion){ const base=slugify(nombre).replace(/-/g,"")||("suc"+Date.now().toString(36)); let id=base, i=2; while(SUC_TODAS[id]) id=base+i++;
  const paso=async(t,fn)=>{ sucLog.push({t,ok:false}); renderSucursales(); await fn(); sucLog[sucLog.length-1].ok=true; renderSucursales(); };
  sucCreando=true; sucLog=[]; renderSucursales();
  const orden=Math.max(0,...Object.values(SUC_TODAS).map(x=>x.orden||0))+1;
  await paso("Registro de la sucursal "+nombre,()=>db.ref(ROOT+"/sucursales/"+id).set({n:nombre,tels,direccion:direccion||"",activa:true,orden,creado:Date.now()}));
  await paso("Catálogo: "+CATALOGO.reduce((a,g)=>a+g.items.length,0)+" productos prendidos, harina y maíz",()=>{ const cat={}; CATALOGO.forEach(g=>g.items.forEach(it=>{ cat[catKey(g.c,it)]={on:true,precio:precioBase(g.c,it),precioM:g.c==="g"?precioBase(g.c,it):null,ts:Date.now()}; })); return db.ref(ROOT+"/catalogo/"+id).set(cat); });
  await paso("6 mesas con su QR",async()=>{ for(let m=1;m<=6;m++) await crearMesa(id,m); });
  await paso("Mostrador para caja",()=>asegurarMostrador(id));
  await paso("Cocina lista (los cocineros se agregan desde la vista Cocina)",()=>db.ref(ROOT+"/cocina/"+id+"/creado").set(Date.now()));
  await paso("Bitácora",async()=>{ bit("tablero","sucursal","Creó la sucursal "+nombre+" ("+id+") con catálogo, 6 mesas y mostrador",{sucursal:id}); });
  sucCreando=false; sucLog.push({t:"Listo: "+nombre+" ya puede recibir pedidos",ok:true}); renderSucursales(); toast("🏬 "+nombre+" creada y lista"); setTimeout(()=>{ sucLog=[]; if(vista==="sucursales") renderSucursales(); },8000); return id; }

/* ===== Arrastre de tarjetas entre columnas: mouse, pluma o dedo — Ricardo López Reyero (RLR) · build eye · rev 181218 =====
   Mouse/pluma: agarras y a los 6 px se levanta. Dedo en tablero de columnas: mantienes ~300 ms quieto y se levanta (si mueves antes, es scroll).
   Dedo en una columna a la vez (celular familias): deslizas la tarjeta a la derecha o izquierda → paso siguiente o anterior.
   La tarjeta levantada es un fantasma fijo que sigue al puntero; la original queda como hueco. Las columnas válidas se marcan y aparece
   el espacio donde va a caer; la de abajo se pone verde o roja con el motivo junto al puntero. Al soltar, el fantasma viaja solo a su lugar
   y se asienta; si no se puede, regresa con resorte. Cerca de los bordes, el tablero y la página se desplazan solos. Escape cancela. */
window.dragKanban=function(cfg){
  const HOLD=300, MOVE_MOUSE=6, CANCEL_TOUCH=10, EDGE=70;
  let st=null, raf=0, lbl=null;
  const reduce=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
  const vibra=ms=>{ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} };
  const colId=el=>el?el.dataset.col:null;
  const cols=()=>[...document.querySelectorAll(cfg.colSel)];
  const nombre=to=>cfg.nombre?cfg.nombre(to):to;
  function cardAt(e){ const t=e.target; if(!(t instanceof Element)) return null; if(t.closest("button,a,input,select,textarea,label,[contenteditable],.drag-ghost,.pmenu")) return null; const card=t.closest(cfg.cardSel); if(!card||!card.dataset.id) return null; const col=card.closest(cfg.colSel); if(!col) return null; return {card,col}; }
  function limpiarCols(){ cols().forEach(c=>c.classList.remove("drop-can","drop-dim","drop-ok","drop-no")); }
  function quitarSlot(){ if(st&&st.slot){ st.slot.remove(); st.slot=null; } document.querySelectorAll(".drop-slot").forEach(x=>x.remove()); document.querySelectorAll(".empty.drop-hid").forEach(x=>x.classList.remove("drop-hid")); }

    if(inApp) return h+`<p>Estás dentro de ${/WhatsApp/i.test(ua)?"WhatsApp":/Instagram/i.test(ua)?"Instagram":/FBAN|FBAV|Messenger/i.test(ua)?"Facebook":"otra app"}. Para instalarla hay que abrirla en el navegador:</p><div class="st"><i>${ios?"⎋":"⋮"}</i><span>Toca ${ios?"el botón de compartir o el ícono de Safari":"los tres puntos ⋮ arriba a la derecha"}</span></div><div class="st"><i>🧭</i><span>Elige <b>${ios?"Abrir en Safari":"Abrir en Chrome"}</b></span></div><div class="st"><i>📲</i><span>Ahí toca <b>Instalar la app</b> otra vez</span></div><button class="ic" data-i="cerrar">Ahora no</button>`;
    if(defer) return h+`<p>Queda en tu pantalla de inicio con el ícono de la ranita. Abre al instante y funciona aunque falle la señal.</p><button class="ib" data-i="prompt">📲 Instalar ahora</button><button class="ic" data-i="cerrar">Ahora no</button>`;
    if(ios) return h+`<p>En iPhone se instala desde Safari en tres toques:</p><div class="st"><i>⎋</i><span>Toca <b>Compartir</b> (el cuadrito con la flecha, abajo en el centro)</span></div><div class="st"><i>➕</i><span>Baja y toca <b>Agregar a pantalla de inicio</b></span></div><div class="st"><i>✅</i><span>Toca <b>Agregar</b> arriba a la derecha</span></div>${safari?"":"<p>Si no ves esa opción, abre esta liga en Safari.</p>"}<button class="ic" data-i="cerrar">Listo</button>`;
    if(android) return h+`<p>En Android se instala desde Chrome:</p><div class="st"><i>⋮</i><span>Toca los tres puntos arriba a la derecha</span></div><div class="st"><i>📲</i><span>Elige <b>Instalar aplicación</b> o <b>Agregar a pantalla de inicio</b></span></div><button class="ic" data-i="cerrar">Listo</button>`;
    return h+`<p>En computadora, en Chrome o Edge:</p><div class="st"><i>⊕</i><span>Toca el ícono de instalar al final de la barra de dirección</span></div><div class="st"><i>📲</i><span>Confirma <b>Instalar</b></span></div><button class="ic" data-i="cerrar">Listo</button>`; }
  window.abrirInstalar=function(){ box.innerHTML=html(); m.classList.add("on"); };
  m.addEventListener("click",async e=>{ if(e.target===m){ m.classList.remove("on"); return; } const b=e.target.closest("[data-i]"); if(!b) return; if(b.dataset.i==="cerrar"){ m.classList.remove("on"); try{ localStorage.setItem("ranitas-inst-no",String(Date.now()+3*864e5)); }catch(x){} return; } if(b.dataset.i==="prompt"&&defer){ defer.prompt(); const r=await defer.userChoice; defer=null; m.classList.remove("on"); pill.classList.remove("on"); if(r&&r.outcome==="accepted"){ try{ localStorage.setItem("ranitas-inst-no",String(Date.now()+365*864e5)); }catch(x){} } } });
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); defer=e; if(!std&&!noMostrar()) pill.classList.add("on"); });
  if((ios||inApp)&&!std&&!noMostrar()){ setTimeout(()=>pill.classList.add("on"),5000); }
  go.addEventListener("click",()=>abrirInstalar());
  no.addEventListener("click",()=>{ pill.classList.remove("on"); try{ localStorage.setItem("ranitas-inst-no",String(Date.now()+7*864e5)); }catch(e){} });
  window.addEventListener("appinstalled",()=>{ pill.classList.remove("on"); m.classList.remove("on"); });
  document.addEventListener("click",e=>{ if(e.target.closest("[data-instalar]")){ e.preventDefault(); abrirInstalar(); } });
  if(!("serviceWorker" in navigator)) return;
  const avisar=reg=>{ const w=reg.waiting; if(w) w.postMessage({tipo:"saltar"}); };
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("/sw").then(reg=>{ if(reg.waiting&&navigator.serviceWorker.controller) avisar(reg); reg.addEventListener("updatefound",()=>{ const nw=reg.installing; if(!nw) return; nw.addEventListener("statechange",()=>{ if(nw.state==="installed"&&navigator.serviceWorker.controller) avisar(reg); }); }); setInterval(()=>reg.update().catch(()=>{}),30*60*1000); document.addEventListener("visibilitychange",()=>{ if(!document.hidden) reg.update().catch(()=>{}); }); }).catch(()=>{}); });
  fetch("/sw",{cache:"no-store"}).then(r=>r.text()).then(t=>{ const v=(t.match(/VERSION="([^"]+)"/)||[])[1]; if(v){ window.ranitasVer=v; document.querySelectorAll("[data-ver]").forEach(el=>el.textContent="v "+v); } }).catch(()=>{});
})();
</script>
