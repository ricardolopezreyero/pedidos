/* RLR */

let cat={}, catRef=null, catSuc="", menu={};

const disponible=(c,name,masa)=>{ const v=cat[catKey(c,name)]; if(!v) return true; if(v.on===false) return false; if(c==="g"&&masa){ if(masa==="maiz"&&v.offM) return false; if(masa!=="maiz"&&v.offH) return false; } if(c==="g"&&!masa&&v.offH&&v.offM) return false; return true; };
const picDe=(name,cat)=>{ cat=cat||"g"; const nm=cat==="sal"?normSalsa(name):name; const v=menu[cat+"_"+slugify(nm)]; if(v&&v.pic!=null) return +v.pic; if(cat==="sal") return SALSAS_PIC[nm]||0; const g=GUISOS.find(x=>x.n===name); return g?g.pic:0; };
const picTxt=(name,cat)=>{ const n=picDe(name,cat); return n?" "+"🌶".repeat(n):""; };

const precioBase=(c,name)=>{ const k=catKey(c,name); return PRECIOS_BASE[k]!=null?PRECIOS_BASE[k]:(PRECIOS_BASE[c]!=null?PRECIOS_BASE[c]:null); };
function precioDe(c,name,masa){ const v=cat[catKey(c,name)]||{}; if(c==="g"&&masa==="maiz"&&v.precioM!=null&&v.precioM!=="") return +v.precioM; if(v.precio!=null&&v.precio!=="") return +v.precio; return precioBase(c,name); }
function suscribirCatalogo(){ if(!db||!SLUG||config.sucursal===catSuc) return; if(catRef) catRef.off(); catSuc=config.sucursal; catRef=db.ref(ROOT+"/catalogo/"+catSuc);

  if(!menu._on){ menu._on=1; db.ref(ROOT+"/menu").on("value",s=>{ menu=Object.assign({_on:1},s.val()||{}); if(ui.draft) renderEditor(); }); } }
// Qué trae un pedido que la sucursal actual ya no tiene
function faltantes(c){ const F=[]; toArr(c.personas).forEach(p=>{ const n=nombreDe(p);
  toArr(p.gorditas).forEach(l=>{ if(!disponible("g",l.guiso,l.masa)) F.push(n+": "+l.guiso+" de "+(l.masa==="maiz"?"maíz":"harina")); });
  if(p.chilaquiles){ const ch=p.chilaquiles; if(!disponible("ch","chilaquiles")) F.push(n+": chilaquiles"); else { if(ch.salsa&&!disponible("sal",ch.salsa)) F.push(n+": salsa "+ch.salsa.toLowerCase()); if(ch.queso&&!disponible("q",ch.queso)) F.push(n+": queso "+ch.queso.toLowerCase()); toArr(ch.extras).forEach(x=>{ if(!disponible("ex",x)) F.push(n+": "+x.toLowerCase()); }); if(ch.guiso&&!disponible("g",ch.guiso)) F.push(n+": guiso "+ch.guiso.toLowerCase()); } }
  toArr(p.bebidas).forEach(l=>{ if(!disponible("b",l.nombre)) F.push(n+": "+l.nombre); });
  toArr(p.postres).forEach(l=>{ if(!disponible("po",l.nombre)) F.push(n+": "+l.nombre); }); }); return F; }

function bit(cat,accion,det,x){ if(!db) return; x=x||{}; try{ db.ref(ROOT+"/bitacora").push({ts:firebase.database.ServerValue.TIMESTAMP,cat,accion,det:String(det||"").slice(0,600),

// Diferencia entre dos versiones de un pedido, en palabras
function diffPedido(a,b){ const out=[]; a=a||{personas:[]}; b=b||{personas:[]};
  if((a.familia||"")!==(b.familia||"")) out.push("familia: "+(a.familia||"—")+" → "+(b.familia||"—"));
  if((a.notas||"")!==(b.notas||"")) out.push("notas: "+(b.notas||"(sin notas)"));
  const A={}; toArr(a.personas).forEach(p=>A[p.id]=p); const B={}; toArr(b.personas).forEach(p=>B[p.id]=p);
  const cnt=L=>{ const m={}; L.forEach(l=>m[l]=(m[l]||0)+1); return m; };
  Object.keys(B).forEach(id=>{ const pb=B[id], pa=A[id]; const lb=personLines(pb); if(!pa){ out.push("+ "+nombreDe(pb)+(lb.length?": "+lb.join(", "):" (sin pedido)")); return; }
    const la=personLines(pa); if(nombreDe(pa)!==nombreDe(pb)) out.push(nombreDe(pa)+" → "+nombreDe(pb)); const ca=cnt(la), cb=cnt(lb); const add=[],rem=[];
    Object.keys(cb).forEach(k=>{ if(!ca[k]) add.push(k); }); Object.keys(ca).forEach(k=>{ if(!cb[k]) rem.push(k); });
    if(add.length||rem.length) out.push(nombreDe(pb)+": "+add.map(x=>"+"+x).concat(rem.map(x=>"−"+x)).join(", ")); });
  Object.keys(A).forEach(id=>{ if(!B[id]) out.push("quitó a "+nombreDe(A[id])); });
  return out.join(" · "); }

function patchCard(id,patch){ const c=pedidos[id]; if(!c) return; patch.actualizado=Date.now(); patch._w=SID; Object.keys(patch).forEach(k=>{ if(patch[k]===null) delete c[k]; else c[k]=patch[k]; }); cacheLocal(); if(db) db.ref(PATH+"/pedidos/"+id).update(clone(patch)).catch(()=>{}); renderBoard(); }

function initFirebase(){
  try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database(); }catch(e){ db=null; renderHeader(); return; }
  db.ref(".info/connected").on("value",s=>{ online=!!s.val(); if(online&&SLUG){ heartbeat(); if(ui.editing) setPresence(); } renderHeader(); });
  db.ref(ROOT+"/sucursales").on("value",s=>{ aplicarSucursales(s.val()); if(SLUG){ renderHeader(); renderBoard(); if($("#mCfg").classList.contains("open")) return; } else if(document.body.classList.contains("is-home")) renderHome(); });
  if(!SLUG){ renderHome(); return; }
  db.ref(ROOT+"/anfitriones/"+SLUG).once("value").then(s=>{
    const a=s.val();
    if(!a){ renderNotFound(); return; }
    ui.anf=a; recordarTablero(SLUG,a.nombre);
    const hq=QS.get("host"); if(hq!=null&&(hq===""||hq==="1"||digits(hq)===digits(a.tel))&&(hq!==""&&hq!=="1"||SLUG==="familia-lopez-acosta")){ activarHost(); }
    if(QS.has("host")) history.replaceState(null,"",location.pathname+(LOCAL?"?t="+SLUG:""));
    if(!config.anfitrion||config.anfitrion==="Ricardo"&&SLUG!=="familia-lopez-acosta") config.anfitrion=a.nombre;
    if(!config.telAnfitrion) config.telAnfitrion=a.tel||"";
    renderHeader(); renderBoard(); attachBoard(); suscribirCatalogo(); _cfgPrev=clone(config); bit("sistema","entro",(host?"Anfitrión":"Invitado")+" abrió el tablero"+(FAM?" por liga de familia":""));
  }).catch(()=>{ attachBoard(); suscribirCatalogo(); });
}
function attachBoard(){
  // Transición de la liga vieja (github.io): mientras alguien siga con la versión anterior abierta, sus cambios se recogen de la ruta antigua — RLR
  try{
    db.ref(PATH+"/presence").on("value",s=>{ ui.presence=s.val()||{}; renderBoard(); });
    db.ref(PATH+"/online").on("value",s=>{ ui.online=s.val()||{}; renderHeader(); });
    setInterval(heartbeat,45000);
    db.ref(PATH+"/config").on("value",s=>{ const v=s.val(); if(v) config=Object.assign({},config,v); else db.ref(PATH+"/config").set(clone(config)).catch(()=>{}); if(!$("#mCfg").classList.contains("open")) _cfgPrev=clone(config); cacheLocal(); renderHeader(); suscribirCatalogo(); });   // no se re-renderiza ⚙️ mientras está abierto: cerraba el teclado en iPhone
    db.ref(PATH+"/pedidos").on("value",s=>{
      const v=s.val()||{}; const next={};
      Object.keys(v).forEach(k=>{ next[k]=normCard(Object.assign({id:k},v[k])); });
      if(ui.editing&&ui.draft){
        const rem=next[ui.editing];
        // Otra pantalla cambió la tarjeta que tengo abierta y yo llevo >1.2 s sin teclear: adopto su versión sin perder el foco.
        if(rem&&rem._w&&rem._w!==SID&&Date.now()-ui.lastLocalEdit>1200&&JSON.stringify(rem)!==JSON.stringify(ui.draft)){ ui.draft=clone(rem); ui.draft.listo=false; renderEditor(); }
        else if(rem){ next[ui.editing]=Object.assign({},rem,{familia:ui.draft.familia,personas:ui.draft.personas,notas:ui.draft.notas}); Object.assign(ui.draft,{etapa:rem.etapa,cocinero:rem.cocinero,pago:rem.pago,faltas:rem.faltas,avance:rem.avance,empaque:rem.empaque}); }   // mi texto manda; el resto viene de afuera
        else next[ui.editing]=ui.draft;
      }
      pedidos=next; cacheLocal(); renderBoard();
      if(ui.editing&&pedidos[ui.editing]&&pedidos[ui.editing].estado==="pedido"&&pedidos[ui.editing].etapa&&pedidos[ui.editing].etapa!=="proceso"){ const idc=ui.editing; ui.editing=null; ui.draft=null; hide("mEditor"); hide("mConf"); clearPresence(idc); toast("🔥 La cocina ya tomó este pedido; ya no se puede cambiar aquí."); }
      const FAMID=FAM||(FAMLIGA?(Object.keys(pedidos).find(k=>pedidos[k].liga===FAMLIGA)||""):"");
      if(FAMID&&!ui.fOpened&&pedidos[FAMID]){ ui.fOpened=true; const FAM=FAMID; const c=pedidos[FAM]; mine.add(FAM); saveMine(); if(c.estado==="armando"||c.estado==="porpedir"){ openEditor(FAM); toast("Pedido de "+(c.familia||"")+" · pon lo tuyo 👇"); } else { ui.tab=c.estado; renderBoard(); } }
      // Limpieza automática (solo anfitrión): lo entregado hace más de 12 h se va al historial solo
      if(host&&!MESA()&&(!ui._sweep||Date.now()-ui._sweep>60000)){ ui._sweep=Date.now(); const lim=Date.now()-12*3600e3; Object.values(pedidos).filter(c=>c.estado==="entregado"&&(c.entregadoEn||0)<lim).forEach(c=>marcar(c.id,"archivado")); }
    });
  }catch(e){ renderHeader(); }
}

async function crearTablero(){
  const nombre=($("#hNombre").value||"").trim(), tel=digits($("#hTel").value), sl=slugify($("#hSlug").value); const m=$("#hMsg");
  if(nombre.length<2) return m.textContent="Pon el nombre del anfitrión.";
  if(tel.length<10) return m.textContent="Pon un celular de 10 dígitos.";
  if(sl.length<3) return m.textContent="La liga necesita al menos 3 letras.";
  if(["admin","manual","mesa","og","favicon","icon-512","apple-touch-icon","manifest","index","api","sms","proveedores","talento","sw"].includes(sl)||sl.startsWith("mesa-")||sl.startsWith("mostrador-")) return m.textContent="Esa liga está reservada. Prueba con tu apellido.";
  if(!db) return m.textContent="Sin conexión. Intenta de nuevo.";
  m.textContent="Revisando la liga…";
  const ref=db.ref(ROOT+"/anfitriones/"+sl); const ex=(await ref.once("value")).val();
  if(ex){ m.innerHTML=`Esa liga ya la tiene <b>${esc(ex.nombre)}</b>. ${digits(ex.tel)===tel?`Es tu celular: <button class="btn y" data-a="irHost" data-v="${esc(sl)}">entrar como anfitrión</button>`:"Prueba otra, por ejemplo <b>"+esc(sl)+"-"+tel.slice(-2)+"</b>."}`; return; }
  await ref.set({nombre,tel,slug:sl,creado:Date.now()});
  try{ db.ref(ROOT+"/bitacora").push({ts:firebase.database.ServerValue.TIMESTAMP,cat:"tablero",accion:"creo_tablero",det:"Creó el tablero "+nombre+" (/"+sl+")",actor:{tipo:"anfitrion",nombre,sid:SID},tablero:sl,tableroNombre:nombre,sucursal:"vinedos",app:"familias"}); }catch(e){}
  await db.ref(ROOT+"/tableros/"+sl+"/config").set({sucursal:"vinedos",telIdx:0,anfitrion:nombre,telAnfitrion:tel,direccion:"",entrega:"",pago:"efectivo",pagoCon:"",cierre:"",precioG:"",precioCh:"",precioB:"",precioPo:""});
  localStorage.setItem("ranitas-host-"+sl,"1"); recordarTablero(sl,nombre);
  m.textContent="¡Listo! Abriendo tu tablero…"; goTo(sl);
}
function entrarTablero(){ const raw=($("#hEntrar").value||"").trim(); const sl=slugify(raw.replace(/^https?:\/\//,"").replace(/^[^/]*\//,"").split(/[?#]/)[0].split("/").filter(Boolean).pop()||raw); if(sl.length<3){ toast("Pega la liga completa"); return; } goTo(sl); }

/* ---------- cálculos ---------- */
function personLines(p){ const L=[];
  p.gorditas.forEach(l=>L.push(l.cant+" "+l.guiso+(l.detalle?" ("+l.detalle+")":"")+" · "+(l.masa==="maiz"?"🌽 maíz":"🌾 harina")));
  if(p.chilaquiles){ const c=p.chilaquiles;
    const ex=(c.extras||[]).map(x=>x==="Guiso favorito"?(c.guiso?"guiso de "+c.guiso.toLowerCase():"guiso favorito"):x.toLowerCase());
    L.push((c.cant>1?c.cant+" ":"")+"Chilaquiles"+(c.salsa?" salsa "+normSalsa(c.salsa).toLowerCase()+picTxt(c.salsa,"sal"):" (falta salsa)")+(c.queso?" · queso "+c.queso.toLowerCase():" · (falta queso)")+(ex.length?" + "+ex.join(" + "):"")); }
  p.postres.forEach(l=>L.push(l.cant+" "+l.nombre));
  p.bebidas.forEach(l=>L.push(l.cant+" "+l.nombre+(l.detalle?" ("+l.detalle+")":"")));
  return L; }
const masaTag=m=>`<span class="mt ${m==="maiz"?"m-m":"m-h"}">${m==="maiz"?"🌽 Maíz":"🌾 Harina"}</span>`;
const lineaHTML=t=>esc(t).replace(/ · (🌾 harina|🌽 maíz)$/,(_,x)=>" "+masaTag(x.includes("maíz")?"maiz":"harina"));
// Filas por persona: 🌾 harina · 🌽 maíz · 🍳🍰☕ otros, con la etiqueta a la izquierda — RLR
function personaFilas(p){ const H=[],M=[],O=[]; toArr(p.gorditas).forEach(l=>(l.masa==="maiz"?M:H).push(l.cant+" "+l.guiso+(l.detalle?" ("+l.detalle+")":""))); if(p.chilaquiles){ const c=p.chilaquiles; O.push((c.cant>1?c.cant+" ":"")+"🍳 Chilaquiles"+(c.salsa?" "+normSalsa(c.salsa).toLowerCase()+picTxt(c.salsa,"sal"):"")+(c.queso?" · "+c.queso.toLowerCase():"")+(toArr(c.extras).length?" + "+toArr(c.extras).map(x=>x==="Guiso favorito"?(c.guiso?"guiso de "+c.guiso.toLowerCase():"guiso favorito"):x.toLowerCase()).join(" + "):"")); } toArr(p.postres).forEach(l=>O.push(l.cant+" 🍰 "+l.nombre)); toArr(p.bebidas).forEach(l=>O.push(l.cant+" ☕ "+l.nombre+(l.detalle?" ("+l.detalle+")":"")));
  const fila=(cls,tag,arr)=>arr.length?`<div class="pg"><span class="mt ${cls}">${tag}</span><span class="pi">${esc(arr.join(" · "))}</span></div>`:""; return fila("m-h","🌾 Harina",H)+fila("m-m","🌽 Maíz",M)+fila("m-o","Otros",O); }
function lineasDe(c){ const L=[]; toArr(c.personas).forEach((p,pi)=>{ const pid=p.id||("p"+pi); toArr(p.gorditas).forEach((l,i)=>L.push({k:pid+":g:"+i,per:nombreDe(p),n:l.guiso})); if(p.chilaquiles) L.push({k:pid+":ch:0",per:nombreDe(p),n:"Chilaquiles"}); toArr(p.bebidas).forEach((l,i)=>L.push({k:pid+":b:"+i,per:nombreDe(p),n:l.nombre})); toArr(p.postres).forEach((l,i)=>L.push({k:pid+":po:"+i,per:nombreDe(p),n:l.nombre})); }); return L; }
function noHubo(c){ const f=c.faltas||{}; return lineasDe(c).filter(l=>f[l.k]).map(l=>l.n+" ("+l.per+")"); }
function totales(c){ const t={g:0,h:0,m:0,ch:0,b:0,po:0,per:0};
  c.personas.forEach(p=>{ if(personLines(p).length) t.per++;
    p.gorditas.forEach(l=>{ t.g+=l.cant; if(l.masa==="maiz") t.m+=l.cant; else t.h+=l.cant; });
    if(p.chilaquiles) t.ch+=p.chilaquiles.cant||1; p.bebidas.forEach(l=>t.b+=l.cant); p.postres.forEach(l=>t.po+=l.cant); });
  return t; }
function totStr(t){ const s=[]; if(t.g) s.push("🫓 "+t.g+" gordita"+(t.g>1?"s":"")+" (🌾"+t.h+" · 🌽"+t.m+")");
  if(t.ch) s.push("🍳 "+t.ch); if(t.po) s.push("🍰 "+t.po); if(t.b) s.push("☕ "+t.b); return s.length?s.join("  ·  "):"Sin nada todavía"; }
function totCorto(t){ const s=[]; if(t.g) s.push(t.g+" gordita"+(t.g>1?"s":"")); if(t.ch) s.push(t.ch+" chilaquiles"); if(t.po) s.push(t.po+" postre"+(t.po>1?"s":"")); if(t.b) s.push(t.b+" bebida"+(t.b>1?"s":"")); return s.join(" · "); }
// Precios opcionales (⚙️): si Ricardo los captura, se estima cuánto es por familia y en total — RLR
const num=v=>{ const x=parseFloat(String(v||"").replace(/[^0-9.]/g,"")); return isNaN(x)?0:x; };
function hayPrecios(){ return true; }   // siempre hay precio (catálogo de la sucursal o menú base); solo se enseña el TOTAL, nunca por producto — RLR
function costo(c){ if(!hayPrecios()) return null; let t=0; toArr(c.personas).forEach(p=>{ toArr(p.gorditas).forEach(l=>{ t+=(precioDe("g",l.guiso,l.masa)||0)*(+l.cant||0); }); if(p.chilaquiles){ const n=+p.chilaquiles.cant||1; t+=(precioDe("ch","Chilaquiles")||0)*n; toArr(p.chilaquiles.extras).forEach(x=>{ t+=(precioDe("ex",x)||0)*n; }); } toArr(p.bebidas).forEach(l=>{ t+=(precioDe("b",l.nombre)||0)*(+l.cant||0); }); toArr(p.postres).forEach(l=>{ t+=(precioDe("po",l.nombre)||0)*(+l.cant||0); }); }); return t; }
const money=x=>"$"+Math.round(x).toLocaleString("es-MX");
function cierreInfo(){ const c=(config.cierre||"").trim(); const m=/^(\d{1,2}):(\d{2})$/.exec(c); if(!m) return null;
  const d=new Date(); d.setHours(+m[1],+m[2],0,0); const diff=Math.round((d-Date.now())/60000);
  const hora=d.toLocaleTimeString("es-MX",{hour:"numeric",minute:"2-digit"}).replace(/\./g,"");
  return {hora,min:diff,pasado:diff<0}; }
function beep(){ try{ const A=new (window.AudioContext||window.webkitAudioContext)(); const o=A.createOscillator(), g=A.createGain(); o.connect(g); g.connect(A.destination); o.frequency.value=880; g.gain.value=.08; o.start(); o.frequency.setValueAtTime(1175,A.currentTime+.09); o.stop(A.currentTime+.18); }catch(e){} }
function pagoStr(){ const p=config.pago||"efectivo"; const con=num(config.pagoCon); return p==="efectivo"?"Efectivo"+(con?" · pago con "+money(con)+" (favor de traer cambio)":""):p==="transferencia"?"Transferencia":"Tarjeta (favor de traer terminal)"; }

/* ---------- mensaje de WhatsApp — RLR ---------- */
function buildMessage(cards){
  const suc=getSuc(); const L=[];
  L.push("🐸 *PEDIDO RANITAS GORDITAS*");
  L.push("📍 Suc. "+suc.n+" · "+fmtFecha(Date.now()));
  if(config.anfitrion) L.push("👤 "+config.anfitrion+(config.telAnfitrion?" · "+config.telAnfitrion:""));
  if(aDomicilio()){ L.push("🛵 *A DOMICILIO* (+"+money(envioPrecio())+" de envío)"); L.push("🏠 Entregar en: "+((config.direccion||"").trim()||"⚠️ falta la dirección")); } else L.push("🏪 Pasan a recoger a la sucursal");
  L.push("⏰ Para: "+((config.entrega||"").trim()||"lo antes posible"));
  L.push("💵 Pago: "+pagoStr());
  const T={g:0,h:0,m:0,ch:0,b:0,po:0}; cards.forEach(c=>{ const t=totales(c); Object.keys(T).forEach(k=>T[k]+=t[k]); });
  L.push("📦 *Total: "+(totCorto(T)||"sin productos")+"*"+(cards.length>1?" · "+cards.length+" familias":""));
  L.push("");
  const kit={}, beb={}, pos={}; let ch=0, g=0, h=0, m=0, costoTotal=0;
  cards.forEach(c=>{
    L.push("👨‍👩‍👧‍👦 *"+(c.familia||"SIN NOMBRE").toUpperCase()+"*");
    c.personas.forEach(p=>{ const lines=personLines(p); if(!lines.length) return;
      L.push("• *"+nombreDe(p)+"*"+(p.nombre?" ("+rolDe(p).n.toLowerCase()+")":""));
      lines.forEach(l=>L.push("    "+l));
      p.gorditas.forEach(l=>{ const k=l.guiso+(l.detalle?" ("+l.detalle+")":""); kit[k]=kit[k]||{h:0,m:0}; kit[k][l.masa==="maiz"?"m":"h"]+=l.cant; g+=l.cant; if(l.masa==="maiz") m+=l.cant; else h+=l.cant; });
      if(p.chilaquiles) ch+=p.chilaquiles.cant||1;
      p.bebidas.forEach(l=>{ const k=l.nombre+(l.detalle?" ("+l.detalle+")":""); beb[k]=(beb[k]||0)+l.cant; });
      p.postres.forEach(l=>{ pos[l.nombre]=(pos[l.nombre]||0)+l.cant; });
    });
    if(c.notas) L.push("    📝 "+c.notas);
    const $c=costo(c); if($c!=null){ costoTotal+=$c; L.push("    💰 Total: "+money($c)); }
    L.push("");
  });
  // Sin "resumen para cocina": el WhatsApp es solo para tomar el pedido; el desglose lo ve la cocina en su pantalla — RLR
  if(hayPrecios()&&aDomicilio()) L.push("🛵 Envío: "+money(envioPrecio()));
  if(hayPrecios()&&(cards.length>1||aDomicilio())) L.push("💰 *TOTAL: "+money(costoTotal+(aDomicilio()?envioPrecio():0))+"*");
  L.push("");
  L.push("¡Gracias! 🐸");
  return L.join("\n");
}

  if(MESA()){ document.body.classList.add("is-mesa"); if(ui.anf.activa===false&&!ui._mesaOff){ ui._mesaOff=1; toast("Esta mesa ya no está activa. Pide en caja 🙏"); } }
  if(SLUG&&ui.anf&&!MESA()&&!ui._introDone){ ui._introDone=1; let visto=false; try{ visto=!!localStorage.getItem("ranitas-intro"); }catch(e){} if(!visto&&!FAM&&!FAMLIGA) setTimeout(abrirIntro,600); }
