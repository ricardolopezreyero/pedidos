  <div class="card"><h3 style="margin-top:0">Cómo crece una ciudad</h3><ul class="l"><li><b>Apertura</b>: un director/a de ciudad, un CEDIS con jefe, un cocinero de producción, compras y un repartidor de abasto.</li><li><b>Cada frente</b>: encargado, caja, comalero, empacador y uno o dos repartidores. De 4 a 7 personas.</li><li><b>Central</b> no crece con cada ciudad: son las mismas personas cuidando el recetario, el sistema, la expansión y el marketing local.</li></ul></div>`; }

function perfil(pid){ const p=PUESTOS[pid]; if(!p) return `<div class="card">Ese puesto no existe. <a href="#/puestos">Ver puestos</a></div>`; const a=AREAS.find(x=>x.id===p.area); const vac=vacanteEn(pid);

  <div id="gracias" class="card" hidden><div class="ok">✅ <b>¡Recibida!</b> Ya estás en la base de talento de Ranitas para <b>${esc(p.n)}</b>. Cuando haya lugar en tu ciudad te escribimos por WhatsApp. Gracias por tu tiempo y por contestar con calma 🐸</div><p><a class="btn ghost" href="#/puestos">Ver otros puestos</a></p></div>`; }
/* ---------- ruteo ---------- */
function ruta(){ const h=location.hash.replace(/^#\/?/,""); const [pg,id]=h.split("/"); const app=$("#app");
  app.innerHTML=pg===""?home():pg==="manifiesto"?`<h1>Manifiesto</h1>${manif(false)}`:pg==="organigrama"?organigrama():pg==="puestos"?puestos():pg==="puesto"?perfil(id):pg==="postular"?formulario(id):home();
  app.innerHTML+=`<p class="foot">Gorditas Ranitas · Torreón, Coahuila · <a href="https://ranita.capitaltorreon.com/">Pedidos</a> · <a href="https://ranita.capitaltorreon.com/proveedores">Proveedores</a> · postulaciones siempre abiertas</p>`;
  if(pg==="postular"&&PUESTOS[id]) armarForm(id); if(!ruta._same) window.scrollTo(0,0); }
function armarForm(pid){ const p=PUESTOS[pid]; const f=$("#f"); const total=f.querySelectorAll("input[required],select[required],textarea[required]").length;
  const prog=()=>{ let ok=0; f.querySelectorAll("input[required],select[required],textarea[required]").forEach(el=>{ if(el.type==="radio"){ if(f.querySelector(`input[name="${el.name}"]:checked`)) ok++; } else if(el.type==="checkbox"){ if(el.checked) ok++; } else if(el.value.trim()&&(!el.minLength||el.minLength<0||el.value.trim().length>=el.minLength)) ok++; }); $("#prog").style.width=Math.max(5,Math.round(ok/total*100))+"%"; };
  f.addEventListener("input",prog); f.addEventListener("change",prog);
  f.addEventListener("submit",async e=>{ e.preventDefault(); const F=new FormData(f); const wa=String(F.get("wa")||"").replace(/\D/g,"").slice(-10); if(wa.length<10){ $("#err").textContent="Pon un WhatsApp de 10 dígitos."; return; }
    const cerradas=p.cerradas.map((c,i)=>{ const v=+F.get("c"+i); return {q:c.q,r:c.ops[v],ok:v===c.ok}; }); const aciertos=cerradas.filter(x=>x.ok).length;
    const abiertas=p.abiertas.concat(GENERALES).map((q,i)=>({q,r:String(F.get("a"+i)||"").trim()}));
    const ciudad=F.get("ciudad")==="otra"?"":F.get("ciudad");
    const cand={nombre:F.get("nombre"),wa,correo:F.get("correo")||"",edad:F.get("edad"),ciudad,ciudadOtra:F.get("ciudadOtra")||"",colonia:F.get("colonia"),fuente:F.get("fuente")||"",puesto:pid,puestoN:p.n,area:p.area,nivel:F.get("nivel"),disp:F.getAll("disp"),exp:F.get("exp"),ultimo:F.get("ultimo")||"",req:F.getAll("req"),cerradas,aciertos,deCerradas:p.cerradas.length,abiertas,palabras:abiertas.reduce((a,x)=>a+x.r.split(/\s+/).length,0),estado:"nuevo",nivelRanitas:"",ts:Date.now(),ua:navigator.userAgent.slice(0,80)};
    if(!ciudad&&!cand.ciudadOtra){ $("#err").textContent="Dinos tu ciudad."; return; }
    $("#err").textContent="Mandando…"; try{ await db.ref(ROOT+"/talento/candidatos").push(cand); f.hidden=true; $("#gracias").hidden=false; window.scrollTo({top:0,behavior:"smooth"}); }catch(x){ $("#err").textContent="No se pudo mandar. Revisa tu conexión e intenta de nuevo."; } }); }
window.addEventListener("hashchange",ruta); ruta();
</script>
