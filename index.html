/* RLR */
:root{--y:#FFD60A;--y2:#FFF1B8;--y3:#FFFBEA;--r:#E4322B;--r2:#FDE7E5;--g:#2E9E3E;--g2:#E3F5E6;--wa:#25D366;--ink:#231F1A;--mut:#7A736B;--line:#EEE3BF;--card:#fff;--sh:0 6px 18px rgba(90,70,0,.10);--rad:16px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--y3);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;width:100%;outline:none}

h1,h2,h3{margin:0}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--y);padding:10px 12px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.suc{grid-column:1/-1;grid-row:2}
.brand{grid-row:1;grid-column:1}
.hbtns{grid-row:1;grid-column:2}

.brand{font-weight:900;font-size:21px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand b{color:var(--r)}
.brand small{font-weight:800;font-size:13px;color:#6b5a00;margin-left:2px}
.suc{display:flex;align-items:center;gap:6px;min-width:0}
.suc select{width:auto;flex:1;padding:8px 10px;border-radius:10px;font-weight:800;background:#fff}
.suc .tel{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;background:#fff;border-radius:10px;padding:8px 10px;white-space:nowrap}
.suc .tel select{border:0;padding:0;width:auto;font-size:13px;font-weight:800;background:transparent}
.hbtns{display:flex;gap:6px;margin-left:auto;justify-self:end}
.ib{width:38px;height:38px;border-radius:12px;border:0;background:#fff;font-size:18px;display:grid;place-items:center;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block;margin-left:4px}
.dot.on{background:var(--g);box-shadow:0 0 0 3px rgba(46,158,62,.2)}

/* ---------- tabs (móvil) ---------- */
.tabs{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;white-space:nowrap;border:0;background:#fff;border-radius:12px;padding:9px 10px;font-weight:800;font-size:13.5px;color:var(--mut);box-shadow:0 1px 0 rgba(0,0,0,.05)}
.tab.on{background:var(--ink);color:var(--y)}
.tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.08);font-size:12px;margin-left:4px}
.tab.on .n{background:rgba(255,214,10,.25)}

/* ---------- board ---------- */
.board{padding:10px;display:block}
.col{display:none}
.col.on{display:block}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 10px;font-weight:900;font-size:16px}
.col-head .n{background:#fff;border-radius:999px;padding:2px 9px;font-size:12px;color:var(--mut);margin-left:6px}
.col-tools{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{background:#fff;border:1.5px dashed var(--line);border-radius:var(--rad);padding:22px 16px;text-align:center;color:var(--mut);font-weight:700}
.empty span{font-size:28px;display:block;margin-bottom:6px}
@media(min-width:960px){
  .tabs{display:none}
  .board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;padding:14px;align-items:start}
  .col{display:block;background:rgba(255,255,255,.45);border-radius:18px;padding:8px;min-height:60vh}
}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--sh);padding:12px 12px 10px;border:2px solid transparent}
.card.mine{border-color:var(--y)}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-top h3{font-size:16.5px;font-weight:900}
.card-top .when{font-size:12px;color:var(--mut);white-space:nowrap;font-weight:700}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 7px}
.b{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#f2ecd6;color:#6b5a00}

.b.wip{background:var(--r2);color:var(--r)}
.b.tuyo{background:var(--y);color:#5a4a00}
.b.suc{background:#eef3ff;color:#2b4a9e}
.b.live{background:var(--r);color:#fff;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.online{font-size:12px;font-weight:800;color:#6b5a00;margin-left:6px;white-space:nowrap}

.card.flash{animation:cardflash 1.8s ease-out}

.card.typing{border-color:var(--r)}
.pl.flash{animation:plflash 1.8s ease-out;border-radius:6px}
@keyframes plflash{0%{background:#FFE98A}100%{background:transparent}}
.caret{display:inline-block;color:var(--r);font-weight:900;animation:blink .9s steps(2,start) infinite;margin-left:1px}
@keyframes blink{to{visibility:hidden}}
.persons{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.pl b{font-weight:900}
.pl i{color:var(--mut)}
.pl .l{color:#3c3630}
.notas{margin-top:6px;font-size:13px;color:#5a4a00;background:var(--y2);border-radius:8px;padding:5px 8px}
.tot{margin-top:8px;font-size:12.5px;font-weight:800;color:var(--mut);display:flex;gap:10px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;font-size:13.5px;background:#f2ecd6;color:var(--ink);display:inline-flex;align-items:center;gap:5px;justify-content:center;line-height:1.1}

.btn.y{background:var(--y);color:#3d3200}
.btn.wa{background:var(--wa);color:#fff}
.btn.r{background:var(--r2);color:var(--r)}

.btn.big{padding:13px 16px;font-size:15px;border-radius:14px;width:100%;flex-wrap:wrap}
.btn.big .sm{width:100%;font-size:11.5px;margin-top:1px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .sm{font-size:11px;opacity:.8;font-weight:700}
.hint{background:#fff;border-radius:var(--rad);padding:10px 12px;font-size:13px;color:#4a4238;display:flex;gap:8px;align-items:flex-start;box-shadow:var(--sh)}

.sheet .head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .head h2{font-size:18px;font-weight:900;flex:1}

.sheet .foot{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff}

@media(min-width:760px){.modal{align-items:center;padding:20px}.sheet{border-radius:22px;max-height:90vh}}
.x{width:36px;height:36px;border-radius:50%;border:0;background:#f2ecd6;font-size:16px;font-weight:900}
label.f{display:block;font-weight:800;font-size:13px;color:var(--mut);margin:10px 0 4px}
label.f input,label.f textarea,label.f select{margin-top:4px;font-weight:700}
.fam input{font-size:18px;font-weight:900}

/* ---------- editor: personas ---------- */
.persona{background:var(--y3);border:1.5px solid var(--line);border-radius:18px;padding:12px;margin:12px 0}
.p-head{display:flex;align-items:center;gap:8px}
.p-emoji{font-size:26px;width:36px;text-align:center}
.p-name{flex:1;font-weight:900;font-size:16px;padding:9px 12px}
.p-head .ib{background:#fff;width:36px;height:36px;font-size:15px}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px;font-weight:900;font-size:14px}
.seg{display:inline-flex;background:#ECE4C8;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:900;font-size:13px;color:#6b5a00}
.seg button.on{background:var(--ink);color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:800;font-size:13.5px;display:inline-flex;align-items:center;gap:5px}
.chip:active{transform:scale(.97)}
.chip.has{border-color:var(--g);background:var(--g2)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--y)}

.line{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line);flex-wrap:wrap}
.line:first-child{border-top:0}

.sub{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px}
.sub .t{font-weight:900;font-size:13.5px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.sub .t>button{border:0;background:transparent;color:var(--r);font-weight:800;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.row .lbl{font-size:12px;font-weight:900;color:var(--mut);width:100%;text-transform:uppercase;letter-spacing:.3px}
.addp{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 4px;font-weight:800;color:var(--mut);font-size:13px}
.addp .btn{background:#fff;border:1.5px solid var(--line)}

/* ---------- mensaje ---------- */
textarea.msg{width:100%;min-height:46vh;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.45;white-space:pre;resize:vertical}

.famlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.famlist button{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.famlist button b{font-size:15px}
.famlist button span{font-size:12.5px;color:var(--mut);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;opacity:0;transition:.2s;z-index:99;pointer-events:none;max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

  if(d<60) return "ahora"; if(d<3600) return "hace "+Math.floor(d/60)+" min"; if(d<86400) return "hace "+Math.floor(d/3600)+" h";
  if(d<86400*14) return "hace "+Math.floor(d/86400)+" días"; return fmtFecha(ts,false); }
function fmtFecha(ts,hora=true){ const o={day:"numeric",month:"short"}; if(hora){o.hour="numeric";o.minute="2-digit";} return new Date(ts).toLocaleString("es-MX",o).replace(/\./g,""); }
function toast(t){ const e=$("#toast"); e.textContent=t; e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"),2200); }

/* ---------- persistencia (local + Firebase) — RLR ---------- */
function cacheLocal(){ try{ localStorage.setItem("ranitas-pedidos",JSON.stringify(pedidos)); localStorage.setItem("ranitas-config",JSON.stringify(config)); }catch(e){} }
function saveMine(){ localStorage.setItem("ranitas-mine",JSON.stringify([...mine])); }
function saveCard(card,silent){ card.actualizado=Date.now(); card._w=SID; pedidos[card.id]=card; cacheLocal();
  if(db) db.ref(PATH+"/pedidos/"+card.id).set(clone(card)).catch(()=>{});
  if(!silent) renderBoard(); }
function deleteCard(id){ delete pedidos[id]; cacheLocal(); if(db) db.ref(PATH+"/pedidos/"+id).remove().catch(()=>{}); renderBoard(); }
function saveConfig(){ cacheLocal(); if(db) db.ref(PATH+"/config").set(clone(config)).catch(()=>{}); renderHeader(); }
function queueSave(){ ui.lastLocalEdit=Date.now(); touchPresence(); clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ if(ui.draft) saveCard(ui.draft); },120); }

/* ---------- presencia en vivo (quién está escribiendo / quién está viendo) — RLR ---------- */
function presRef(){ return (db&&ui.editing)?db.ref(PATH+"/presence/"+ui.editing+"/"+SID):null; }
function setPresence(){ const r=presRef(); if(!r) return; r.set({ts:Date.now(),fam:(ui.draft&&ui.draft.familia)||""}).catch(()=>{}); r.onDisconnect().remove(); }
function touchPresence(){ const now=Date.now(); if(now-presTimer<700) return; presTimer=now; setPresence(); }
function clearPresence(id){ if(db&&id) db.ref(PATH+"/presence/"+id+"/"+SID).remove().catch(()=>{}); }
function heartbeat(){ if(!db) return; const r=db.ref(PATH+"/online/"+SID); r.set({ts:Date.now()}).catch(()=>{}); r.onDisconnect().remove(); }
function typingOn(id){ const p=ui.presence[id]||{}; const now=Date.now();
  return Object.keys(p).filter(k=>k!==SID&&now-(p[k].ts||0)<6000).map(k=>p[k]); }
function onlineCount(){ const now=Date.now(); return Object.values(ui.online).filter(o=>now-(o.ts||0)<3*60000).length; }

function initFirebase(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database();
    db.ref(".info/connected").on("value",s=>{ online=!!s.val(); if(online){ heartbeat(); if(ui.editing) setPresence(); } renderHeader(); });
    db.ref(PATH+"/presence").on("value",s=>{ ui.presence=s.val()||{}; renderBoard(); });
    db.ref(PATH+"/online").on("value",s=>{ ui.online=s.val()||{}; renderHeader(); });
    setInterval(heartbeat,45000);
    db.ref(PATH+"/config").on("value",s=>{ const v=s.val(); if(v) config=Object.assign({},config,v); else db.ref(PATH+"/config").set(clone(config)).catch(()=>{}); cacheLocal(); renderHeader(); if($("#mCfg").classList.contains("open")) renderCfg(); });
    db.ref(PATH+"/pedidos").on("value",s=>{
      const v=s.val()||{}; const next={};
      Object.keys(v).forEach(k=>{ next[k]=normCard(Object.assign({id:k},v[k])); });
      if(ui.editing&&ui.draft){
        const rem=next[ui.editing];
        // Otra pantalla cambió la tarjeta que tengo abierta y yo llevo >1.2 s sin teclear: adopto su versión sin perder el foco.
        if(rem&&rem._w&&rem._w!==SID&&Date.now()-ui.lastLocalEdit>1200&&JSON.stringify(rem)!==JSON.stringify(ui.draft)){ ui.draft=clone(rem); ui.draft.listo=false; renderEditor(); }
        else next[ui.editing]=ui.draft;   // mi borrador manda mientras escribo
      }
      pedidos=next; cacheLocal(); renderBoard();
    });
  }catch(e){ db=null; renderHeader(); }
}

/* ---------- cálculos ---------- */
function personLines(p){ const L=[];
  p.gorditas.forEach(l=>L.push(l.cant+" "+l.guiso+(l.detalle?" ("+l.detalle+")":"")+" · "+(l.masa==="maiz"?"maíz":"harina")));
  if(p.chilaquiles){ const c=p.chilaquiles;
    const ex=(c.extras||[]).map(x=>x==="Guiso favorito"?(c.guiso?"guiso de "+c.guiso.toLowerCase():"guiso favorito"):x.toLowerCase());
    L.push((c.cant>1?c.cant+" ":"")+"Chilaquiles"+(c.salsa?" salsa "+c.salsa.toLowerCase():" (falta salsa)")+(c.queso?" · queso "+c.queso.toLowerCase():" · (falta queso)")+(ex.length?" + "+ex.join(" + "):"")); }
  p.bebidas.forEach(l=>L.push(l.cant+" "+l.nombre+(l.detalle?" ("+l.detalle+")":"")));
  p.postres.forEach(l=>L.push(l.cant+" "+l.nombre));
  return L; }
function totales(c){ const t={g:0,h:0,m:0,ch:0,b:0,po:0,per:0};
  c.personas.forEach(p=>{ if(personLines(p).length) t.per++;
    p.gorditas.forEach(l=>{ t.g+=l.cant; if(l.masa==="maiz") t.m+=l.cant; else t.h+=l.cant; });
    if(p.chilaquiles) t.ch+=p.chilaquiles.cant||1; p.bebidas.forEach(l=>t.b+=l.cant); p.postres.forEach(l=>t.po+=l.cant); });
  return t; }
function totStr(t){ const s=[]; if(t.g) s.push("🫓 "+t.g+" gordita"+(t.g>1?"s":"")+" ("+t.h+"H · "+t.m+"M)");
  if(t.ch) s.push("🍳 "+t.ch); if(t.b) s.push("☕ "+t.b); if(t.po) s.push("🍰 "+t.po); return s.length?s.join("  ·  "):"Sin nada todavía"; }

/* ---------- mensaje de WhatsApp — RLR ---------- */
function buildMessage(cards){
  const suc=getSuc(); const L=[];
  L.push("🐸 *PEDIDO RANITAS GORDITAS*");
  L.push("📍 Suc. "+suc.n+" · "+fmtFecha(Date.now()));
  if(config.anfitrion) L.push("👤 "+config.anfitrion+(config.telAnfitrion?" · "+config.telAnfitrion:""));
  if(config.direccion) L.push("🏠 Entregar en: "+config.direccion);
  L.push("");
  const kit={}, beb={}, pos={}; let ch=0, g=0, h=0, m=0;
  cards.forEach(c=>{
    L.push("👨‍👩‍👧‍👦 *FAMILIA "+(c.familia||"SIN NOMBRE").toUpperCase()+"*");
    c.personas.forEach(p=>{ const lines=personLines(p); if(!lines.length) return;
      L.push("• *"+nombreDe(p)+"*"+(p.nombre?" ("+rolDe(p).n.toLowerCase()+")":""));
      lines.forEach(l=>L.push("    "+l));
      p.gorditas.forEach(l=>{ const k=l.guiso+(l.detalle?" ("+l.detalle+")":""); kit[k]=kit[k]||{h:0,m:0}; kit[k][l.masa==="maiz"?"m":"h"]+=l.cant; g+=l.cant; if(l.masa==="maiz") m+=l.cant; else h+=l.cant; });
      if(p.chilaquiles) ch+=p.chilaquiles.cant||1;
      p.bebidas.forEach(l=>{ const k=l.nombre+(l.detalle?" ("+l.detalle+")":""); beb[k]=(beb[k]||0)+l.cant; });
      p.postres.forEach(l=>{ pos[l.nombre]=(pos[l.nombre]||0)+l.cant; });
    });
    if(c.notas) L.push("    📝 "+c.notas);
    L.push("");
  });
  L.push("🧮 *RESUMEN PARA COCINA*");
  L.push("🫓 Gorditas: "+g+(g?" ("+h+" harina · "+m+" maíz)":""));
  Object.keys(kit).sort().forEach(k=>{ const v=kit[k]; const parts=[]; if(v.h) parts.push(v.h+" harina"); if(v.m) parts.push(v.m+" maíz"); L.push("    · "+k+": "+parts.join(", ")); });
  if(ch) L.push("🍳 Chilaquiles: "+ch);
  const bk=Object.keys(beb); if(bk.length) L.push("☕ Bebidas: "+bk.reduce((a,k)=>a+beb[k],0)+" ("+bk.map(k=>beb[k]+" "+k.toLowerCase()).join(", ")+")");
  const pk=Object.keys(pos); if(pk.length) L.push("🍰 Postres: "+pk.reduce((a,k)=>a+pos[k],0)+" ("+pk.map(k=>pos[k]+" "+k.toLowerCase()).join(", ")+")");
  L.push("");
  L.push("¡Gracias! 🐸");
  return L.join("\n");
}

const sorters={armando:(a,b)=>a.creado-b.creado,pedido:(a,b)=>(b.pedidoEn||0)-(a.pedidoEn||0),entregado:(a,b)=>(b.entregadoEn||0)-(a.entregadoEn||0),archivado:(a,b)=>(b.archivadoEn||0)-(a.archivadoEn||0)};

function renderBoard(){
  // ¿Qué cambió desde el último render? (solo brillan los cambios que vienen de OTRA pantalla)
  const snap={}; const now=Date.now(); ui.flash=ui.flash||{};
  Object.keys(ui.flash).forEach(k=>{ if(now-ui.flash[k].ts>1800) delete ui.flash[k]; });   // el destello dura 1.8 s aunque haya otros renders
  Object.values(pedidos).forEach(c=>{ const per={}; c.personas.forEach(p=>per[p.id]=nombreDe(p)+"|"+personLines(p).join("|")); snap[c.id]={j:JSON.stringify(c),per};
    const prev=prevSnap[c.id]; if(firstRender||c._w===SID) return;
    if(!prev){ ui.flash[c.id]={card:true,per:{},ts:now}; return; }
    if(prev.j!==snap[c.id].j){ const f=ui.flash[c.id]||{card:true,per:{}}; f.card=true; f.ts=now; Object.keys(per).forEach(k=>{ if(prev.per[k]!==per[k]) f.per[k]=true; }); ui.flash[c.id]=f; } });
  prevSnap=snap; firstRender=false;
  const counts={}; ESTADOS.forEach(e=>counts[e.id]=cardsIn(e.id).length);
  $("#tabs").innerHTML=ESTADOS.map(e=>`<button class="tab${ui.tab===e.id?" on":""}" data-a="tab" data-v="${e.id}">${e.e} ${e.n}<span class="n">${counts[e.id]}</span></button>`).join("");
  $("#board").innerHTML=ESTADOS.map(e=>{
    const cards=cardsIn(e.id);
    let tools="";
    if(e.id==="armando"){
      const hint=localStorage.getItem("ranitas-hint")?"":`<div class="hint">🐸 <div><b>¿Cómo funciona?</b> Toca <b>+ Pedido de familia</b>, pon a cada quien con sus gorditas y dale <b>Listo</b>. ${esc(config.anfitrion||"El anfitrión")} manda todo junto a la sucursal por WhatsApp.</div><button data-a="hideHint" title="Cerrar">✕</button></div>`;

      <div class="col-head"><span>${e.e} ${e.n}<span class="n">${cards.length}</span></span></div>${tools}
      <div class="cards">${cards.length?cards.map(cardHTML).join(""):emptyHTML(e.id)}</div></section>`;
  }).join("");

/* ---------- crear / clonar ---------- */
function nuevaPersona(rol){ return normPersona({rol,masa:"harina"}); }
function crearPedido(from){
  const c=from?normCard(clone(from)):normCard({familia:"",personas:[nuevaPersona("papa"),nuevaPersona("mama")]});
  c.id=uid(); c.estado="armando"; c.listo=false; c.creado=Date.now(); c.actualizado=c.creado;
  delete c.pedidoEn; delete c.entregadoEn; delete c.archivadoEn; delete c.mensaje; delete c.sucursal; delete c.tel;
  c.personas.forEach(p=>p.id=uid());
  mine.add(c.id); saveMine(); saveCard(c); ui.tab="armando"; openEditor(c.id);
  if(from) toast("Pedido copiado de Familia "+(from.familia||"sin nombre")+". Ajusta lo que cambie.");
}
function familiasHistorial(){ const m={};
  Object.values(pedidos).filter(c=>c.estado!=="armando").forEach(c=>{ const k=(c.familia||"").trim().toLowerCase(); if(!k) return; const ts=c.pedidoEn||c.actualizado; if(!m[k]||ts>m[k].ts) m[k]={c,ts}; });
  return Object.values(m).sort((a,b)=>b.ts-a.ts).map(x=>x.c); }
function openNuevo(){

  body.scrollTop=st; updateSum();
  if(fk){ let sel=`[data-in="${fk.in}"]`; if(fk.p!=null) sel+=`[data-p="${fk.p}"]`; if(fk.i!=null) sel+=`[data-i="${fk.i}"]`;
    const el=body.querySelector(sel); if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(fk.s,fk.e); }catch(e){} } }
}
function updateSum(){ if(ui.draft) $("#edSum").textContent=totStr(totales(ui.draft)); }
function personaHTML(p,pi){
  const r=rolDe(p); const cnt={}; p.gorditas.forEach(l=>{ cnt[l.guiso]=cnt[l.guiso]||{harina:0,maiz:0}; cnt[l.guiso][l.masa]+=l.cant; });
  const chips=GUISOS.map(g=>{ const c=cnt[g.n]; const b=c?[c.harina?c.harina+"H":"",c.maiz?c.maiz+"M":""].filter(Boolean).join("·"):"";
    return `<button class="chip${c?" has":""}" data-a="addG" data-p="${pi}" data-v="${esc(g.n)}">${esc(g.n)}${g.pic?`<span class="pic">${"🌶".repeat(g.pic)}</span>`:""}${b?`<span class="cnt">${b}</span>`:""}</button>`; }).join("");
  const lines=p.gorditas.map((l,i)=>`<div class="line"><span class="qty"><button data-a="gQty" data-p="${pi}" data-i="${i}" data-v="-1">−</button><span class="lq">${l.cant}</span><button data-a="gQty" data-p="${pi}" data-i="${i}" data-v="1">+</button></span><span class="ln">${esc(l.guiso)}<em>${l.masa==="maiz"?"maíz":"harina"}</em></span>
    ${l.guiso==="Combinada"?`<input class="det" data-in="gdet" data-p="${pi}" data-i="${i}" value="${esc(l.detalle)}" placeholder="¿de qué?">`:""}</div>`).join("");
  const openB=ui.open[p.id+"b"]||p.bebidas.length, openP=ui.open[p.id+"p"]||p.postres.length;
  return `<section class="persona">
    <div class="p-head"><span class="p-emoji">${r.e}</span><input class="p-name" data-in="nombre" data-p="${pi}" value="${esc(p.nombre)}" placeholder="Nombre (${r.n})" autocomplete="off">
      <button class="ib" data-a="dupPersona" data-p="${pi}" title="Duplicar pedido de esta persona">⧉</button><button class="ib" data-a="delPersona" data-p="${pi}" title="Quitar">✕</button></div>
    <div class="sec-head"><span>🫓 Gorditas</span><div class="seg"><button class="${p.masa!=="maiz"?"on":""}" data-a="masa" data-p="${pi}" data-v="harina">Harina</button><button class="${p.masa==="maiz"?"on":""}" data-a="masa" data-p="${pi}" data-v="maiz">Maíz</button></div></div>
    <div class="chips">${chips}</div>
    <div class="lines">${lines}</div>
    <div class="p-extras">
      <button class="pill${p.chilaquiles?" on":""}" data-a="togChil" data-p="${pi}">🍳 Chilaquiles</button>
      <button class="pill${openB?" on":""}" data-a="togSec" data-p="${pi}" data-v="b">☕ Bebida</button>
      <button class="pill${openP?" on":""}" data-a="togSec" data-p="${pi}" data-v="p">🍰 Postre</button>
    </div>
    ${p.chilaquiles?chilHTML(p,pi):""}
    ${openB?subHTML(p,pi,"bebidas",BEBIDAS,"☕ Bebida","addB","bQty","bdet"):""}
    ${openP?subHTML(p,pi,"postres",POSTRES,"🍰 Postre","addP","pQty",null):""}
  </section>`;
}
function subHTML(p,pi,key,items,title,addA,qtyA,detIn){
  const have={}; p[key].forEach(l=>have[l.nombre]=(have[l.nombre]||0)+l.cant);
  return `<div class="sub"><div class="t">${title}<button data-a="togSec" data-p="${pi}" data-v="${key==="bebidas"?"b":"p"}" data-x="1">quitar</button></div>
    <div class="chips">${items.map(it=>`<button class="chip${have[it.n]?" has":""}" data-a="${addA}" data-p="${pi}" data-v="${esc(it.n)}">${esc(it.n)}${have[it.n]?`<span class="cnt">${have[it.n]}</span>`:""}</button>`).join("")}</div>
    <div class="lines">${p[key].map((l,i)=>{ const it=items.find(x=>x.n===l.nombre); return `<div class="line"><span class="qty"><button data-a="${qtyA}" data-p="${pi}" data-i="${i}" data-v="-1">−</button><span class="lq">${l.cant}</span><button data-a="${qtyA}" data-p="${pi}" data-i="${i}" data-v="1">+</button></span><span class="ln">${esc(l.nombre)}</span>
      ${detIn&&it&&it.det?`<input class="det" data-in="${detIn}" data-p="${pi}" data-i="${i}" value="${esc(l.detalle)}" placeholder="${esc(it.det)}">`:""}</div>`; }).join("")}</div></div>`;
}
function chilHTML(p,pi){ const c=p.chilaquiles;
  return `<div class="sub"><div class="t">🍳 Chilaquiles <span class="qty" style="margin-left:auto;margin-right:8px"><button data-a="chQty" data-p="${pi}" data-v="-1">−</button><span class="lq">${c.cant}</span><button data-a="chQty" data-p="${pi}" data-v="1">+</button></span><button data-a="togChil" data-p="${pi}">quitar</button></div>
    <div class="row"><span class="lbl">1 · Salsa</span>${SALSAS.map(s=>`<button class="chip${c.salsa===s?" on":""}" data-a="chSet" data-p="${pi}" data-k="salsa" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="row"><span class="lbl">2 · Queso</span>${QUESOS.map(s=>`<button class="chip${c.queso===s?" on":""}" data-a="chSet" data-p="${pi}" data-k="queso" data-v="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    <div class="row"><span class="lbl">3 · Agrega (opcional)</span>${EXTRAS.map(s=>`<button class="chip${c.extras.includes(s)?" on":""}" data-a="chExtra" data-p="${pi}" data-v="${esc(s)}">${esc(s)}</button>`).join("")}
      ${c.extras.includes("Guiso favorito")?`<select data-in="chGuiso" data-p="${pi}" style="margin-top:4px"><option value="">¿Qué guiso?</option>${GUISOS.filter(g=>g.n!=="Combinada").map(g=>`<option${c.guiso===g.n?" selected":""}>${esc(g.n)}</option>`).join("")}</select>`:""}</div></div>`;
}

/* ---------- mensaje / envío ---------- */
function openMessage(cards,markIds){
  const msg=buildMessage(cards); ui.msgIds=markIds; ui.msgText=msg;
  const pend=cards.filter(c=>c.estado==="armando"&&!c.listo);
  $("#msgBody").innerHTML=`${pend.length?`<div class="warn">⚠️ Todavía armando: ${esc(pend.map(c=>"Familia "+(c.familia||"sin nombre")).join(", "))}. Puedes mandar de todas formas.</div>`:""}
    <div style="font-weight:800;color:var(--mut);font-size:13px;margin-bottom:6px">Va a: 📍 ${esc(getSuc().n)} · 📲 ${fmtTel(getTel())}</div><textarea class="msg" readonly>${esc(msg)}</textarea>`;
  $("#msgFoot").innerHTML=`<button class="btn" data-a="copiar">📋 Copiar</button><a class="btn wa" href="${waLink(getTel(),msg)}" target="_blank" rel="noopener" data-a="abrirWa">📲 Abrir WhatsApp</a>
    ${markIds?`<button class="btn p" data-a="marcarVarios">✅ Ya se pidió (${markIds.length})</button>`:""}`;
  show("mMsg");
}
function marcar(id,estado){ const c=pedidos[id]; if(!c) return; c.estado=estado; c.listo=true;
  if(estado==="pedido"){ c.pedidoEn=Date.now(); c.sucursal=config.sucursal; c.tel=getTel(); if(!c.mensaje) c.mensaje=buildMessage([c]); }
  if(estado==="entregado") c.entregadoEn=Date.now();
  if(estado==="archivado") c.archivadoEn=Date.now();
  if(estado==="armando"){ c.listo=false; delete c.pedidoEn; }
  saveCard(c); }

/* ---------- compartir ---------- */
async function compartir(){ const text="🐸 Pide tus gorditas Ranitas aquí: "+APP_URL+"\nArma el pedido de tu familia y yo lo mando a la sucursal.";
  try{ if(navigator.share){ await navigator.share({title:"Ranitas · Pedidos",text}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("Liga copiada 🔗"); }catch(e){ window.open("https://api.whatsapp.com/send?text="+encodeURIComponent(text),"_blank"); } }

/* ---------- config ---------- */
function renderCfg(){ $("#cfgBody").innerHTML=`
  <label class="f">Anfitrión (quien manda el pedido)<input data-cfg="anfitrion" value="${esc(config.anfitrion)}" placeholder="Ricardo"></label>
  <label class="f">Teléfono del anfitrión (para el mensaje)<input data-cfg="telAnfitrion" value="${esc(config.telAnfitrion)}" placeholder="871 000 00 00" inputmode="tel"></label>
  <label class="f">Dirección de entrega<textarea data-cfg="direccion" rows="3" placeholder="Calle, número, colonia · referencias">${esc(config.direccion)}</textarea></label>
  <label class="f">Sucursal para pedir<select data-cfg="sucursal">${SUCURSALES.map(s=>`<option value="${s.id}"${s.id===config.sucursal?" selected":""}>${s.n} · ${s.tels.map(fmtTel).join(" / ")}</option>`).join("")}</select></label>
  <p style="font-size:12.5px;color:var(--mut);font-weight:700">Servicio a domicilio en las 4 sucursales (también Uber Eats, DiDi Food y Rappi). Los cambios se guardan solos.</p>`; }
$("#btnCfg").addEventListener("click",()=>{ renderCfg(); show("mCfg"); });
$("#btnShare").addEventListener("click",compartir);
document.addEventListener("input",e=>{ const el=e.target.closest("[data-cfg]"); if(!el) return; config[el.dataset.cfg]=el.value.trim?el.value:el.value; if(el.dataset.cfg==="sucursal") config.telIdx=0; clearTimeout(saveTimer); saveTimer=setTimeout(saveConfig,400); });
$("#mCfg").addEventListener("input",()=>{});

/* ---------- eventos del editor ---------- */
document.addEventListener("input",e=>{ const el=e.target.closest("[data-in]"); if(!el||!ui.draft) return; const d=ui.draft; const k=el.dataset.in; const p=d.personas[+el.dataset.p]; const i=+el.dataset.i;
  if(k==="familia") d.familia=el.value; else if(k==="notas") d.notas=el.value; else if(k==="nombre") p.nombre=el.value;
  else if(k==="gdet") p.gorditas[i].detalle=el.value; else if(k==="bdet") p.bebidas[i].detalle=el.value; else if(k==="chGuiso") p.chilaquiles.guiso=el.value;
  queueSave(); });

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el) return; const a=el.dataset.a, v=el.dataset.v, id=el.dataset.id; const d=ui.draft; const pi=+el.dataset.p; const p=d&&d.personas[pi]; const i=+el.dataset.i;
  const R=()=>{ renderEditor(); queueSave(); };
  switch(a){
    case "tab": ui.tab=v; renderBoard(); break;
    case "hideHint": localStorage.setItem("ranitas-hint","1"); renderBoard(); break;
    case "nuevo": openNuevo(); break;
    case "crear": hide("mNuevo"); crearPedido(null); break;
    case "repetir": hide("mNuevo"); crearPedido(pedidos[id]); break;
    case "edit": openEditor(id); break;
    case "del": { const c=pedidos[id]; if(c&&confirm("¿Eliminar el pedido de Familia "+(c.familia||"sin nombre")+"?")){ deleteCard(id); toast("Pedido eliminado"); } break; }
    case "marcar": marcar(id,v); if(v==="pedido"){ ui.tab="pedido"; toast("Marcado como pedido 📲"); } if(v==="entregado"){ ui.tab="entregado"; toast("¡Buen provecho! 🛵"); } if(v==="archivado"){ ui.tab="archivado"; toast("Archivado. Lo puedes repetir cuando quieras 🔁"); } renderBoard(); break;
    case "enviarTodo": { const cards=cardsIn("armando"); if(!cards.length) return; openMessage(cards,cards.map(c=>c.id)); break; }
    case "enviarUno": openMessage([pedidos[id]],[id]); break;
    case "verMsg": { const c=pedidos[id]; ui.msgIds=null; ui.msgText=c.mensaje||buildMessage([c]);
      $("#msgBody").innerHTML=`<textarea class="msg" readonly>${esc(ui.msgText)}</textarea>`;
      $("#msgFoot").innerHTML=`<button class="btn" data-a="copiar">📋 Copiar</button><a class="btn wa" href="${waLink(c.tel||getTel(),ui.msgText)}" target="_blank" rel="noopener">📲 Reenviar por WhatsApp</a>`; show("mMsg"); break; }
    case "copiar": navigator.clipboard.writeText(ui.msgText).then(()=>toast("Mensaje copiado 📋"),()=>{ const t=$("#msgBody textarea"); t.select(); document.execCommand("copy"); toast("Mensaje copiado 📋"); }); break;
    case "abrirWa": break;
    case "marcarVarios": { (ui.msgIds||[]).forEach(x=>{ const c=pedidos[x]; if(c){ c.mensaje=ui.msgText; marcar(x,"pedido"); } }); hide("mMsg"); ui.tab="pedido"; renderBoard(); toast("Pedido registrado 📲 · "+ui.msgIds.length+" familia"+(ui.msgIds.length===1?"":"s")); break; }
    case "close": hide(v); if(v==="mCfg"){ saveConfig(); renderBoard(); } break;
    case "closeEditor": closeEditor(v==="1"); break;
    /* editor */
    case "addPersona": d.personas.push(nuevaPersona(v)); R(); setTimeout(()=>{ const ins=$("#edBody").querySelectorAll(".p-name"); const last=ins[ins.length-1]; if(last){ last.scrollIntoView({block:"center",behavior:"smooth"}); last.focus(); } },50); break;
    case "delPersona": if(!personLines(p).length||confirm("¿Quitar a "+nombreDe(p)+" y su pedido?")){ d.personas.splice(pi,1); R(); } break;
    case "dupPersona": { const c=clone(p); c.id=uid(); c.nombre=""; d.personas.splice(pi+1,0,c); R(); toast("Copiado. Ponle nombre 👇"); break; }
    case "masa": p.masa=v; R(); break;
    case "addG": { const masa=p.masa||"harina"; const l=p.gorditas.find(x=>x.guiso===v&&x.masa===masa); if(l) l.cant++; else p.gorditas.push({guiso:v,masa,cant:1,detalle:""}); R(); break; }
    case "gQty": p.gorditas[i].cant+=+v; if(p.gorditas[i].cant<=0) p.gorditas.splice(i,1); R(); break;
    case "togChil": if(p.chilaquiles) p.chilaquiles=null; else p.chilaquiles={salsa:"",queso:"",extras:[],guiso:"",cant:1}; R(); break;
    case "chSet": p.chilaquiles[el.dataset.k]=(p.chilaquiles[el.dataset.k]===v?"":v); R(); break;
    case "chExtra": { const ex=p.chilaquiles.extras; const k=ex.indexOf(v); if(k>=0) ex.splice(k,1); else ex.push(v); R(); break; }
    case "chQty": p.chilaquiles.cant=Math.max(1,p.chilaquiles.cant+(+v)); R(); break;
    case "togSec": { const key=v==="b"?"bebidas":"postres"; const k=p.id+v; if(el.dataset.x||ui.open[k]||p[key].length){ ui.open[k]=false; p[key]=[]; } else ui.open[k]=true; R(); break; }
    case "addB": { const l=p.bebidas.find(x=>x.nombre===v); if(l) l.cant++; else p.bebidas.push({nombre:v,cant:1,detalle:""}); R(); break; }
    case "bQty": p.bebidas[i].cant+=+v; if(p.bebidas[i].cant<=0) p.bebidas.splice(i,1); R(); break;
    case "addP": { const l=p.postres.find(x=>x.nombre===v); if(l) l.cant++; else p.postres.push({nombre:v,cant:1}); R(); break; }
    case "pQty": p.postres[i].cant+=+v; if(p.postres[i].cant<=0) p.postres.splice(i,1); R(); break;
  }
});
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{ if(e.target===m){ if(m.id==="mEditor") closeEditor(false); else { m.classList.remove("open"); if(m.id==="mCfg"){ saveConfig(); renderBoard(); } } } }));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#mEditor").classList.contains("open")) closeEditor(false); ["mNuevo","mMsg","mCfg"].forEach(hide); } });

/* ---------- arranque ---------- */
Object.keys(pedidos).forEach(k=>pedidos[k]=normCard(Object.assign({id:k},pedidos[k])));
renderHeader(); renderBoard(); initFirebase();
setInterval(()=>{ if(!ui.editing) renderBoard(); },60000);   // refresca "hace X min"
setInterval(()=>{ if(Object.keys(ui.presence).length||Object.keys(ui.flash||{}).length) renderBoard(); },2500);   // apaga "escribiendo…" cuando paran
window.addEventListener("beforeunload",()=>{ if(ui.editing) clearPresence(ui.editing); });
</script>
